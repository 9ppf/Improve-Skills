      <div class="stage-overall" id="stageOverall"></div>
      <div class="stage-roadmap" id="stageRoadmap"></div>
    </section>

    <!-- 5-Step Loop -->
    <section class="python-card">
      <h2 class="python-section-title">学习闭环 <span class="python-tag">5 步</span></h2>
      <div class="python-flow">
        <div class="python-step">
          <span class="python-step-no">1</span>
          <span class="python-step-name">学习目标</span>
          <span class="python-step-desc">明确要学什么，写下可验证的小目标</span>
        </div>
        <div class="python-arrow" aria-hidden="true"></div>
        <div class="python-step">
          <span class="python-step-no">2</span>
          <span class="python-step-name">代码练习</span>
          <span class="python-step-desc">脱离教程手写代码，理解每一行</span>
        </div>
        <div class="python-arrow" aria-hidden="true"></div>
        <div class="python-step">
          <span class="python-step-no">3</span>
          <span class="python-step-name">Demo 项目</span>
          <span class="python-step-desc">用知识点做出一个能跑的小工具</span>
        </div>
        <div class="python-arrow" aria-hidden="true"></div>
        <div class="python-step">
          <span class="python-step-no">4</span>
          <span class="python-step-name">GitHub 提交</span>
          <span class="python-step-desc">push 到仓库，留下可追溯记录</span>
        </div>
        <div class="python-arrow" aria-hidden="true"></div>
        <div class="python-step">
          <span class="python-step-no">5</span>
          <span class="python-step-name">复盘总结</span>
          <span class="python-step-desc">记录卡点与收获，形成下次起点</span>
        </div>
      </div>
      <div class="python-loop-back">
        <span>&#8635; 复盘后回到第 1 步，开启下一个知识点的闭环</span>
      </div>
    </section>

    <!-- Records -->
    <section class="python-card">
      <h2 class="python-section-title">闭环记录 <span class="python-tag" id="python-record-tag">0 条</span></h2>
      <div class="python-summary" id="python-summary">
        还没有记录任何闭环。在下方表单填入知识点信息，点击「新增闭环」开始你的第一条记录。
      </div>

      <div class="python-filter-bar" id="filterBar">
        <button class="python-filter-btn active" data-filter="all">全部</button>
        <button class="python-filter-btn" data-filter="1">阶段1 语法基础</button>
        <button class="python-filter-btn" data-filter="2">阶段2 数据结构</button>
        <button class="python-filter-btn" data-filter="3">阶段3 常用库</button>
        <button class="python-filter-btn" data-filter="4">阶段4 AI Python</button>
      </div>

      <form class="python-form" id="python-loop-form" autocomplete="off">
        <div class="python-form-row3">
          <div class="python-field">
            <label for="py-name">知识点名称</label>
            <input id="py-name" type="text" placeholder="例如：列表推导式" required>
          </div>
          <div class="python-field">
            <label for="py-stage">所属阶段</label>
            <select id="py-stage">
              <option value="1">阶段1 · 语法基础</option>
              <option value="2">阶段2 · 数据结构</option>
              <option value="3">阶段3 · 常用库</option>
              <option value="4">阶段4 · AI Python</option>
            </select>
          </div>
          <div class="python-field">
            <label for="py-date">学习日期</label>
            <input id="py-date" type="date" required>
          </div>
        </div>
        <div class="python-field">
          <label>完成步骤（勾选已走完的环节）</label>
          <div class="python-step-checks" id="python-step-checks">
            <label><input type="checkbox" data-step="0"> 学习目标</label>
            <label><input type="checkbox" data-step="1"> 代码练习</label>
            <label><input type="checkbox" data-step="2"> Demo 项目</label>
            <label><input type="checkbox" data-step="3"> GitHub 提交</label>
            <label><input type="checkbox" data-step="4"> 复盘总结</label>
          </div>
        </div>
        <div class="python-field">
          <label for="py-note">复盘笔记</label>
          <textarea id="py-note" placeholder="卡在哪里、怎么解决的、下次注意什么…"></textarea>
        </div>
        <button class="python-btn-add" type="submit">新增闭环</button>
      </form>

      <div class="python-entry-list" id="python-entry-list"></div>
      <div class="python-empty" id="python-empty">暂无闭环记录，先在上方新增一条吧。</div>
    </section>

    <footer class="python-footer">
      所有记录保存在浏览器 localStorage，换设备需重新填写或手动导出。
    </footer>
  </article>
