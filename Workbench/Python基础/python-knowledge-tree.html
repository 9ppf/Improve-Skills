<body>

          <label class="python-leaf" data-name="re 正则表达式 匹配 替换 分组">
            <input class="python-check" type="checkbox" data-id="lib-re">

          <label class="python-leaf" data-name="datetime 日期 时间 格式化 timedelta">

      <!-- 面向AI的Python -->

          <span class="python-branch-title">面向 AI 的 Python</span>
          <span class="python-branch-badge" data-count>0/7</span>
        </button>
        <div class="python-branch-body">

            <input class="python-check" type="checkbox" data-id="ai-numpy">
            <span class="python-leaf-label">NumPy 基础</span>
          </label>

            <input class="python-check" type="checkbox" data-id="ai-pandas">

          </label>

    <div class="python-empty" id="python-empty">没有找到匹配的知识点，换个关键词试试。</div>

    <footer class="python-footer">
      勾选状态保存在浏览器 localStorage，清除浏览器数据后进度会丢失。
    </footer>
  </article>

  <script>
    (function () {
      var STORAGE_KEY = "py_knowledge_tree_v1";
      var tree = document.getElementById("python-tree");
      var checks = Array.prototype.slice.call(tree.querySelectorAll(".python-check"));
      var branches = Array.prototype.slice.call(tree.querySelectorAll(".python-branch"));
      var doneEl = document.getElementById("python-done");
      var totalEl = document.getElementById("python-total");
      var fillEl = document.getElementById("python-progress-fill");
      var searchInput = document.getElementById("python-search-input");
      var emptyEl = document.getElementById("python-empty");
      var resetBtn = document.getElementById("python-reset-btn");

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch (e) { return {}; }
      }
      function saveState(state) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      function syncFromState() {
        var state = loadState();
        checks.forEach(function (cb) {
          var id = cb.getAttribute("data-id");
          var checked = !!state[id];
          cb.checked = checked;
          cb.closest(".python-leaf").classList.toggle("python-checked", checked);
        });
      }

      function updateProgress() {
        var total = checks.length;
        var done = checks.filter(function (cb) { return cb.checked; }).length;
        doneEl.textContent = done;
        totalEl.textContent = total;
        var pct = total ? Math.round((done / total) * 100) : 0;
        fillEl.style.width = pct + "%";

        // 更新各分支计数
        branches.forEach(function (branch) {
          var leafChecks = branch.querySelectorAll(".python-check");
          var bDone = 0;
          leafChecks.forEach(function (cb) { if (cb.checked) bDone++; });
          var badge = branch.querySelector("[data-count]");
          if (badge) badge.textContent = bDone + "/" + leafChecks.length;
        });
      }

      checks.forEach(function (cb) {
        cb.addEventListener("change", function () {
          var state = loadState();
          var id = cb.getAttribute("data-id");
          if (cb.checked) state[id] = true; else delete state[id];
          saveState(state);
          cb.closest(".python-leaf").classList.toggle("python-checked", cb.checked);
          updateProgress();
        });
      });

      // expand / collapse
      branches.forEach(function (branch) {
        var header = branch.querySelector(".python-branch-header");
        header.addEventListener("click", function () {
          var collapsed = branch.classList.toggle("python-collapsed");
          header.setAttribute("aria-expanded", String(!collapsed));
        });
      });

      // 搜索过滤
      function filterTree() {
        var q = searchInput.value.trim().toLowerCase();
        var anyVisible = false;
        branches.forEach(function (branch) {
          var leaves = branch.querySelectorAll(".python-leaf");
          var visibleInBranch = 0;
          leaves.forEach(function (leaf) {
            var name = (leaf.getAttribute("data-name") || "").toLowerCase();
            var match = !q || name.indexOf(q) !== -1;
            leaf.classList.toggle("python-hidden", !match);
            if (match) visibleInBranch++;
          });
          if (q) {
            // 搜索时：仅显示有匹配项的分支，并展开匹配项
            if (visibleInBranch > 0) {
              branch.style.display = "";
              branch.classList.remove("python-collapsed");
              branch.querySelector(".python-branch-header").setAttribute("aria-expanded", "true");
              anyVisible = true;
            } else {
              branch.style.display = "none";
            }
          } else {
            branch.style.display = "";
            anyVisible = true;
          }
        });
        emptyEl.style.display = anyVisible ? "none" : "block";
      }
      searchInput.addEventListener("input", filterTree);

      resetBtn.addEventListener("click", function () {
        if (!confirm("确定要重置全部勾选进度吗？此操作不可撤销。")) return;
        saveState({});
        syncFromState();
        updateProgress();
      });

      // 初始化
      syncFromState();
      updateProgress();
    })();
  </script>
</body>
