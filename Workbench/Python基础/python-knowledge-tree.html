        e: '实现 <code>filter_messages(messages, role)</code>：从消息列表中筛选指定角色的消息。再用字典推导式实现 <code>count_by_role(messages)</code> 统计各角色消息数。',
        ec: 'messages = [\n    {"role": "user", "content": "你好"},\n    {"role": "assistant", "content": "有什么帮助？"},\n    {"role": "user", "content": "解释链表"},\n]\n\nassert len(filter_messages(messages, "user")) == 2\nassert len(filter_messages(messages, "assistant")) == 1\n\ncounts = count_by_role(messages)\nassert counts == {"user": 2, "assistant": 1}',
        a: 'LLM 对话历史是一组消息列表，经常需要筛选（只取 user 消息）或统计（各角色消息数）——列表推导式让这些操作一行搞定。'
      },
      { id: 11, s: 2, t: "栈与队列实现", tag: "Demo: 工具调用栈",
        c: '<p><strong>栈</strong>（LIFO 后进先出）：像一摞盘子。<strong>队列</strong>（FIFO 先进先出）：像排队。Python 用 <code>list</code> 的 <code>append/pop</code> 实现栈，用 <code>collections.deque</code> 实现队列。</p>',
        j: '<strong>与 JS 对比：</strong>JS 用 <code>Array.push/pop</code> 实现栈、<code>push/shift</code> 实现队列；Python 的 <code>deque</code> 在头部操作是 O(1)，list 的 <code>pop(0)</code> 是 O(n)。',
        code: 'from collections import deque\n\n# Stack (using list)\nstack = []\nstack.append("tool_a")     # push\nstack.append("tool_b")\nstack.pop()               # pop -> "tool_b" (LIFO)\nstack[-1]                 # peek -> "tool_a"\n\n# Queue (using deque)\nqueue = deque()\nqueue.append("task_1")    # enqueue\nqueue.append("task_2")\nqueue.popleft()           # dequeue -> "task_1" (FIFO)\n\n# Function call stack\ndef deep_call(n, call_stack):\n    call_stack.append(f"level_{n}")\n    if n > 0:\n        result = deep_call(n - 1, call_stack)\n        call_stack.pop()  # backtrack\n        return result',
        e: '实现 <code>ToolCallStack</code> 类：记录 AI Agent 的工具调用链。支持入栈、出栈、查看栈顶、获取全部调用历史。',
        ec: 'stack = ToolCallStack()\nstack.push("search", {"query": "链表"})\nstack.push("summarize", {"text": "..."})\n\nassert stack.peek()["tool"] == "summarize"\nassert stack.size() == 2\n\ncall = stack.pop()\nassert call["tool"] == "summarize"\nassert stack.size() == 1\nassert len(stack.get_history()) == 2  # history keeps all calls',
        a: 'AI Agent 调用工具时形成<strong>调用链</strong>：搜索 → 分析 → 生成回答。用栈记录这个链条，出栈表示工具完成。LangChain Agent 的 <code>intermediate_steps</code> 底层就是这个结构。'
      },
      { id: 12, s: 2, t: "链表实现", tag: "Demo: 对话历史",
        c: '<p>链表是节点串成的链——每个节点存数据和指向下一节点的指针。与数组相比，插入/删除 O(1)，但随机访问 O(n)。</p>',
        j: '<strong>与 JS 对比：</strong>JS 没有内置链表，通常用 Array 代替。Python 也没有内置链表（deque 底层是双向链表）。链表是自考数据结构核心考点。',
        code: '# Node class\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n\n# Singly linked list\nclass LinkedList:\n    def __init__(self):\n        self.head = None\n        self.size = 0\n\n    def append(self, data):\n        node = Node(data)\n        if not self.head:\n            self.head = node\n        else:\n            cur = self.head\n            while cur.next:\n                cur = cur.next\n            cur.next = node\n        self.size += 1\n\n    def get_last_n(self, n):\n        result = []\n        cur = self.head\n        while cur:\n            result.append(cur.data)\n            cur = cur.next\n        return result[-n:]',
        e: '实现 <code>ChatHistory</code> 类（基于链表）：追加消息、获取最近 N 条消息（截断上下文）、按条件删除旧消息。',
        ec: 'history = ChatHistory()\nhistory.append({"role": "user", "content": "问题1"})\nhistory.append({"role": "assistant", "content": "回答1"})\nhistory.append({"role": "user", "content": "问题2"})\nhistory.append({"role": "assistant", "content": "回答2"})\n\nassert len(history.get_last_n(2)) == 2\nassert history.get_last_n(2)[-1]["content"] == "回答2"\nassert history.size() == 4\n\nhistory.trim_to(3)\nassert history.size() == 3\nassert history.get_last_n(3)[0]["content"] == "回答1"',
        a: 'LLM 有<strong>上下文窗口限制</strong>（如 DeepSeek 最大 64K tokens）。对话越长越需要截断旧消息——链表天然适合：尾部追加 O(1)，头部删除 O(1)。LangChain 的 <code>ConversationBufferWindowMemory</code> 就是保留最近 N 轮对话。'
      },
      { id: 13, s: 2, t: "树结构实现", tag: "Demo: 查询路由",
        c: '<p>树是层级结构——根节点分叉出子节点。<strong>二叉树</strong>每个节点最多两个子节点。遍历方式：前序、中序、后序、层序（BFS）。</p>',
        j: '<strong>与 JS 对比：</strong>DOM 树就是树结构，JS 中用对象嵌套表示树。Python 的实现方式类似。<strong>自考考点</strong>：树的遍历是必考题。',
        code: 'class TreeNode:\n    def __init__(self, value):\n        self.value = value\n        self.left = None\n        self.right = None\n\n# Build decision tree\nroot = TreeNode("是编程问题?")\nroot.left = TreeNode("需要代码示例?")\nroot.right = TreeNode("是概念问题?")\nroot.left.left = TreeNode("编程_代码")\nroot.left.right = TreeNode("编程_思路")\nroot.right.left = TreeNode("概念_解释")\nroot.right.right = TreeNode("其他")\n\n# Preorder traversal\ndef preorder(node, result=None):\n    if result is None: result = []\n    if node:\n        result.append(node.value)\n        preorder(node.left, result)\n        preorder(node.right, result)\n    return result\n\nprint(preorder(root))',
        e: '实现 <code>QueryRouter</code> 类（基于二叉树）：构建一棵查询分类决策树，输入用户查询的关键词，沿着树路由到最终的处理器名称。',
        ec: 'router = QueryRouter()\n\n# Build routing tree:\n# root: contains "代码" or "编程"?\n#   yes -> left: contains "python"? -> "python_handler" / "code_handler"\n#   no  -> right: contains "解释" or "是什么"? -> "concept_handler" / "default_handler"\n\nassert router.route("写一段python代码") == "python_handler"\nassert router.route("写一段代码") == "code_handler"\nassert router.route("什么是链表") == "concept_handler"\nassert router.route("你好") == "default_handler"',
        a: 'AI 应用中的<strong>意图路由</strong>——判断用户查询属于哪类（编程/概念/翻译），然后分发到不同的处理逻辑。RAG 系统中的<strong>文档分类</strong>也用树结构组织知识层级。'
      },
      { id: 14, s: 2, t: "图的表示与遍历", tag: "Demo: 知识图谱",
        c: '<p>图由<strong>节点</strong>和<strong>边</strong>组成。用<strong>邻接表</strong>表示：字典中每个节点映射到邻居列表。遍历：<strong>BFS</strong>（广度优先）和 <strong>DFS</strong>（深度优先）。</p>',
        j: '<strong>与 JS 对比：</strong>概念完全相同。JS 中用 Map 或 Object 存邻接表，Python 用 dict。<strong>自考考点</strong>：BFS/DFS 的遍历顺序和复杂度是必考题。',
        code: 'from collections import deque\n\n# Adjacency list\ngraph = {\n    "链表": ["指针", "节点"],\n    "指针": ["内存地址"],\n    "节点": ["数据域", "指针域"],\n    "数据域": [],\n    "指针域": ["内存地址"],\n    "内存地址": [],\n}\n\n# BFS\ndef bfs(graph, start):\n    visited = set()\n    queue = deque([start])\n    result = []\n    while queue:\n        node = queue.popleft()\n        if node not in visited:\n            visited.add(node)\n            result.append(node)\n            queue.extend(graph.get(node, []))\n    return result\n\nprint(bfs(graph, "链表"))\n# [\'链表\', \'指针\', \'节点\', \'内存地址\', \'数据域\', \'指针域\']',
        e: '实现 <code>KnowledgeGraph</code> 类：添加知识点和关联关系，用 BFS 搜索与某知识点相关的所有知识点（用于 RAG 检索）。',
        ec: 'kg = KnowledgeGraph()\nkg.add_node("链表"); kg.add_node("栈"); kg.add_node("队列")\nkg.add_node("指针"); kg.add_node("内存")\n\nkg.add_edge("链表", "指针")\nkg.add_edge("指针", "内存")\nkg.add_edge("栈", "链表")\nkg.add_edge("队列", "链表")\n\nrelated = kg.search("栈")\nassert "栈" in related and "链表" in related\nassert "指针" in related and "内存" in related\n\nnearby = kg.search("栈", max_depth=1)\nassert "链表" in nearby\nassert "内存" not in nearby  # 2 levels away',
        a: '<strong>RAG（检索增强生成）</strong>的核心：用户提问"什么是栈"，系统在知识图谱中搜索"栈"→"链表"→"指针"→"内存"，把相关知识一起作为上下文送给 LLM，回答更准确。'
      },
      { id: 15, s: 2, t: "collections 模块", tag: "Demo: 统计与计数",
        c: '<p><code>collections</code> 是内置高性能容器模块：<strong>deque</strong>（双端队列）、<strong>defaultdict</strong>（带默认值的字典）、<strong>Counter</strong>（计数器）。</p>',
        j: '<strong>与 JS 对比：</strong>JS 没有内置等价模块。<code>Counter</code> ≈ 手写 <code>reduce</code> 计数；<code>defaultdict</code> ≈ Proxy 自动初始化。',
        code: 'from collections import Counter, defaultdict, deque\n\n# Counter\nmessages = ["user", "assistant", "user", "user", "assistant"]\ncounts = Counter(messages)\nprint(counts)  # Counter({\'user\': 3, \'assistant\': 2})\nprint(counts.most_common(1))  # [(\'user\', 3)]\n\n# defaultdict\nword_map = defaultdict(list)\nfor word in ["链表", "栈", "链表"]:\n    word_map[word].append("出现")\nprint(word_map["队列"])  # [] (auto-created, no error)\n\n# deque with max length (sliding window cache)\ncache = deque(maxlen=3)\ncache.append("msg1"); cache.append("msg2"); cache.append("msg3")\ncache.append("msg4")\nprint(list(cache))  # [\'msg2\', \'msg3\', \'msg4\'] (msg1 dropped)',
        e: '实现 <code>ConversationStats</code> 类：用 Counter 和 defaultdict 统计对话数据——各角色消息数、各章节出现次数、自动分组的消息记录。',
        ec: 'stats = ConversationStats()\nstats.add_message("user", "解释链表", "第一章")\nstats.add_message("assistant", "链表是...", "第一章")\nstats.add_message("user", "什么是栈", "第二章")\nstats.add_message("user", "链表练习", "第一章")\n\nassert stats.role_counts()["user"] == 3\nassert stats.role_counts()["assistant"] == 1\nassert stats.chapter_counts()["第一章"] == 3\nassert len(stats.messages_by_chapter()["第一章"]) == 3',
        a: 'AI 应用的<strong>监控与分析</strong>：统计用户消息数、AI 回复数、各话题频率。<code>deque(maxlen=N)</code> 天然适合做<strong>滑动窗口缓存</strong>——保留最近 N 条消息，旧消息自动丢弃。'
      },
      { id: 16, s: 3, t: "os / sys 模块", tag: "Demo: 配置加载",
        c: '<p><code>os</code> 提供操作系统接口（环境变量、路径操作），<code>sys</code> 提供 Python 解释器接口（命令行参数、退出）。AI 应用中最常见：从环境变量读取 API Key。</p>',
        j: '<strong>与 JS 对比：</strong><code>os.environ</code> ≈ <code>process.env</code>；<code>sys.argv</code> ≈ <code>process.argv</code>；<code>os.path</code> ≈ Node.js <code>path</code> 模块。',
        code: 'import os\nimport sys\n\n# Read env variable (core AI usage)\napi_key = os.environ.get("DEEPSEEK_API_KEY")\nif not api_key:\n    print("请设置 DEEPSEEK_API_KEY 环境变量")\n    sys.exit(1)\n\n# Load from .env file (needs python-dotenv)\nfrom dotenv import load_dotenv\nload_dotenv()\napi_key = os.environ["DEEPSEEK_API_KEY"]\n\n# Command line arguments\nprint(sys.argv)  # [\'main.py\', \'--model\', \'deepseek\']\n\n# Path operations\nconfig_path = os.path.join("config", "settings.json")',

        ec: 'import os\nos.environ["DEEPSEEK_API_KEY"] = "test_key"\nos.environ["MODEL_NAME"] = "deepseek-chat"\n\nconfig = load_config()\nassert config["api_key"] == "test_key"\nassert config["model"] == "deepseek-chat"\nassert "base_url" in config  # has default value',
        a: '你工作台的 <code>dev_server.py</code> 就是用 <code>os.environ.get("DEEPSEEK_API_KEY")</code> 从 <code>.env</code> 读取 API Key——这是所有 AI 应用的标准做法：Key 不硬编码在代码中。'
      },
      { id: 17, s: 3, t: "json 模块", tag: "Demo: 响应解析",
        c: '<p><code>json</code> 模块处理 JSON 数据的编码（dumps）和解码（loads）。LLM API 的请求和响应都是 JSON 格式。</p>',
        j: '<strong>与 JS 对比：</strong><code>json.dumps()</code> ≈ <code>JSON.stringify()</code>；<code>json.loads()</code> ≈ <code>JSON.parse()</code>。Python 的 <code>dumps</code> 支持 <code>ensure_ascii=False</code> 输出中文。',
        code: 'import json\n\n# Python dict -> JSON string\nrequest_data = {\n    "model": "deepseek-chat",\n    "messages": [{"role": "user", "content": "你好"}],\n    "temperature": 0.7\n}\njson_str = json.dumps(request_data, ensure_ascii=False)\n\n# JSON string -> Python dict\nresponse_text = \'{"choices": [{"message": {"role": "assistant", "content": "你好！"}}]}\'\nresponse = json.loads(response_text)\ncontent = response["choices"][0]["message"]["content"]\nprint(content)  # "你好！"\n\n# Read/write JSON file\nwith open("config.json", "w", encoding="utf-8") as f:\n    json.dump(request_data, f, ensure_ascii=False, indent=2)',
        e: '实现 <code>parse_api_response(text)</code> 函数：解析 LLM API 的 JSON 响应，提取消息内容和 token 用量。处理 JSON 解析失败的情况。',
        ec: 'response = \'{"choices": [{"message": {"role": "assistant", "content": "链表是一种..."}}], "usage": {"total_tokens": 150}}\'\nresult = parse_api_response(response)\nassert result["content"] == "链表是一种..."\nassert result["total_tokens"] == 150\n\n# JSON parse failure -> None\nassert parse_api_response("not json") is None\n# Missing choices -> None\nassert parse_api_response(\'{"model": "test"}\') is None',
        a: 'LLM API 返回的是 JSON 字符串，必须解析后才能提取 AI 的回复内容。你工作台 <code>dev_server.py</code> 的 <code>/api/chat</code> 就在处理 JSON 请求和响应。Token 用量统计用于<strong>成本监控</strong>。'
      },
      { id: 18, s: 3, t: "re 正则表达式", tag: "Demo: 文本提取",
        c: '<p><code>re</code> 模块处理正则表达式。常用函数：<code>re.match</code>（从头匹配）、<code>re.search</code>（搜索任意位置）、<code>re.findall</code>（找全部）、<code>re.sub</code>（替换）。</p>',
        j: '<strong>与 JS 对比：</strong>语法几乎相同。Python 用 <code>re.findall(text)</code>，JS 用 <code>text.match(regex)</code>。Python 的 <code>re.sub</code> ≈ JS 的 <code>text.replace(regex, ...)</code>。',
        code: 'import re\n\n# Extract code blocks (LLM output format)\ntext = """解释：\n```python\nprint("hello")\n```\n上面是代码。"""\n\ncodes = re.findall(r"```(?:python)?\\n(.*?)```", text, re.DOTALL)\nprint(codes)  # [\'print("hello")\\n\']\n\n# Extract JSON from text\ntext2 = \'结果是 {"score": 85} 请查看\'\nmatch = re.search(r\'\\{.*\\}\', text2)\nif match:\n    import json\n    data = json.loads(match.group())\n    print(data)  # {\'score\': 85}\n\n# Replace sensitive info\ntext3 = "API Key is sk-abc123xyz"\ncleaned = re.sub(r"sk-\\w+", "sk-***", text3)\nprint(cleaned)  # "API Key is sk-***"',
        e: '实现 <code>extract_code_blocks(text)</code>：从 LLM 回复中提取所有代码块，返回 <code>[(language, code), ...]</code> 列表。',
        ec: 'text = """两段代码：\n\n```python\nx = 42\n```\n\n和\n\n```javascript\nlet x = 42;\n```\n"""\n\nblocks = extract_code_blocks(text)\nassert len(blocks) == 2\nassert blocks[0] == ("python", "x = 42\\n")\nassert blocks[1] == ("javascript", "let x = 42;\\n")\n\nassert extract_code_blocks("没有代码") == []\nblocks2 = extract_code_blocks("```\\ncode\\n```")\nassert blocks2[0][0] == ""  # no language',
        a: 'LLM 经常在回复中嵌入代码块、JSON、表格等结构化内容。<code>re</code> 是从非结构化文本中提取结构的利器。你工作台 AI 出题功能中，从 LLM 回复中提取 JSON 题目数据就需要正则。'
      },
      { id: 19, s: 3, t: "datetime 模块", tag: "Demo: 限流控制",
        c: '<p><code>datetime</code> 处理日期和时间。<code>datetime.now()</code> 获取当前时间，<code>timedelta</code> 表示时间差。</p>',
        j: '<strong>与 JS 对比：</strong><code>datetime.now()</code> ≈ <code>new Date()</code>；<code>timedelta</code> 没有直接等价（JS 用毫秒数计算）；Python 的格式化更直观：<code>strftime("%Y-%m-%d")</code>。',
        code: 'from datetime import datetime, timedelta\n\n# Current time\nnow = datetime.now()\nprint(now.strftime("%Y-%m-%d %H:%M:%S"))\n\n# Time difference\none_hour_ago = now - timedelta(hours=1)\ndiff = now - one_hour_ago\nprint(diff.total_seconds())  # 3600.0\n\n# Timestamp\ntimestamp = now.timestamp()\ndt = datetime.fromtimestamp(timestamp)\n\n# Parse date string\ndt = datetime.strptime("2026-08-15", "%Y-%m-%d")',
        e: '实现 <code>RateLimiter</code> 类：限制每分钟最多调用 N 次 API。记录每次调用时间，超出限制时返回需要等待的秒数。',
        ec: 'from datetime import datetime, timedelta\n\nlimiter = RateLimiter(max_calls=3, per_seconds=60)\n\nassert limiter.can_call() == True   # 1st\nassert limiter.can_call() == True   # 2nd\nassert limiter.can_call() == True   # 3rd\nassert limiter.can_call() == False  # 4th blocked\n\nwait = limiter.wait_time()\nassert wait > 0 and wait <= 60\n\n# Hint: use list to store recent call timestamps\n# Clean up old records each call',
        a: 'LLM API 都有<strong>速率限制</strong>（如 DeepSeek 每分钟 60 次）。RateLimiter 确保你的应用不会因为调用太快被 API 拒绝（429 错误）。'
      },
      { id: 20, s: 3, t: "requests 库", tag: "Demo: API调用核心",
        c: '<p><code>requests</code> 是 Python 最流行的 HTTP 客户端库。发送 GET/POST 请求、处理响应。<strong>这是调用 LLM API 的核心工具</strong>。</p>',
        j: '<strong>与 JS 对比：</strong><code>requests.post(url, json=data)</code> ≈ <code>fetch(url, {method:"POST", body:JSON.stringify(data)})</code>；Python 的 <code>requests</code> 更简洁，不需要 async/await。',
        code: 'import requests\n\n# Call LLM API (this is what dev_server.py does)\nurl = "https://api.deepseek.com/v1/chat/completions"\nheaders = {\n    "Authorization": f"Bearer {api_key}",\n    "Content-Type": "application/json"\n}\ndata = {\n    "model": "deepseek-chat",\n    "messages": [{"role": "user", "content": "解释链表"}],\n    "temperature": 0.7\n}\n\nresponse = requests.post(url, headers=headers, json=data, timeout=30)\n\nif response.status_code == 200:\n    result = response.json()\n    content = result["choices"][0]["message"]["content"]\n    print(content)\nelse:\n    print(f"API error: {response.status_code}")\n\n# GET request\nresp = requests.get("https://api.example.com/data", params={"page": 1})',
        e: '实现 <code>call_llm(api_key, messages, **params)</code> 函数：调用 DeepSeek API，返回 AI 回复文本。包含超时处理和错误重试。',
        ec: '# Normal call\nmessages = [{"role": "user", "content": "说一个Python技巧"}]\nresult = call_llm(api_key, messages, model="deepseek-chat", temperature=0.7)\nassert isinstance(result, str)\nassert len(result) > 0\n\n# Empty messages -> ValueError\ntry:\n    call_llm(api_key, [])\n    assert False\nexcept ValueError:\n    assert True\n\n# Timeout -> retry 3 times -> TimeoutError',
        a: '这就是<strong>所有 AI 应用的核心</strong>——调用 LLM API。你工作台的 <code>dev_server.py</code> 的 <code>/api/chat</code> 端点就是在做这件事。学完这个，你就能不依赖任何框架，直接用 Python 调用 AI 模型。'
      },
      { id: 21, s: 3, t: "pathlib 高级用法", tag: "Demo: 日志管理",
        c: '<p>阶段1学过 pathlib 基础，现在学习高级用法：<strong>glob 模式匹配</strong>、<strong>递归遍历</strong>、<strong>文件信息</strong>、<strong>读写 JSON/文本</strong>。</p>',
        j: '<strong>与 JS 对比：</strong><code>Path.glob("*.py")</code> ≈ Node.js <code>fs.glob</code> 或 <code>fast-glob</code> 包；Python 的 pathlib 更直观，链式调用。',
        code: 'from pathlib import Path\nimport json\n\n# glob pattern matching\nlog_dir = Path("logs")\nfor f in log_dir.glob("*.json"):       # current level\n    print(f.name)\nfor f in log_dir.rglob("*.json"):      # recursive\n    print(f)\n\n# File info\nf = Path("config.json")\nif f.exists() and f.is_file():\n    size = f.stat().st_size      # file size\n    mtime = f.stat().st_mtime    # modification time\n\n# Read/write JSON (one-liner)\nf.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")\ndata = json.loads(f.read_text(encoding="utf-8"))\n\n# Create directory structure\nPath("logs/2026/08").mkdir(parents=True, exist_ok=True)\n\n# Organize log files by date\nfrom datetime import datetime\nlog_file = Path("logs") / datetime.now().strftime("%Y-%m-%d") / "chat.jsonl"',
        e: '实现 <code>ConversationLogger</code> 类：将对话记录按日期保存到文件，支持查询历史记录。',
        ec: 'logger = ConversationLogger(base_dir="logs")\n\nlogger.log("user", "什么是链表")\nlogger.log("assistant", "链表是一种...")\n\n# File should exist at logs/YYYY-MM-DD/chat.jsonl\nfrom pathlib import Path\nfrom datetime import datetime\ntoday = datetime.now().strftime("%Y-%m-%d")\nlog_path = Path("logs") / today / "chat.jsonl"\nassert log_path.exists()\n\nrecords = logger.get_today_logs()\nassert len(records) == 2\nassert records[0]["role"] == "user"',
        a: 'AI 应用需要<strong>记录对话日志</strong>用于调试、分析和审计。按日期组织日志文件是标准做法。LangSmith（LangChain 的监控平台）底层也是把对话记录写入文件/数据库。'
      },
      { id: 22, s: 3, t: "typing 类型提示", tag: "Demo: 工程化",
        c: '<p><code>typing</code> 模块提供类型提示工具，让代码更可读、更安全。Python 3.9+ 内置了 <code>list/dict/tuple</code> 的泛型支持。</p>',
        j: '<strong>与 JS 对比：</strong>类似 TypeScript 的类型系统。Python 类型提示是<strong>可选的</strong>（运行时不强制），TypeScript 是强制的。<code>Optional[str]</code> ≈ <code>string | null</code>。',
        code: 'from typing import Optional, Union, Any, Callable, TypedDict\n\n# Basic type hints\ndef search(query: str, max_results: int = 10) -> list[dict]:\n    """Search function, returns list of dicts"""\n    return []\n\n# Optional: value may be None\ndef get_config(key: str) -> Optional[str]:\n    return os.environ.get(key)\n\n# Union: multiple types\ndef parse(data: Union[str, dict]) -> dict:\n    if isinstance(data, str):\n        return json.loads(data)\n    return data\n\n# TypedDict: typed dict (LLM message format)\nclass Message(TypedDict):\n    role: str        # "user" | "assistant" | "system"\n    content: str\n\nmsg: Message = {"role": "user", "content": "你好"}',
        e: '为 LLM API 客户端添加完整的类型提示：定义 <code>Message</code> TypedDict、<code>APIResponse</code> TypedDict，并为 <code>call_llm</code> 函数添加类型标注。',
        ec: 'from typing import TypedDict, Optional\n\nclass Message(TypedDict):\n    role: str\n    content: str\n\nclass APIResponse(TypedDict):\n    content: str\n    total_tokens: int\n    model: str\n\n# call_llm should have type hints:\n# def call_llm(api_key: str, messages: list[Message],\n#              model: str = "deepseek-chat",\n#              temperature: float = 0.7) -> Optional[APIResponse]:\n\nassert True  # type hints don\'t change runtime behavior',
        a: 'AI 应用中<strong>消息格式</strong>是跨模块传递的核心数据结构。用 TypedDict 定义 <code>Message</code> 类型后，IDE 能自动补全 <code>msg["role"]</code>、<code>msg["content"]</code>，减少 bug。'
      },
      { id: 23, s: 4, t: "NumPy 基础", tag: "Demo: 成绩计算",
        c: '<p>NumPy 是 Python 数值计算基础库。核心是 <strong>ndarray</strong>（N维数组），支持向量化运算。所有 ML 框架底层都是 NumPy。</p>',
        j: '<strong>与 JS 对比：</strong>JS 没有内置等价。JS 数组操作慢；NumPy 数组是 C 实现，速度快 100 倍。<code>np.array([1,2,3]) * 2</code> → <code>[2,4,6]</code>，JS 需要 <code>.map(x =&gt; x*2)</code>。',
        code: 'import numpy as np\n\n# Create array\nscores = np.array([85, 92, 78, 90, 65])\nmatrix = np.array([[1, 2], [3, 4]])\n\n# Vectorized operations (no loop!)\ndoubled = scores * 2            # [170, 184, 156, 180, 130]\npassed = scores >= 60          # [True, True, True, True, True]\n\n# Statistics\nnp.mean(scores)    # 82.0\nnp.std(scores)     # standard deviation\nnp.min(scores)     # 65\nnp.max(scores)     # 92\nnp.percentile(scores, 50)  # median\n\n# Boolean indexing\nhigh_scores = scores[scores >= 80]  # [85, 92, 90]\n\n# Matrix operations (AI/ML core)\na = np.array([[1, 2], [3, 4]])\nb = np.array([[5, 6], [7, 8]])\nnp.dot(a, b)       # matrix multiplication\na.T                # transpose',
        e: '实现 <code>analyze_scores(scores_dict)</code> 函数：输入 <code>{"科目": [分数列表]}</code>，用 NumPy 计算每科的平均分、标准差、最高分、最低分。',
        ec: 'data = {\n    "数据结构": [85, 92, 78, 90, 65],\n    "离散数学": [70, 88, 95, 60, 75],\n}\nresult = analyze_scores(data)\n\nassert result["数据结构"]["mean"] == 82.0\nassert result["数据结构"]["max"] == 92\nassert result["数据结构"]["min"] == 65\nassert "std" in result["数据结构"]\nassert result["离散数学"]["mean"] == 77.6',
        a: 'NumPy 是所有 AI/ML 的基石——神经网络中的<strong>张量运算</strong>、<strong>梯度计算</strong>本质就是矩阵乘法。理解 <code>np.dot(a, b)</code> 就是理解神经网络前向传播的核心。'
      },
      { id: 24, s: 4, t: "Pandas 基础", tag: "Demo: 数据加载",
        c: '<p>Pandas 是 Python 数据分析核心库。<strong>DataFrame</strong> 是二维表格（类似 Excel），<strong>Series</strong> 是一维序列。支持过滤、分组、聚合、合并。</p>',
        j: '<strong>与 JS 对比：</strong>没有内置等价。DataFrame ≈ Excel 表格或 SQL 表；<code>df[df["score"] &gt; 80]</code> ≈ JS <code>data.filter(x =&gt; x.score &gt; 80)</code>。',
        code: 'import pandas as pd\n\n# Load from CSV\ndf = pd.read_csv("exam_scores.csv")\n# CSV: subject,chapter,score,date\n\n# Basic operations\ndf.head()                  # first 5 rows\ndf.describe()              # statistics summary\n\n# Filter\nhigh = df[df["score"] >= 80]\nds = df[df["subject"] == "数据结构"]\n\n# Group by + aggregate\nby_subject = df.groupby("subject")["score"].mean()\n# 数据结构    82.0\n# 离散数学    77.6\n\n# Sort\ndf.sort_values("score", ascending=False)\n\n# New column\ndf["passed"] = df["score"] >= 60\ndf["grade"] = df["score"].apply(\n    lambda s: "A" if s>=90 else ("B" if s>=80 else "C")\n)',
        e: '实现 <code>load_and_summarize(csv_path)</code> 函数：加载考试数据 CSV，返回各科平均分、各章节正确率、最近趋势（上升/下降/稳定）。',
        ec: 'import pandas as pd\npd.DataFrame([\n    {"subject": "DS", "chapter": "Ch1", "score": 85, "date": "2026-08-01"},\n    {"subject": "DS", "chapter": "Ch1", "score": 90, "date": "2026-08-10"},\n    {"subject": "DS", "chapter": "Ch2", "score": 60, "date": "2026-08-10"},\n]).to_csv("test_scores.csv", index=False)\n\nresult = load_and_summarize("test_scores.csv")\nassert result["DS"]["avg"] == 78.33  # (85+90+60)/3\nassert "Ch1" in result["DS"]["chapters"]\nassert result["DS"]["trend"] in ["up", "down", "stable"]',
        a: 'Pandas 是<strong>数据科学家的核心工具</strong>——从数据加载、清洗到分析全流程覆盖。ML 训练前的数据预处理 80% 用 Pandas 完成。你的自考数据天然适合 DataFrame 分析。'
      },
      { id: 25, s: 4, t: "Matplotlib 绘图", tag: "Demo: 可视化",
        c: '<p>Matplotlib 是 Python 绑图库。常用图表：柱状图（<code>bar</code>）、折线图（<code>plot</code>）、饼图（<code>pie</code>）、热力图（<code>imshow</code>）。Pandas 数据可直接绑图。</p>',
        j: '<strong>与 JS 对比：</strong>类似 Chart.js 或 ECharts，但 Matplotlib 是静态图片（PNG），JS 库是交互式的。Python 适合生成报告图片，JS 适合网页交互。',
        code: 'import matplotlib.pyplot as plt\nimport pandas as pd\n\n# Bar chart: subject average scores\nsubjects = ["数据结构", "离散数学", "操作系统"]\nscores = [82, 77, 85]\nplt.bar(subjects, scores, color=["#7c3aed", "#0d9488", "#d97706"])\nplt.title("各科平均分")\nplt.ylabel("分数")\nplt.savefig("scores_bar.png")\n\n# Line chart: progress trend\ndates = ["8/1", "8/5", "8/10", "8/15"]\nds_scores = [65, 72, 80, 85]\nplt.figure()\nplt.plot(dates, ds_scores, marker="o", color="#7c3aed")\nplt.title("数据结构成绩趋势")\nplt.savefig("trend_line.png")\n\n# Pandas direct plot\ndf.groupby("subject")["score"].mean().plot(kind="bar")\nplt.savefig("pandas_bar.png")',
        e: '实现 <code>generate_charts(df, output_dir)</code> 函数：接收考试数据 DataFrame，生成 3 张图表——各科平均分柱状图、章节正确率热力图、成绩趋势折线图。',
        ec: 'from pathlib import Path\n\ndf = pd.read_csv("test_scores.csv")\noutput = Path("charts")\noutput.mkdir(exist_ok=True)\n\ngenerate_charts(df, output)\n\nassert (output / "subject_avg.png").exists()\nassert (output / "chapter_heatmap.png").exists()\nassert (output / "score_trend.png").exists()',
        a: 'ML 工程师的日常：<strong>数据可视化</strong>是理解数据分布、发现异常、评估模型效果的关键步骤。训练 loss 曲线、准确率对比图、混淆矩阵热力图——都是用 Matplotlib 生成。'
      },
      { id: 26, s: 4, t: "API 调用（整合）", tag: "Demo: AI分析",
        c: '<p>将阶段3的 <code>requests + json</code> 与阶段4的 <code>Pandas</code> 结合：把分析好的数据发给 LLM，让 AI 生成学习建议报告。</p>',
        j: '<strong>与 JS 对比：</strong>这就是你工作台 AI 功能的完整链路——前端发数据到后端，后端调 AI API，返回结果。现在你用 Python 从头实现。',
        code: 'import requests\nimport json\nimport pandas as pd\n\n# Send analysis data to LLM for report\ndef get_ai_analysis(scores_df, api_key):\n    # 1. Analyze data with Pandas\n    summary = scores_df.groupby("subject")["score"].agg(["mean", "min", "max"])\n    summary_text = summary.to_string()\n\n    # 2. Build prompt\n    prompt = f"""分析以下自考成绩数据，给出学习建议：\n\n{summary_text}\n\n请从以下方面分析：\n1. 各科掌握程度\n2. 薄弱环节\n3. 推荐学习重点\n4. 下一步行动计划\n"""\n\n    # 3. Call LLM API\n    response = requests.post(\n        "https://api.deepseek.com/v1/chat/completions",\n        headers={"Authorization": f"Bearer {api_key}"},\n        json={\n            "model": "deepseek-chat",\n            "messages": [{"role": "user", "content": prompt}],\n        },\n        timeout=30,\n    )\n    return response.json()["choices"][0]["message"]["content"]',
        e: '实现 <code>generate_report(csv_path, api_key)</code> 函数：加载数据 → 分析统计 → 生成图表 → 调用 AI 生成文字报告 → 保存到文件。',
        ec: 'report = generate_report("test_scores.csv", api_key)\n\nassert "charts" in report\nassert "analysis" in report\nassert isinstance(report["analysis"], str)\nassert len(report["analysis"]) > 50  # has content\n\nfrom pathlib import Path\nassert Path("report.txt").exists()',
        a: '这是<strong>AI + 数据分析</strong>的完整闭环：数据 → 统计 → 可视化 → AI 解读 → 报告。真实业务中，BI（商业智能）系统就是这样工作的——分析师看图表，AI 辅助生成洞察。'
      },
      { id: 27, s: 4, t: "文件批处理", tag: "Demo: 批量加载",
        c: '<p>用 <code>pathlib.glob</code> + Pandas 批量加载和处理多个文件。AI 训练数据通常分散在多个文件中，需要批量读取合并。</p>',
        j: '<strong>与 JS 对比：</strong>概念相同，JS 用 <code>fs.readdir</code> + <code>Promise.all</code> 批量读取。Python 更简洁：一行 <code>pd.concat</code> 合并。',
        code: 'from pathlib import Path\nimport pandas as pd\n\n# Batch load all CSV in directory\ndef load_all_csv(directory):\n    path = Path(directory)\n    dfs = []\n    for f in path.glob("**/*.csv"):  # recursive\n        df = pd.read_csv(f)\n        df["source_file"] = f.name  # track origin\n        dfs.append(df)\n    return pd.concat(dfs, ignore_index=True)\n\n# Batch process\ndef batch_process(directory, output_file):\n    df = load_all_csv(directory)\n    summary = df.groupby(["subject", "chapter"])["score"].mean()\n    summary.to_csv(output_file)\n    return summary\n\n# Batch generate reports\nfor csv_file in Path("data").glob("*.csv"):\n    df = pd.read_csv(csv_file)\n    report = analyze_scores(df)\n    Path(f"reports/{csv_file.stem}.txt").write_text(report)',
        e: '实现 <code>batch_load_exams(directory)</code> 函数：递归扫描目录下所有 CSV 文件，合并为一个 DataFrame，添加来源文件标记。',
        ec: '# Create test files:\n# data/2026-08/DS.csv\n# data/2026-08/DM.csv\n# data/2026-09/DS.csv\n\nPath("data/2026-08").mkdir(parents=True, exist_ok=True)\nPath("data/2026-09").mkdir(parents=True, exist_ok=True)\n\npd.DataFrame([{"subject": "DS", "score": 85}]).to_csv("data/2026-08/DS.csv", index=False)\npd.DataFrame([{"subject": "DM", "score": 70}]).to_csv("data/2026-08/DM.csv", index=False)\npd.DataFrame([{"subject": "DS", "score": 90}]).to_csv("data/2026-09/DS.csv", index=False)\n\ndf = batch_load_exams("data")\nassert len(df) == 3\nassert "source_file" in df.columns',
        a: 'ML 训练数据通常分散在数百个文件中——图片数据集、文本语料、日志文件。批量加载和预处理是<strong>数据管道</strong>的第一步。'
      },
      { id: 28, s: 4, t: "数据清洗", tag: "Demo: 数据预处理",
        c: '<p>数据清洗处理：缺失值（<code>NaN</code>）、重复数据、异常值、格式不统一。Pandas 提供 <code>dropna</code>、<code>fillna</code>、<code>drop_duplicates</code> 等方法。</p>',
        j: '<strong>与 JS 对比：</strong>JS 需要手写过滤逻辑，Pandas 一行搞定。<code>df.dropna()</code> ≈ <code>data.filter(x =&gt; x.score !== null)</code>。',
        code: 'import pandas as pd\nimport numpy as np\n\n# Simulate dirty data\ndf = pd.DataFrame([\n    {"subject": "DS", "score": 85, "date": "2026-08-01"},\n    {"subject": "DS", "score": np.nan, "date": "2026-08-05"},  # missing\n    {"subject": "DS", "score": 85, "date": "2026-08-01"},  # duplicate\n    {"subject": "DM", "score": 200, "date": "2026-08-10"},  # outlier\n])\n\n# Remove duplicates\ndf = df.drop_duplicates()\n\n# Fill missing with subject average\ndf["score"] = df.groupby("subject")["score"].transform(\n    lambda x: x.fillna(x.mean())\n)\n\n# Handle outliers (score > 100 -> cap to 100)\ndf.loc[df["score"] > 100, "score"] = 100\n\n# Unify date format\ndf["date"] = pd.to_datetime(df["date"])\n\n# Reset index\ndf = df.reset_index(drop=True)',
        e: '实现 <code>clean_exam_data(df)</code> 函数：处理缺失值（用科目平均分填充）、删除重复行、处理异常分数（&lt;0 或 &gt;100 截断）、统一日期格式。',
        ec: 'import numpy as np\nimport pandas as pd\n\ndf = pd.DataFrame([\n    {"subject": "DS", "score": 85, "date": "2026-08-01"},\n    {"subject": "DS", "score": np.nan, "date": "2026-08-05"},\n    {"subject": "DS", "score": 85, "date": "2026-08-01"},  # dup\n    {"subject": "DM", "score": 150, "date": "2026-08-10"},  # outlier\n])\n\ncleaned = clean_exam_data(df)\nassert len(cleaned) == 3          # removed 1 duplicate\nassert cleaned["score"].isna().sum() == 0  # no missing\nassert cleaned["score"].max() <= 100     # no outlier',
        a: '<strong>数据清洗占 ML 工程师 80% 的工作时间</strong>——Garbage in, garbage out。训练数据有缺失值会导致模型报错，有异常值会导致模型偏差。'
      },
      { id: 29, s: 4, t: "简单爬虫", tag: "Demo: 数据采集",
        c: '<p>用 <code>requests</code> 获取网页 HTML，用 <code>re</code> 或 <code>BeautifulSoup</code> 解析提取数据。这是数据采集的基础。</p>',
        j: '<strong>与 JS 对比：</strong><code>requests.get(url)</code> ≈ <code>fetch(url)</code>；<code>BeautifulSoup</code> ≈ <code>cheerio</code> 或 <code>DOMParser</code>。Python 爬虫生态更成熟。',
        code: 'import requests\nimport re\nfrom bs4 import BeautifulSoup  # pip install beautifulsoup4\n\n# Fetch webpage\nurl = "https://example.com/exam-schedule"\nheaders = {"User-Agent": "Mozilla/5.0..."}\nresponse = requests.get(url, headers=headers, timeout=10)\nhtml = response.text\n\n# Extract with re (simple cases)\ndates = re.findall(r"(\\d{4}年\\d{1,2}月\\d{1,2}日)", html)\n\n# Extract with BeautifulSoup (complex cases)\nsoup = BeautifulSoup(html, "html.parser")\n\nfor row in soup.find_all("tr"):\n    cells = row.find_all("td")\n    if len(cells) >= 2:\n        subject = cells[0].text.strip()\n        date = cells[1].text.strip()\n        print(f"{subject}: {date}")\n\n# Save to CSV\nimport pandas as pd\ndata = [{"subject": s, "date": d} for s, d in results]\npd.DataFrame(data).to_csv("exam_schedule.csv", index=False)',
        e: '实现 <code>scrape_table(url, headers_row=0)</code> 函数：从网页中提取第一个 HTML 表格，返回 DataFrame。',
        ec: 'html = """\n<table>\n<tr><th>科目</th><th>日期</th></tr>\n<tr><td>数据结构</td><td>2026-10-25</td></tr>\n<tr><td>离散数学</td><td>2026-10-26</td></tr>\n</table>\n"""\nPath("test.html").write_text(html, encoding="utf-8")\n\ndf = scrape_table("test.html")\nassert len(df) == 2\nassert "科目" in df.columns\nassert df.iloc[0]["科目"] == "数据结构"',
        a: '爬虫是<strong>数据采集</strong>的核心手段——训练数据从哪来？很多来自网页爬取。RAG 系统的知识库文档也需要从网页采集。你甚至可以爬取自考真题网站，自动整理成结构化数据。'
      }

    var DEMO_MAP = {
      1:  { demo: "Prompt 模板引擎", use: "模板变量的类型判断与转换（int→str）" },
      2:  { demo: "Prompt 模板引擎", use: "模板插值核心：{key} 占位符替换" },
      3:  { demo: "Prompt 模板引擎", use: "空模板检查、变量类型判断分支" },
      4:  { demo: "Prompt 模板引擎", use: "批量渲染、遍历模板保存到文件" },
      5:  { demo: "Prompt 模板引擎", use: "render(**kwargs) 核心函数" },
      6:  { demo: "Prompt 模板引擎", use: "TemplateStore 用 dict 存储模板" },
      7:  { demo: "Prompt 模板引擎", use: "save_all / load_all 模板持久化" },
      8:  { demo: "Prompt 模板引擎", use: "TemplateNotFoundError + ValueError" },
      9:  { demo: "Prompt 模板引擎", use: "拆分为 prompt_engine.py + main.py" },
      10: { demo: "LLM 上下文管理器", use: "消息过滤、统计计数" },
      11: { demo: "LLM 上下文管理器", use: "ToolCallStack — Agent 工具调用链" },
      12: { demo: "LLM 上下文管理器", use: "ChatHistory — 对话历史管理与截断" },
      13: { demo: "LLM 上下文管理器", use: "QueryRouter — 查询意图分类路由" },
      14: { demo: "LLM 上下文管理器", use: "KnowledgeGraph — RAG 知识检索" },
      15: { demo: "LLM 上下文管理器", use: "ConversationStats — 对话统计与缓存" },
      16: { demo: "LLM API 客户端", use: "从环境变量加载 API Key 和配置" },
      17: { demo: "LLM API 客户端", use: "构建 API 请求、解析 API 响应" },
      18: { demo: "LLM API 客户端", use: "从 LLM 回复中提取代码块/JSON" },
      19: { demo: "LLM API 客户端", use: "RateLimiter 速率限制、日志时间戳" },
      20: { demo: "LLM API 客户端", use: "调用 DeepSeek API（核心）" },
      21: { demo: "LLM API 客户端", use: "ConversationLogger 日志文件管理" },
      22: { demo: "LLM API 客户端", use: "Message/APIResponse 类型定义" },
      23: { demo: "数据分析仪表盘", use: "成绩统计计算（均值/标准差/百分位）" },
      24: { demo: "数据分析仪表盘", use: "数据加载、筛选、分组聚合" },
      25: { demo: "数据分析仪表盘", use: "生成柱状图/热力图/趋势图" },
      26: { demo: "数据分析仪表盘", use: "发送数据给 LLM 生成分析报告" },
      27: { demo: "数据分析仪表盘", use: "批量加载多个月份的 CSV" },
      28: { demo: "数据分析仪表盘", use: "处理缺失/重复/异常数据" },
      29: { demo: "数据分析仪表盘", use: "采集考试时间表等外部数据" }
    };

    var JOB_KP_MAP = {
      2:  [{ id: 4, t: "Prompt工程实践" }],
      5:  [{ id: 2, t: "FastAPI接口开发" }, { id: 3, t: "LLM API调用" }],
      6:  [{ id: 2, t: "FastAPI接口开发" }],
      8:  [{ id: 1, t: "Python工程化" }, { id: 3, t: "LLM API调用" }],
      9:  [{ id: 1, t: "Python工程化" }]
    };

    function navigateToJobTree(kpId) {
      try {
        window.parent.postMessage({ action: 'navigate', module: 'ai-learning', page: 'job-skill-tree.html', kpId: kpId }, '*');
      } catch(e) { console.log('navigate failed:', e); }
    }

    var currentStage = 1;
    var stageTabs = document.getElementById("stageTabs");
    var stageBanner = document.getElementById("stageBanner");
    var kpList = document.getElementById("kpList");
    var kpEmpty = document.getElementById("kpEmpty");
    var searchInput = document.getElementById("kp-search");
    var doneEl = document.getElementById("kp-done");
    var totalEl = document.getElementById("kp-total");
    var fillEl = document.getElementById("kp-progress-fill");
    var resetBtn = document.getElementById("kp-reset-btn");

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function hl(code) {
      var s = esc(code);
      s = s.replace(/(#.*?)(?=\n|$)/g, function(m) {
        return "\x01CMT\x01" + m + "\x01/CMT\x01";
      });
      s = s.replace(/("[^"]*")/g, function(m) {
        return "\x01STR\x01" + m + "\x01/STR\x01";
      });
      s = s.replace(/\b(def|class|if|elif|else|for|while|return|import|from|as|try|except|finally|raise|with|pass|None|True|False|and|or|not|in|is|lambda|assert|yield|break|continue|global|del)\b/g, '<span class="kw">$1</span>');
      s = s.replace(/\x01CMT\x01/g, '<span class="cmt">').replace(/\x01\/CMT\x01/g, "</span>");
      s = s.replace(/\x01STR\x01/g, '<span class="str">').replace(/\x01\/STR\x01/g, "</span>");
      return s;
    }

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch(e) { return {}; }
    }
    function saveState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function renderStageTabs() {
      stageTabs.innerHTML = STAGES.map(function(st) {
        var count = KP.filter(function(k) { return k.s === st.id; }).length;
        var checked = KP.filter(function(k) { return k.s === st.id && loadState()[k.id]; }).length;
        return '<button class="stage-tab' + (st.id === currentStage ?" active" : "") + '" data-stage="' + st.id + '">' +
          '<span class="stage-num">' + st.weeks + '</span>' +
          st.name +
          '<span class="stage-count">' + checked + "/" + count + '</span>' +
        '</button>';
      }).join("");
      stageTabs.querySelectorAll(".stage-tab").forEach(function(btn) {
        btn.addEventListener("click", function() {
          currentStage = parseInt(this.getAttribute("data-stage"));
          searchInput.value = "";
          renderStageTabs();
          renderBanner();
          renderList();
        });
      });
    }

    function renderBanner() {
      var st = STAGES.find(function(s) { return s.id === currentStage; });
      stageBanner.innerHTML =
        '<div class="stage-banner-title">Demo: ' + st.demo + '</div>' +
        '<div class="stage-banner-desc">' + st.desc + '</div>' +
        '<div class="stage-banner-features">' +
          st.features.map(function(f) { return '<span class="stage-banner-feature">' + f + '</span>'; }).join("") +
        '</div>';
    }

    function renderList() {
      var q = searchInput.value.trim().toLowerCase();
      var items = KP.filter(function(k) { return k.s === currentStage; });
      if (q) {
        items = KP.filter(function(k) {
          var text = (k.t + " " + k.tag + " " + k.c + " " + k.a).toLowerCase();
          return text.indexOf(q) !== -1;
        });
      }
      if (items.length === 0) {
        kpList.innerHTML = "";
        kpEmpty.style.display = "block";
        return;
      }
      kpEmpty.style.display = "none";
      var state = loadState();
      kpList.innerHTML = items.map(function(k) {
        var checked = !!state[k.id];
        return '<div class="kp-card" data-id="' + k.id + '">' +
          '<div class="kp-header">' +
            '<span class="kp-num">' + (k.id < 10 ? "0" + k.id : k.id) + '</span>' +
            '<span class="kp-title">' + k.t + '</span>' +
            '<span class="kp-tag">' + k.tag + '</span>' +
            '<input type="checkbox" class="kp-check" data-id="' + k.id + '" ' + (checked ? "checked" : "") + ' style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);" onclick="event.stopPropagation()">' +
            '<span class="kp-toggle">&#9660;</span>' +
          '</div>' +
          '<div class="kp-body">' +
            '<div class="kp-layer"><h3>&#128214; 概念解释</h3>' + k.c + '<div class="js-compare">' + k.j + '</div></div>' +
            '<div class="kp-layer"><h3>&#128187; 代码示例</h3><div class="kp-code-block"><button class="kp-copy-btn">复制</button><pre class="kp-code">' + hl(k.code) + '</pre></div></div>' +
            '<div class="kp-layer exercise"><h3>&#9999;&#65039; 手写练习</h3><p>' + k.e + '</p>' +
              '<button class="kp-answer-toggle"><span>查看参考答案</span><span class="kp-answer-icon">&#9660;</span></button>' +
              '<div class="kp-answer-wrap"><div class="kp-code-block"><button class="kp-copy-btn">复制</button><pre class="kp-code">' + hl(k.ec) + '</pre></div></div>' +
            '</div>' +
            '<div class="kp-layer ai"><h3>&#129302; AI 场景</h3><p>' + k.a + '</p></div>' +
            (DEMO_MAP[k.id] ? '<div class="kp-layer demo"><h3>&#128640; Demo 应用</h3><span class="kp-demo-badge">' + DEMO_MAP[k.id].demo + '</span><p class="kp-demo-use">' + DEMO_MAP[k.id].use + '</p></div>' : '') +
            (JOB_KP_MAP[k.id] ? '<div class="kp-layer" style="border-top:1px dashed var(--light);padding-top:0.5rem"><h3 style="color:var(--accent2)">🎯 关联岗位技能</h3>' + JOB_KP_MAP[k.id].map(function(j){return '<span style="display:inline-block;padding:2px 8px;background:var(--accent2-soft);border:1px solid var(--purple-soft);border-radius:4px;font-size:0.75rem;color:var(--accent2);cursor:pointer;margin-right:0.3rem" onclick="navigateToJobTree('+j.id+')">KP'+j.id+': '+j.t+'</span>'}).join('') + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join("");

      kpList.querySelectorAll(".kp-header").forEach(function(hdr) {
        hdr.addEventListener("click", function() {
          this.parentElement.classList.toggle("open");
        });
      });
      kpList.querySelectorAll(".kp-check").forEach(function(cb) {
        cb.addEventListener("change", function() {
          var id = parseInt(this.getAttribute("data-id"));
          var state = loadState();
          if (this.checked) state[id] = true; else delete state[id];
          saveState(state);
          updateProgress();
          renderStageTabs();
        });
      });
      kpList.querySelectorAll(".kp-answer-toggle").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var wrap = this.nextElementSibling;
          var label = this.querySelector("span:first-child");
          if (wrap.classList.contains('zk-show')) {
            wrap.classList.remove('zk-show');
            this.classList.remove("open");
            label.textContent = "查看参考答案";
          } else {
            wrap.classList.add('zk-show');
            this.classList.add("open");
            label.textContent = "收起参考答案";
          }
        });
      });
      kpList.querySelectorAll(".kp-copy-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var code = this.nextElementSibling.textContent;
          navigator.clipboard.writeText(code).then(function() {
            btn.textContent = "已复制";
            btn.classList.add("copied");
            setTimeout(function() {
              btn.textContent = "复制";
              btn.classList.remove("copied");
            }, 1500);
          }).catch(function() {
            var ta = document.createElement("textarea");
            ta.value = code;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            btn.textContent = "已复制";
            btn.classList.add("copied");
            setTimeout(function() {
              btn.textContent = "复制";
              btn.classList.remove("copied");
            }, 1500);
          });
        });
      });
    }

    function updateProgress() {
      var total = KP.length;
      var state = loadState();
      var done = KP.filter(function(k) { return state[k.id]; }).length;
      doneEl.textContent = done;
      totalEl.textContent = total;
      fillEl.style.width = (total ? Math.round(done / total * 100) : 0) + "%";

      var summary = { total: total, done: done, stages: {} };
      STAGES.forEach(function(st) {
        var stageKps = KP.filter(function(k) { return k.s === st.id; });
        var stageDone = stageKps.filter(function(k) { return state[k.id]; }).length;
        summary.stages[st.id] = { total: stageKps.length, done: stageDone };
      });
      try { localStorage.setItem("py_kp_progress", JSON.stringify(summary)); } catch(e) {}
    }

    searchInput.addEventListener("input", function() {
      if (searchInput.value.trim()) {
        renderList();
      } else {
        renderList();
      }
    });

    resetBtn.addEventListener("click", function() {
      if (!confirm("确定要重置全部勾选进度吗？此操作不可撤销。")) return;
      saveState({});
      updateProgress();
      renderStageTabs();
      renderList();
    });

    renderStageTabs();
    renderBanner();
    renderList();
    updateProgress();
  })();
  </script>
</body>
</html>
