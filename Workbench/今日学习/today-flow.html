<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日学习流</title>
<script src="../../js/shared/theme-sync.js"></script>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/今日学习/今日学习流.css">
</head>
<body>

<div class="tf-topbar">
  <h1>🏠 今日学习流</h1>
  <div class="tf-progress-bar"><div class="tf-progress-fill" id="progressFill"></div></div>
  <span class="tf-progress-text" id="progressText">0/0</span>
  <span class="tf-countdown" id="countdown"></span>
</div>

<div id="offlineNotice" class="tf-offline-notice zk-hidden">
  ⚠️ AI伴读未连接，启动 dev_server.py 获得完整体验（当前为静态学习清单模式）
</div>

<!-- 移动端 AI 私教浮动开关按钮（桌面端隐藏） -->
<button class="tf-ai-toggle" id="aiToggleBtn" onclick="toggleAIPanel()">🤖</button>
<!-- 移动端遮罩层 -->
<div class="tf-ai-overlay" id="aiOverlay" onclick="closeAIPanel()"></div>

<div class="tf-main">
  <div class="tf-task-area" id="taskArea">
    <div class="tf-empty"><h2>加载中...</h2><p>正在读取今日学习计划</p></div>
  </div>
  <div class="tf-ai-panel" id="aiPanel">
    <div class="tf-ai-header">
      <div class="tf-ai-status offline" id="aiStatus"></div>
      <h2>🤖 AI 私教</h2>
      <button class="tf-ai-close-btn" onclick="closeAIPanel()" title="收起">✕</button>
    </div>
    <div class="tf-ai-messages" id="aiMessages">
      <div class="tf-ai-msg ai">正在读取学习进度...</div>
    </div>
    <div class="tf-ai-input">
      <textarea id="aiInput" placeholder="有问题随时问我..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend();}"></textarea>
      <button class="tf-ai-send zk-btn-primary" id="aiSendBtn" disabled onclick="aiSend()">发送</button>
    </div>
  </div>
</div>

<div class="tf-overview" id="overview" class="tf-overview zk-hidden">
  <div class="tf-overview-title">今日概览</div>
  <div class="tf-overview-list" id="overviewList"></div>
</div>



  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/今日学习/today-flow.js"></script>
</body>
</html>
