<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习驾驶舱 · 统筹计划与进度总览</title>
<script src="../../js/shared/theme-sync.js"></script>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/能力提升/能力提升驾驶舱.css">
</head>
<body>
<article class="dash-page">
  <div class="dash-header-actions">
      <button class="dash-btn dash-btn-secondary dash-view-btn zk-btn-outline" data-view="dashboard">📋 统筹计划</button>
      <button class="dash-btn dash-btn-secondary dash-view-btn zk-btn-outline" data-view="ai">🤖 AI统筹规划师</button>
      <button class="dash-btn dash-btn-secondary dash-view-btn zk-btn-outline" data-view="daily">📅 每日执行计划</button>
      <button class="dash-btn dash-btn-secondary dash-view-btn zk-btn-outline" data-view="completion">📈 综合完成度</button>
      <button class="dash-btn dash-btn-secondary dash-view-btn zk-btn-outline" data-view="roadmap">🗺️ 学习路线</button>
    </div>

  <div class="dash-panel zk-active" id="panel-dashboard">
    <!-- 倒计时 -->
    <div class="dash-countdown-row" id="countdownRow"></div>

    <!-- 周任务概览 -->
    <div class="wk-section">
      <h2>阶段周任务概览</h2>
      <div class="wk-phase-nav" id="wkPhaseNav">
        <button data-phase="0">初级阶段：各章梳理+练习</button>
        <button data-phase="1">中间阶段：重点难点突破</button>
        <button data-phase="2">冲刺阶段：模拟考+题海</button>
      </div>
      <div id="weeksContainer"></div>
    </div>

  </div><!-- /panel-dashboard -->

  <div class="dash-panel" id="panel-completion">
    <div class="dash-overall" id="compOverall">
      <div class="dash-overall-row">
        <span class="dash-overall-title">总进度</span>
        <span class="dash-overall-percent" id="compTotalPercent">—</span>
      </div>
      <div class="dash-overall-bar">
        <div class="dash-overall-fill" id="compTotalFill"></div>
      </div>
      <div class="dash-overall-stats" id="compTotalStats"></div>
    </div>

    <section class="comp-section">
      <h2>各科目完成度</h2>
      <div class="comp-grid" id="compSubjectGrid"></div>
    </section>

    <section class="comp-section">
      <h2>Python 完成度</h2>
      <div class="comp-grid" id="compPythonGrid"></div>
    </section>

    <section class="comp-section">
      <h2>AI 学习完成度</h2>
      <div class="comp-grid" id="compAIGrid"></div>
    </section>

    <div class="dash-tip">
      进度数据来自各模块页面的 localStorage，每 3 秒自动刷新
    </div>
  </div><!-- /panel-completion -->

  <div class="dash-panel" id="panel-daily">
    <div class="dp-exec-empty" id="dpExecEmpty">
      <p>📋 尚无逐日计划数据</p>
      <p class="dp-exec-hint">请先在「AI统筹规划师」中生成本周计划，此处将自动细化为每小时课程表</p>
    </div>
    <div class="dp-exec-container" id="dpExecContainer"></div>
  </div><!-- /panel-daily -->

  <div class="dash-panel" id="panel-ai">
    <div class="ai-scenario-row">
      <button class="ai-scenario-btn zk-btn-primary" onclick="aiGenerate()">📅 生成本周计划</button>
      <button class="ai-scenario-btn zk-btn-primary" onclick="aiAdjust()">🔄 调整后续计划</button>
      <button class="ai-scenario-btn zk-btn-primary" onclick="aiReview()">✅ 验收今日任务</button>
    </div>
    <div class="ai-status" id="aiStatus">点击上方按钮开始，也可以在下方直接输入需求告诉 AI</div>
    <div class="ai-daily-plan" id="aiDailyPlan"></div>
    <div class="ai-conversation" id="aiConversation"></div>
    <div class="ai-conv-actions"><button class="ai-clear-btn zk-btn-ghost" onclick="aiClearChat()">🗑️ 清空对话</button></div>
    <div class="ai-input-row">
      <textarea class="ai-input" id="aiInput" placeholder="告诉 AI 你的情况：比如「离散数学第1章没跟上，需要调整后续计划」" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSendMessage();}"></textarea>
      <button class="ai-send-btn zk-btn-primary" onclick="aiSendMessage()">发送</button>
    </div>
  </div><!-- /panel-ai -->

  <div class="dash-panel" id="panel-roadmap">
    <iframe class="dash-roadmap-frame" src="full-learning-roadmap.html" loading="lazy"></iframe>
  </div><!-- /panel-roadmap -->

  <div class="dash-toast" id="dashToast"></div>
</article>



  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/能力提升/能力提升-学习驾驶舱.js"></script>
</body>
</html>
