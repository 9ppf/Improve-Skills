<article class="dash-page">
  <div class="dash-header-actions">

<script>
/**
 * 学习驾驶舱 · 统筹计划与进度总览
 *
 * 1. 从 self-study.json 读取考试科目、考试时间、阶段、建议
 * 2. 从 localStorage 读取各科掌握度、Python、真题、背诵卡进度
 * 3. 支持编辑本周时间分配和任务清单（保存到 localStorage）
 */

var PY_BRANCHES = [
  { prefix: 'syntax', name: '语法基础', total: 9 },
  { prefix: 'data',   name: '数据结构', total: 6 },
  { prefix: 'lib',    name: '常用库',   total: 7 },
  { prefix: 'ai',     name: '面向 AI', total: 7 }
];

var SUBJECT_NAMES = {
  '02324': '离散数学',
  '13015': '计算机系统原理',
  '13003': '数据结构与算法',
  '00023': '高等数学（工本）',
  '00015': '英语（二）'
};

var TIME_STORAGE_KEY = 'dash_weekly_time_v1';
var TASKS_STORAGE_KEY = 'dash_weekly_tasks_v1';

var selfStudyData = null;

function safeParse(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || '') || fallback; }
  catch(e) { return fallback; }
}

function safeSave(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
}

function showToast(msg) {
  var toast = document.getElementById('dashToast');
  toast.textContent = msg;
  toast.classList.add('dash-show');
  setTimeout(function() { toast.classList.remove('dash-show'); }, 2000);
}

function daysUntil(dateStr) {
  if (!dateStr || dateStr === '待定') return null;
  var match = String(dateStr).match(/(\d{4})\.(\d{1,2})/);
  if (!match) return null;
  var target = new Date(parseInt(match[1]), parseInt(match[2]) - 1, 15);
  var now = new Date();
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

// ---------- Data Loading ----------
function loadSelfStudyData() {
  return fetch(apiUrl('/data/modules/self-study.json'))
    .then(function(r) { return r.json(); })
    .then(function(data) { selfStudyData = data; })
    .catch(function(err) {
      console.error('加载 self-study.json 失败', err);
      selfStudyData = { categories: [] };
    });
}

function getSubjectItems() {
  var items = [];
  if (!selfStudyData || !selfStudyData.categories) return items;
  selfStudyData.categories.forEach(function(cat) {
    (cat.items || []).forEach(function(item) {
      if (item.items) {
        item.items.forEach(function(sub) {
          if (sub.code) items.push(sub);
        });
      } else if (item.code) {
        items.push(item);
      }
    });
  });
  return items;
}

function getSubjectMastery(code) {
  return safeParse('ss_mastery_' + code, { mastery: {} }).mastery || {};
}

function getPyKnowledgeProgress() {
  var state = safeParse('py_knowledge_tree_v1', {});
  var done = Object.keys(state).length;
  var total = 29;
  var branches = PY_BRANCHES.map(function(b) {
    var bDone = Object.keys(state).filter(function(k) {
      return k.indexOf(b.prefix + '-') === 0;
    }).length;
    return { name: b.name, done: bDone, total: b.total };
  });
  return { done: done, total: total, percent: Math.min(100, Math.round(done / total * 100)), branches: branches };
}

function getPyLoopProgress() {
  var loops = safeParse('py_learning_loops_v1', []);
  var total = loops.length * 5;
  var done = loops.reduce(function(s, l) {
    return s + (l.steps || []).filter(function(x) { return x; }).length;
  }, 0);
  var fullLoops = loops.filter(function(l) {
    return (l.steps || []).every(function(x) { return x; });
  }).length;
  return { done: done, total: total, percent: total ? Math.min(100, Math.round(done / total * 100)) : 0, loopCount: loops.length, fullLoops: fullLoops };
}

function getExamProgress() {
  var data = safeParse('exam-questions-data', {});
  var total = 0, correct = 0, wrong = 0, pending = 0;
  var subjects = {};
  for (var sk in data) {
    if (!data.hasOwnProperty(sk)) continue;
    var items = data[sk] || [];
    subjects[sk] = { total: items.length, correct: 0 };
    items.forEach(function(q) {
      total++;
      if (q.status === 'correct') { correct++; subjects[sk].correct++; }
      else if (q.status === 'wrong') wrong++;
      else pending++;
    });
  }
  return { done: correct, total: total, percent: total ? Math.min(100, Math.round(correct / total * 100)) : 0, wrong: wrong, pending: pending, subjects: subjects };
}

function getReciteProgress() {
  var data = safeParse('recite-cards-data', {});
  var total = 0, known = 0, unsure = 0, unknown = 0;
  var subjects = {};
  for (var sk in data) {
    if (!data.hasOwnProperty(sk)) continue;
    var items = data[sk] || [];
    subjects[sk] = { total: items.length, known: 0 };
    items.forEach(function(c) {
      total++;
      if (c.mastery === 'known') { known++; subjects[sk].known++; }
      else if (c.mastery === 'unsure') unsure++;
      else unknown++;
    });
  }
  return { done: known, total: total, percent: total ? Math.min(100, Math.round(known / total * 100)) : 0, unsure: unsure, unknown: unknown, subjects: subjects };
}

function levelClass(percent) {
  if (percent >= 60) return 'good';
  if (percent >= 1) return 'mid';
  return 'low';
}

function subjectLabel(code) {
  return SUBJECT_NAMES[code] || code;
}

// ---------- Planning Section ----------
function renderPlanning() {
  renderCountdown();
}

function renderCountdown() {
  var row = document.getElementById('countdownRow');
  row.innerHTML = '';
  var items = getSubjectItems().filter(function(s) { return s.exam && s.exam !== '待定'; });

  if (items.length === 0) {
    row.innerHTML = '<div class="dash-empty"><div class="dash-empty-icon">📅</div>暂无考试日期数据</div>';
    return;
  }

  items.sort(function(a, b) {
    return (daysUntil(a.exam) || 9999) - (daysUntil(b.exam) || 9999);
  });

  items.forEach(function(item) {
    var days = daysUntil(item.exam);
    var cls = 'dash-countdown-days';
    if (days !== null) {
      if (days <= 30) cls += ' urgent';
      else if (days <= 60) cls += ' warn';
    }
    var div = document.createElement('div');
    div.className = 'dash-countdown-item';
    div.innerHTML =
      '<div class="' + cls + '">' + (days !== null ? days : '—') + '</div>' +
      '<div class="dash-countdown-label">天后考试</div>' +
      '<div class="dash-countdown-meta">' + subjectLabel(item.code) + ' · ' + item.exam + '</div>';
    row.appendChild(div);
  });
}

function initTimeInputs() {
  var saved = safeParse(TIME_STORAGE_KEY, { exam: 12, python: 2, ai: 2, rest: 2 });
  document.getElementById('examHours').value = saved.exam;
  document.getElementById('pythonHours').value = saved.python;
  document.getElementById('aiHours').value = saved.ai;
  document.getElementById('restHours').value = saved.rest;

  ['examHours', 'pythonHours', 'aiHours', 'restHours'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', updateTimeSummary);
  });

function updateTimeSummary() {
  var exam = parseFloat(document.getElementById('examHours').value) || 0;
  var python = parseFloat(document.getElementById('pythonHours').value) || 0;
  var ai = parseFloat(document.getElementById('aiHours').value) || 0;
  var rest = parseFloat(document.getElementById('restHours').value) || 0;
  var total = exam + python + ai + rest;

  document.getElementById('totalHours').textContent = total;
  document.getElementById('examBar').style.width = total ? (exam / total * 100) + '%' : '0%';
  document.getElementById('pythonBar').style.width = total ? (python / total * 100) + '%' : '0%';
  document.getElementById('aiBar').style.width = total ? (ai / total * 100) + '%' : '0%';
  document.getElementById('restBar').style.width = total ? (rest / total * 100) + '%' : '0%';

  safeSave(TIME_STORAGE_KEY, { exam: exam, python: python, ai: ai, rest: rest });
}

function renderTasks() {
  var list = document.getElementById('taskList');
  var tasks = getWeeklyTasks();
  list.innerHTML = '';

  if (tasks.length === 0) {
    list.innerHTML = '<div class="dash-task-empty">暂无任务，点击下方添加或使用 AI 规划师生成</div>';
    return;
  }

  tasks.forEach(function(task, index) {
    var div = document.createElement('div');
    div.className = 'dash-task-item' + (task.done ? ' done' : '');
    div.innerHTML =
      '<input type="checkbox" id="task_' + index + '" ' + (task.done ? 'checked' : '') + '>' +
      '<label for="task_' + index + '">' + escapeHtml(task.text) + '</label>' +
      '<span class="dash-task-tag ' + task.category + '">' + categoryLabel(task.category) + '</span>';

    div.querySelector('input').addEventListener('change', function() {
      toggleTask(index, this.checked);
    });
    list.appendChild(div);
  });
}

function categoryLabel(cat) {
  var map = { exam: '自考', python: 'AI工程', ai: 'AI学习', other: '其他' };
  return map[cat] || '其他';
}

function getWeeklyTasks() {
  var saved = safeParse(TASKS_STORAGE_KEY, []);
  if (saved.length > 0) return saved;

  // Seed tasks from self-study.json if none saved
  var seeded = [];
  getSubjectItems().forEach(function(item) {
    if (item.tasks && item.tasks.length) {
      item.tasks.forEach(function(t) {
        seeded.push({ text: '[' + subjectLabel(item.code) + '] ' + t, done: false, category: 'exam' });
      });
    }
  });
  return seeded;
}

function saveTasks(tasks) {
  safeSave(TASKS_STORAGE_KEY, tasks);
  renderTasks();
}

function toggleTask(index, done) {
  var tasks = getWeeklyTasks();
  if (tasks[index]) {
    tasks[index].done = done;
    saveTasks(tasks);
  }
}

function addTask() {
  var input = document.getElementById('newTaskInput');
  var text = input.value.trim();
  if (!text) return;
  var tasks = getWeeklyTasks();
  var category = 'other';
  if (/离散|系统|数据|高等|英语|自考/i.test(text)) category = 'exam';
  else if (/python|py/i.test(text)) category = 'python';
  else if (/ai/i.test(text)) category = 'ai';
  tasks.push({ text: text, done: false, category: category });
  saveTasks(tasks);
  input.value = '';
  showToast('已添加任务');
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Overall Progress ----------
function renderOverall(pyKt, pyLoop, exam, recite) {
  if (!document.getElementById('overallPercent')) return;
  var allDone = pyKt.done + pyLoop.done + exam.done + recite.done;
  var allTotal = pyKt.total + pyLoop.total + exam.total + recite.total;
  var overallPercent = allTotal ? Math.min(100, Math.round(allDone / allTotal * 100)) : 0;

  document.getElementById('overallPercent').textContent = overallPercent + '%';
  document.getElementById('overallFill').style.width = overallPercent + '%';

  var statsHtml =
    '<span>🐍 Python 知识树 ' + pyKt.done + '/' + pyKt.total + '</span>' +
    '<span>🔄 学习闭环 ' + pyLoop.done + '/' + pyLoop.total + '</span>' +
    '<span>📝 真题 ' + exam.done + '/' + exam.total + '</span>' +
    '<span>🎴 背诵卡 ' + recite.done + '/' + recite.total + '</span>';
  document.getElementById('overallStats').innerHTML = statsHtml;
}

// ---------- Module Cards ----------
function renderCards() {
  var pyKt = getPyKnowledgeProgress();
  var pyLoop = getPyLoopProgress();
  var exam = getExamProgress();
  var recite = getReciteProgress();

  renderOverall(pyKt, pyLoop, exam, recite);

  var grid = document.getElementById('moduleGrid');
  var cards = [];

  // Python knowledge tree
  var pyKtCls = levelClass(pyKt.percent);
  var pyKtDetail = pyKt.branches.map(function(b) {
    return '<span>' + b.name + ' ' + b.done + '/' + b.total + '</span>';
  }).join('');
  if (pyKt.done === 0) pyKtDetail = '<div class="dash-empty"><div class="dash-empty-icon">🌱</div>尚未开始勾选知识点</div>';
  cards.push(
    '<div class="dash-card">' +
    '<div class="dash-card-header"><span class="dash-card-icon">🐍</span>' +
    '<span class="dash-card-name">Python 知识树</span>' +
    '<span class="dash-card-percent ' + pyKtCls + '">' + pyKt.percent + '%</span></div>' +
    '<div class="dash-card-bar"><div class="dash-card-fill ' + pyKtCls + '" style="width:' + pyKt.percent + '%"></div></div>' +
    '<div class="dash-card-detail">' + pyKtDetail + '</div></div>'
  );

  // Python learning loop
  var pyLoopCls = levelClass(pyLoop.percent);
  var pyLoopDetail = pyLoop.loopCount === 0
    ? '<div class="dash-empty"><div class="dash-empty-icon">🔄</div>尚未创建学习闭环</div>'
    : '<span>闭环数 ' + pyLoop.loopCount + '</span><span>走完 5 步 ' + pyLoop.fullLoops + '</span>';
  cards.push(
    '<div class="dash-card">' +
    '<div class="dash-card-header"><span class="dash-card-icon">🔄</span>' +
    '<span class="dash-card-name">Python 学习闭环</span>' +
    '<span class="dash-card-percent ' + pyLoopCls + '">' + pyLoop.percent + '%</span></div>' +
    '<div class="dash-card-bar"><div class="dash-card-fill ' + pyLoopCls + '" style="width:' + pyLoop.percent + '%"></div></div>' +
    '<div class="dash-card-detail">' + pyLoopDetail + '</div></div>'
  );

  // Exam practice
  var examCls = levelClass(exam.percent);
  var examDetail;
  if (exam.total === 0) {
    examDetail = '<div class="dash-empty"><div class="dash-empty-icon">📝</div>尚未添加真题</div>';
  } else {
    examDetail = '<span>已掌握 ' + exam.done + '</span><span>错题 ' + exam.wrong + '</span><span>待做 ' + exam.pending + '</span>';
    for (var sk in exam.subjects) {
      if (!exam.subjects.hasOwnProperty(sk)) continue;
      var s = exam.subjects[sk];
      examDetail += '<span>' + subjectLabel(sk) + ' ' + s.correct + '/' + s.total + '</span>';
    }
  }
  cards.push(
    '<div class="dash-card">' +
    '<div class="dash-card-header"><span class="dash-card-icon">📝</span>' +
    '<span class="dash-card-name">真题练习</span>' +
    '<span class="dash-card-percent ' + examCls + '">' + exam.percent + '%</span></div>' +
    '<div class="dash-card-bar"><div class="dash-card-fill ' + examCls + '" style="width:' + exam.percent + '%"></div></div>' +
    '<div class="dash-card-detail">' + examDetail + '</div></div>'
  );

  // Recitation cards
  var reciteCls = levelClass(recite.percent);
  var reciteDetail;
  if (recite.total === 0) {
    reciteDetail = '<div class="dash-empty"><div class="dash-empty-icon">🎴</div>尚未添加背诵卡</div>';
  } else {
    reciteDetail = '<span>已掌握 ' + recite.done + '</span><span>不熟练 ' + recite.unsure + '</span><span>不会 ' + recite.unknown + '</span>';
    for (var rk in recite.subjects) {
      if (!recite.subjects.hasOwnProperty(rk)) continue;
      var rs = recite.subjects[rk];
      reciteDetail += '<span>' + subjectLabel(rk) + ' ' + rs.known + '/' + rs.total + '</span>';
    }
  }
  cards.push(
    '<div class="dash-card">' +
    '<div class="dash-card-header"><span class="dash-card-icon">🎴</span>' +
    '<span class="dash-card-name">背诵卡</span>' +
    '<span class="dash-card-percent ' + reciteCls + '">' + recite.percent + '%</span></div>' +
    '<div class="dash-card-bar"><div class="dash-card-fill ' + reciteCls + '" style="width:' + recite.percent + '%"></div></div>' +
    '<div class="dash-card-detail">' + reciteDetail + '</div></div>'
  );

  grid.innerHTML = cards.join('');
}

function loadWeekData() {

    localStorage.setItem(SCHEDULE_VERSION_KEY, SCHEDULE_VERSION);
  }
  var saved = safeParse(SCHEDULE_STORAGE_KEY, null);
  if (saved && Array.isArray(saved) && saved.length > 0) return saved;
  return WEEK_DATA;
}

// 异步从 data/study-plan.json 加载计划数据（source of truth），写入 localStorage 缓存
function loadPlanFromJSON() {
  return fetch(apiUrl('/data/study-plan.json'))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.weeks && Array.isArray(data.weeks) && data.weeks.length > 0) {
        safeSave(SCHEDULE_STORAGE_KEY, data.weeks);
        localStorage.setItem(SCHEDULE_VERSION_KEY, SCHEDULE_VERSION);
      }
      // 加载每日计划数据到 localStorage（按当前日期匹配周次）
      if (data && data.dailyPlans && Array.isArray(data.dailyPlans) && data.dailyPlans.length > 0) {
        var today = new Date();
        var todayStr = (today.getMonth() + 1) + '/' + today.getDate();
        var matched = null;
        for (var i = 0; i < data.dailyPlans.length; i++) {
          var dp = data.dailyPlans[i];
          if (dp.days && dp.days.some(function(d) { return d.date === todayStr; })) {
            matched = dp;
            break;
          }
        }
        if (!matched) matched = data.dailyPlans[0];
        if (matched && matched.days && matched.days.length > 0) {
          try {
            saveAIPlan(matched);
          } catch(e) {}
        }
      }
    })
    .catch(function(e) {
      // JSON 文件不可用，使用 inline WEEK_DATA（loadWeekData 会处理）
    });
}

// 按日期自动选择阶段，可被 localStorage 手动覆盖
function autoSelectPhase() {
  var override = localStorage.getItem(PHASE_OVERRIDE_KEY);
  if (override !== null) {
    var p = parseInt(override);
    if (!isNaN(p) && p >= 0 && p <= 2) { currentPhase = p; return; }
  }
  var today = new Date();
  for (var i = 0; i < PHASE_RANGES.length; i++) {
    var start = new Date(PHASE_RANGES[i].start);
    var end = new Date(PHASE_RANGES[i].end);
    if (today >= start && today <= end) { currentPhase = i; return; }
  }
  // 默认初级
  currentPhase = 0;
}

function renderWeeks() {
  autoSelectPhase();
  updatePhaseNav();
  var data = loadWeekData();
  var container = document.getElementById('weeksContainer');
  if (!container) return;
  var phaseData = data.filter(function(w) { return w.phase === currentPhase; });
  var html = '';
  phaseData.forEach(function(week) {
    var wi = data.indexOf(week);
    var doneCount = week.goals.filter(function(g) { return g.done; }).length;
    var totalCount = week.goals.length;
    var pct = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;
    html += '<div class="wk-week' + (week.isCurrent ? ' current' : '') + '">';
    html += '<div class="wk-week-header"><div><div class="wk-week-title">';
    if (week.badge) html += '<span class="wk-week-badge">' + escapeHtml(week.badge) + '</span>';
    html += escapeHtml(week.week) + '</div><div class="wk-week-dates">' + escapeHtml(week.dates) + '</div></div>';
    html += '<div class="wk-week-progress"><div class="pct">' + pct + '%</div><div class="label">' + doneCount + '/' + totalCount + ' 项</div></div></div>';
    // 简洁列表：科目标签 + 章节 + 知识点
    html += '<div class="wk-goals wk-goals-simple">';
    week.goals.forEach(function(goal, gi) {
      var goalSubject = goal.subject || goal.tagText || '';
      var goalChapter = goal.chapter || '';
      var goalTopic = goal.topic || goal.text || '';
      html += '<div class="wk-goal-simple' + (goal.done ? ' done' : '') + '">';
      html += '<div class="wk-check' + (goal.done ? ' checked' : '') + '" onclick="toggleGoal(' + wi + ',' + gi + ')"></div>';

    });

    html += '</div>';
  });
  container.innerHTML = html;
}

function aiGatherContext() {
  var schedule = loadWeekData();
  var currentWeeks = schedule.filter(function(w) { return w.phase === currentPhase; });
  var totalGoals = 0, doneGoals = 0;
  currentWeeks.forEach(function(w) {

  });

  // 科目掌握度
  var subjects = [];
  var codes = [{code:'02324',name:'离散数学'},{code:'13015',name:'计算机系统原理'},{code:'13003',name:'数据结构与算法'}];
  codes.forEach(function(s) {
    var m = safeParse('ss_mastery_' + s.code, {mastery:{}}).mastery || {};
    var mastered = Object.values(m).filter(function(v){return v===2;}).length;
    subjects.push(s.name + '(已掌握' + mastered + '章)');
  });

  // Python 进度
  var pyState = safeParse('py_knowledge_tree_v1', {});
  var pyDone = Object.keys(pyState).length;

  return {
    phase: currentPhase,
    phaseName: PHASE_RANGES[currentPhase].name,
    totalGoals: totalGoals,
    doneGoals: doneGoals,
    completionRate: totalGoals > 0 ? Math.round(doneGoals/totalGoals*100) + '%' : '0%',
    subjects: subjects.join('、'),
    pythonProgress: pyDone + '/29',
    currentWeeks: currentWeeks.map(function(w) {
      return w.week + '(' + w.dates + '): ' + w.goals.map(function(g) {
        var ch = g.chapter || '';
        var tp = g.topic || g.text || '';
        return (g.subject || g.tagText || '') + ' ' + ch + ' ' + (g.done ? '✓' : '✗') + ' ' + tp;
      }).join('; ');
    }).join('\n')
  };
}

var AI_SCENARIO_STARTED = false; // 防止 restoreConvHistory 在场景启动后重复渲染

function restoreConvHistory() {
  // 如果用户已启动新场景，不再恢复旧对话
  if (AI_SCENARIO_STARTED) return false;
  try {
    // 恢复逐日计划
    var savedPlan = localStorage.getItem('ai_daily_plan');
    if (savedPlan) {
      var plan = JSON.parse(savedPlan);
      if (plan && plan.days) renderDailyPlan(plan);
    }
    var saved = localStorage.getItem('ai_conv_history');
    if (saved) {
      aiConvHistory = JSON.parse(saved);
      // 重新渲染对话（AI 的 JSON 消息转为可读摘要）
      aiConvHistory.forEach(function(msg) {
        if (msg.role === 'system') return;
        if (msg.role === 'assistant') {
          // 尝试解析 JSON，显示格式化摘要而非原始数据
          var result = aiParseJSON(msg.content);
          if (result && result.days) {
            var s = result.summary || '已生成逐日计划';
            aiRenderChatMsg('assistant', '✅ ' + s + '\n\n详细计划已显示在上方。');
            return;
          }
          if (result && result.weeks) {
            var s2 = result.summary || '已生成计划';
            aiRenderChatMsg('assistant', '✅ ' + s2);
            return;
          }
          if (result && result.feedback) {
            var rt = '✅ 验收反馈\n完成率：' + (result.completionRate || '未知') + '\n\n' + (result.feedback || '');
            if (result.suggestions && result.suggestions.length) {
              rt += '\n\n建议：\n' + result.suggestions.map(function(s, i) { return (i+1) + '. ' + s; }).join('\n');
            }
            aiRenderChatMsg('assistant', rt);
            return;
          }
        }
        aiRenderChatMsg(msg.role, msg.content);
      });
      return true;
    }
  } catch(e) {}
  if (!window._apiConvRestored) {
    window._apiConvRestored = true;
    Promise.all([
      fetch('/api/ai-conv').then(function(r){return r.json()}).catch(function(){return null}),
      fetch('/api/ai-plan').then(function(r){return r.json()}).catch(function(){return null})
    ]).then(function(results){
      var conv = results[0], plan = results[1];
      if (conv && conv.length) {
        try { localStorage.setItem('ai_conv_history', JSON.stringify(conv)); } catch(e) {}
      }
      if (plan && plan.days) {
        try { localStorage.setItem('ai_daily_plan', JSON.stringify(plan)); } catch(e) {}
      }
      if ((conv && conv.length) || (plan && plan.days)) {
        restoreConvHistory();
      }
    }).catch(function(e){});
  }
  return false;
}

var AI_PROGRESS_TIMER = null;
var AI_START_TIME = 0;
var AI_RETRY_CONTEXT = null; // { messages, callback, isChat, retryCount }

var AI_PROGRESS_STEPS = [
  { t: 0,  msg: '正在分析学习进度…' },
  { t: 5,  msg: '正在生成任务计划…' },

];

function aiStartProgress() {
  var el = document.getElementById('aiStatus');
  AI_PROGRESS_TIMER = setInterval(function() {
    var sec = Math.floor((Date.now() - AI_START_TIME) / 1000);
    var step = AI_PROGRESS_STEPS[0];
    for (var i = 0; i < AI_PROGRESS_STEPS.length; i++) {
      if (sec >= AI_PROGRESS_STEPS[i].t) step = AI_PROGRESS_STEPS[i];
    }
    var warn = sec >= 20 ? ' ⚠️' : '';
    el.innerHTML = '<span class="ai-loading">🤖 ' + step.msg + ' (已等待 ' + sec + 's)' + warn + '</span>';
  }, 1000);
  // 立即显示第一帧
  el.innerHTML = '<span class="ai-loading">🤖 ' + AI_PROGRESS_STEPS[0].msg + ' (已等待 0s)</span>';
}

function aiStopProgress() {
  if (AI_PROGRESS_TIMER) { clearInterval(AI_PROGRESS_TIMER); AI_PROGRESS_TIMER = null; }
}

function aiCall(messages, callback, isChat) {
  if (AI_LOADING) return;
  AI_LOADING = true;
  AI_START_TIME = Date.now();
  AI_RETRY_CONTEXT = { messages: messages, callback: callback, isChat: isChat, retryCount: 0 };
  aiStartProgress();
  aiDoFetch(messages, callback);
}

function aiDoFetch(messages, callback) {
  fetch(apiUrl('/api/chat'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: messages,
      model: 'deepseek-v4-flash',
      stream: false,
      max_tokens: 3000
    })
  }).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(txt) {
        var errMsg = txt;
        try { errMsg = JSON.parse(txt).error || txt; } catch(e) {}
        throw new Error(errMsg || ('服务器错误 ' + res.status));
      });
    }
    return res.json();
  }).then(function(data) {
    aiStopProgress();
    AI_LOADING = false;
    AI_RETRY_CONTEXT = null;
    var content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    document.getElementById('aiStatus').textContent = '✅ 收到 AI 响应，正在处理…';
    // try-catch 防止回调内 JS 错误导致无输出
    try {
      callback(content || '');
    } catch(cbErr) {
      console.error('[AI] 回调执行出错:', cbErr);
      document.getElementById('aiStatus').textContent = '⚠️ 内部错误：' + cbErr.message + '（请截图控制台联系修复）';
    }
  }).catch(function(err) {
    aiStopProgress();
    console.error('[AI] 请求失败:', err.message);
    // 自动重试 1 次
    if (AI_RETRY_CONTEXT && AI_RETRY_CONTEXT.retryCount < 1) {
      AI_RETRY_CONTEXT.retryCount++;
      document.getElementById('aiStatus').innerHTML =
        '<span class="ai-loading">🔄 连接中断，2 秒后自动重试…</span>';
      setTimeout(function() {
        AI_START_TIME = Date.now();
        aiStartProgress();
        aiDoFetch(messages, callback);
      }, 2000);
    } else {
      AI_LOADING = false;
      aiShowRetryButtons(err.message);
    }
  });
}

function aiShowRetryButtons(errMsg) {
  document.getElementById('aiStatus').innerHTML =
    '❌ 连接中断' + (errMsg ? '：' + errMsg : '') + '（已自动重试仍失败）<br>' +
    '<button class="ai-retry-btn" onclick="aiManualRetry()">🔄 手动重试</button>' +
    '<button class="ai-retry-btn ai-retry-clear" onclick="aiClearChat()">📋 清空对话重新开始</button>';
}

function aiManualRetry() {
  if (!AI_RETRY_CONTEXT) return;
  AI_LOADING = true;
  AI_START_TIME = Date.now();
  AI_RETRY_CONTEXT.retryCount = 0;
  aiStartProgress();
  aiDoFetch(AI_RETRY_CONTEXT.messages, AI_RETRY_CONTEXT.callback);
}

// 4c. JSON 解析函数（兼容 markdown 代码块标记）
function aiParseJSON(text) {
  // 去除 markdown 代码块标记
  var cleaned = text.trim();
  if (cleaned.startsWith('```')) {
    cleaned = cleaned.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
  }
  try {
    return JSON.parse(cleaned);
  } catch(e) {
    // 尝试找到第一个 { 和最后一个 }
    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try { return JSON.parse(text.substring(start, end + 1)); } catch(e2) {}
    }
    return null;
  }
}

// 4e. 逐日计划存储与渲染（独立于统筹计划）
function aiAutoApplyDaily(result) {
  if (!result || !result.days) return;
  // 存储到独立的 localStorage key，不写入统筹计划
  try {
    saveAIPlan(result);
  } catch(e) {}
  renderDailyPlan(result);
  renderDailyExecPlan(); // 同步刷新每日执行计划
}

function renderDailyPlan(result) {
  var container = document.getElementById('aiDailyPlan');
  if (!container) return;
  container.innerHTML = '';

  // 摘要
  if (result.summary) {
    var sumDiv = document.createElement('div');
    sumDiv.className = 'dp-summary';
    sumDiv.innerHTML = '<span>📋</span><span>' + escapeHtml(result.summary) + '</span>';
    container.appendChild(sumDiv);
  }

  // 按天渲染
  result.days.forEach(function(day) {
    var dayDiv = document.createElement('div');
    dayDiv.className = 'dp-day';

    // 日期头部
    var totalHours = 0;
    if (day.tasks) {
      day.tasks.forEach(function(t) { totalHours += parseFloat(t.hours) || 0; });
    }
    var header = document.createElement('div');
    header.className = 'dp-day-header';
    header.innerHTML = '<span class="dp-date">' + escapeHtml(day.date || '') + ' ' + escapeHtml(day.weekday || '') + '</span>' +
      '<span class="dp-hours">共 ' + totalHours + 'h</span>';
    dayDiv.appendChild(header);

    // 任务列表
    if (day.tasks) {
      day.tasks.forEach(function(task) {
        var taskDiv = document.createElement('div');
        taskDiv.className = 'dp-task';
        var tagClass = 'dp-tag-' + (task.tag || 'core');
        taskDiv.innerHTML = '<span class="dp-tag ' + tagClass + '">' + escapeHtml(task.subject || task.tagText || task.tag || '') + '</span>' +
          (task.chapter ? '<span class="dp-task-chapter">' + escapeHtml(task.chapter) + '</span>' : '') +
          '<span class="dp-task-text">' + escapeHtml(task.topic || task.text || '') + '</span>' +
          '<span class="dp-task-hours">' + (task.hours || '') + 'h</span>';
        dayDiv.appendChild(taskDiv);
      });
    }
    container.appendChild(dayDiv);
  });
}

// 4e-2. 每日执行计划：从 AI 逐日计划细化到小时级时段
var DP_EXEC_SLOTS = [
  { time: '08:00–10:50', hours: 2.8, tags: ['core','core2','key'], label: '上午主科（番茄法）' },
  { time: '14:00–15:30', hours: 1.5, tags: ['core','core2','key'], label: '下午练习/真题' },
  { time: '15:30–16:00', hours: 0.5, tags: ['review'], label: '间隔复习' },
  { time: '16:00–17:00', hours: 1,   tags: ['py'], label: 'AI工程' },
  { time: '19:30–20:30', hours: 1,   tags: ['ai'], label: 'AI学习' },
  { time: '20:30–21:00', hours: 0.5, tags: ['en'], label: '英语' },
  { time: '21:00–21:30', hours: 0.5, tags: ['review'], label: '当日复盘' }
];

function renderDailyExecPlan() {
  var container = document.getElementById('dpExecContainer');
  var empty = document.getElementById('dpExecEmpty');
  if (!container || !empty) return;

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('ai_daily_plan')); } catch(e) {}

  if (!saved || !saved.days || !saved.days.length) {
    container.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  // 判断今天日期（格式 X/X）
  var now = new Date();
  var todayStr = (now.getMonth() + 1) + '/' + now.getDate();

  var html = '';

  // 图例
  html += '<div class="dp-exec-legend">';
  html += '<span class="dp-exec-tag core">系统原理</span>';
  html += '<span class="dp-exec-tag core2">离散数学</span>';
  html += '<span class="dp-exec-tag key">数据结构</span>';
  html += '<span class="dp-exec-tag py">AI工程</span>';
  html += '<span class="dp-exec-tag ai">AI学习</span>';
  html += '<span class="dp-exec-tag en">英语</span>';
  html += '<span class="dp-exec-tag review">复盘</span>';
  html += '</div>';

  saved.days.forEach(function(day, dayIdx) {
    var isToday = day.date === todayStr;
    var dayClass = isToday ? 'dp-exec-day today' : 'dp-exec-day';

    html += '<div class="' + dayClass + '">';
    html += '<div class="dp-exec-day-header">';
    html += '<span>' + escapeHtml(day.date || '') + ' ' + escapeHtml(day.weekday || '') + '</span>';
    if (isToday) html += '<span class="dp-exec-badge">今天</span>';
    html += '</div>';

    var dayTasks = (day.tasks || []).map(function(t, i) {
      var copy = {};
      for (var k in t) copy[k] = t[k];
      copy._origIdx = i;
      return copy;
    });
    var slots = distributeTasksToSlots(dayTasks);

    slots.forEach(function(slot) {
      if (slot.tasks.length === 0) {
        html += '<div class="dp-exec-row">';
        html += '<span class="dp-exec-time">' + slot.time + '</span>';
        html += '<span class="dp-exec-tag rest">休息</span>';
        html += '<span>—</span>';
        html += '</div>';
      } else {
        slot.tasks.forEach(function(t, idx) {
          var taskDone = t.done || false;
          html += '<div class="dp-exec-row' + (taskDone ? ' done' : '') + '">';
          if (idx === 0) {
            html += '<span class="dp-exec-time">' + slot.time + '</span>';
          } else {
            html += '<span class="dp-exec-time"></span>';
          }
          html += '<div class="dp-exec-check' + (taskDone ? ' checked' : '') + '" onclick="toggleTaskDone(' + dayIdx + ',' + t._origIdx + ')"></div>';
          html += '<span class="dp-exec-tag ' + (t.tag || 'core') + '">' + escapeHtml(t.subject || t.tagText || t.tag || '') + '</span>';
          if (t.chapter) html += '<span class="dp-exec-chapter">' + escapeHtml(t.chapter) + '</span>';
          html += '<span class="dp-exec-topic">' + escapeHtml(t.topic || t.text || '') + (t.hours ? ' (' + t.hours + 'h)' : '') + '</span>';
          html += '</div>';
        });
      }
    });

    var outputs = [];
    (day.tasks || []).forEach(function(t) {
      if (t.tag === 'py') outputs.push('Python 代码 commit');
      else if (t.tag === 'en') outputs.push('单词背诵记录');
      else outputs.push((t.subject || t.tagText || t.tag || '') + '笔记/手绘图');
    });
    if (outputs.length) {
      html += '<div class="dp-exec-output"><strong>今日产出：</strong>' + escapeHtml(outputs.join('、')) + '</div>';
    }

    html += '</div>';
  });

  container.innerHTML = html;
}

// 将每日任务分配到 7 个固定时段（8h新方案）
function distributeTasksToSlots(tasks) {
  var slots = DP_EXEC_SLOTS.map(function(s) {
    return { time: s.time, hours: s.hours, tags: s.tags, label: s.label, tasks: [] };
  });

  var conceptTasks = [];
  var practiceTasks = [];
  var pyTasks = [];
  var aiTasks = [];
  var enTasks = [];
  var reviewTasks = [];
  var otherTasks = [];

  tasks.forEach(function(t) {
    var tag = t.tag || 'core';
    if (tag === 'core' || tag === 'core2' || tag === 'key') {
      if (t.chapter) conceptTasks.push(t);
      else practiceTasks.push(t);
    }
    else if (tag === 'py') pyTasks.push(t);
    else if (tag === 'ai') aiTasks.push(t);
    else if (tag === 'en') enTasks.push(t);
    else if (tag === 'review') reviewTasks.push(t);
    else otherTasks.push(t);
  });

  conceptTasks.forEach(function(t) { slots[0].tasks.push(t); });
  practiceTasks.forEach(function(t) { slots[1].tasks.push(t); });
  pyTasks.forEach(function(t) { slots[3].tasks.push(t); });
  aiTasks.forEach(function(t) { slots[4].tasks.push(t); });
  enTasks.forEach(function(t) { slots[5].tasks.push(t); });

  reviewTasks.forEach(function(t, idx) {
    if (idx === 0) slots[2].tasks.push(t);
    else slots[6].tasks.push(t);
  });

  if (reviewTasks.length === 0) {
    slots[6].tasks.push({ tag: 'review', subject: '复盘', chapter: '', topic: '整理当日笔记 + 错题回顾 + 次日计划确认', hours: 0.5, done: false });
  }

  otherTasks.forEach(function(t) { slots[0].tasks.push(t); });

  return slots;
}

// 4e-legacy. 旧的周计划自动应用（保留但不再被调用）
function aiAutoApply(result) {
  if (!result || !result.weeks) return;
  var isAdjust = result.action === 'adjust';
  var data = loadWeekData();
  result.weeks.forEach(function(newWeek) {
    var existing = data.find(function(w) { return w.week === newWeek.week; });
    if (existing) {
      // 替换而非追加，避免每次生成都累加任务
      existing.goals = newWeek.goals.map(function(g) {
        if (isAdjust) g.adjusted = true;
        return g;
      });
      if (newWeek.milestone) existing.milestone = newWeek.milestone;
      existing.dates = newWeek.dates || existing.dates;
      existing.phase = newWeek.phase !== undefined ? newWeek.phase : existing.phase;
    } else {
      data.push(newWeek);
    }
  });
  saveWeekData(data);
  renderWeeks();
}

// 4h. 对话消息渲染
function aiRenderChatMsg(role, text) {
  var cls = role === 'user' ? 'ai-msg-user' : 'ai-msg-bot';
  var label = role === 'user' ? '我' : '🤖 AI';
  var conv = document.getElementById('aiConversation');
  var div = document.createElement('div');
  div.className = 'ai-msg ' + cls;

  var wrap = document.createElement('div');
  wrap.className = 'ai-msg-text-wrap';
  wrap.innerHTML = '<strong>' + label + '：</strong>' + escapeHtml(text);

  var toggle = document.createElement('button');
  toggle.className = 'ai-msg-toggle';
  toggle.textContent = '展开 ▼';
  toggle.style.display = 'none';
  toggle.addEventListener('click', function() {
    if (wrap.classList.contains('ai-collapsed')) {
      wrap.classList.remove('ai-collapsed');
      toggle.textContent = '收起 ▲';
    } else {
      wrap.classList.add('ai-collapsed');
      toggle.textContent = '展开 ▼';
    }
  });

  div.appendChild(wrap);
  div.appendChild(toggle);
  conv.appendChild(div);

  var naturalH = wrap.offsetHeight;
  if (naturalH > 68 || (naturalH === 0 && text.length > 80)) {
    wrap.classList.add('ai-collapsed');
    toggle.style.display = 'inline-block';
  }

  conv.scrollTop = conv.scrollHeight;
}

function aiSendMessage() {
  var input = document.getElementById('aiInput');
  var msg = input.value.trim();
  if (!msg) return;
  if (AI_LOADING) return;
  AI_SCENARIO_STARTED = true; // 用户开始对话，不再恢复旧历史

  // 如果没有历史对话，创建一个通用的 system prompt
  if (aiConvHistory.length === 0) {
    var ctx = aiGatherContext();
    aiConvHistory = [
      { role: 'system', content: '你是一位专业的自考学习规划师。请根据学生的情况，用中文回复。' +
        '如果学生要求生成或调整计划，请返回纯 JSON 格式（不要 markdown 代码块标记）。' +
        'JSON 格式：{ action:\'generate|adjust\', days:[{date,weekday,tasks:[{tag,subject,chapter,topic,hours,done}]}], summary:\'文字总结\' }。' +
        'tag 可选值：core(系统原理),core2(离散数学),key(数据结构),py(AI工程),ai(AI学习),en(英语),review(整理复盘)。' +
        '每个任务必须包含subject(科目名)、chapter(章节)、topic(知识点)。禁止用"主科"等模糊描述。' +
        '每天11个任务：3个上午概念+3个下午练习+1个间隔复习+1个AI工程+1个AI学习+1个英语+1个复盘。hours根据章节难度灵活设定。' +
        '当前阶段：' + ctx.phaseName + '，完成率：' + ctx.completionRate + '，科目掌握：' + ctx.subjects + '，Python进度：' + ctx.pythonProgress }
    ];
  }

  // 显示用户消息
  aiRenderChatMsg('user', msg);
  aiConvHistory.push({ role: 'user', content: msg });
  input.value = '';

  // 调用 AI（aiCall 内部管理进度提示）
  aiCall(aiConvHistory, function(content) {
    if (!content) {
      document.getElementById('aiStatus').textContent = '⚠️ AI 返回为空，请重试';
      return;
    }
    aiConvHistory.push({ role: 'assistant', content: content });

    // 尝试解析 JSON（可能是计划）
    var result = aiParseJSON(content);
    if (result && result.days) {
      // 是逐日计划 JSON，自动应用
      aiAutoApplyDaily(result);
      var summary = result.summary || '已生成逐日计划';
      aiRenderChatMsg('assistant', '✅ ' + summary + '\n\n详细计划已显示在上方，如需调整直接在下方告诉我。');
      saveConvHistory();
      document.getElementById('aiStatus').textContent = '✅ 逐日计划已生成，见上方详细计划';
    } else if (result && result.feedback) {
      // 是验收反馈
      var reviewText = '✅ 验收反馈\n完成率：' + (result.completionRate || '未知') + '\n\n' + (result.feedback || '');
      if (result.suggestions && result.suggestions.length) {
        reviewText += '\n\n建议：\n' + result.suggestions.map(function(s, i) { return (i+1) + '. ' + s; }).join('\n');
      }
      aiRenderChatMsg('assistant', reviewText);
      saveConvHistory();
      document.getElementById('aiStatus').textContent = '✅ 验收完成，见下方对话';
    } else {
      // 普通文字回复
      aiRenderChatMsg('assistant', content);
      document.getElementById('aiStatus').textContent = '✅ AI 已回复，见下方对话';
      saveConvHistory();
    }
  });
}

function writeGoalToJSON(weekLabel, subject, chapter, done) {
  fetch(apiUrl('/api/update-plan'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ week: weekLabel, subject: subject, chapter: chapter, done: done })
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) console.warn('writeGoalToJSON:', d.error);
  }).catch(function(e) {
    console.warn('writeGoalToJSON failed:', e);
  });
}

function toggleGoal(wi, gi) {
  var data = loadWeekData();
  if (data[wi] && data[wi].goals[gi]) {
    var goal = data[wi].goals[gi];
    goal.done = !goal.done;
    saveWeekData(data);
    renderWeeks();
    writeGoalToJSON(data[wi].week, goal.subject || goal.tagText, goal.chapter || '', goal.done);
  }
}

function toggleTaskDone(dayIdx, taskIdx) {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('ai_daily_plan')); } catch(e) {}
  if (!saved || !saved.days || !saved.days[dayIdx] || !saved.days[dayIdx].tasks) return;
  var task = saved.days[dayIdx].tasks[taskIdx];
  if (!task) return;
  task.done = !task.done;
  try { saveAIPlan(saved); } catch(e) {}
  renderDailyExecPlan();
  checkLinkage(task.subject, task.chapter);
}

function checkLinkage(subject, chapter) {
  if (!subject || !chapter) return;
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('ai_daily_plan')); } catch(e) {}
  if (!saved || !saved.days) return;

  var allDone = true;
  var hasMatch = false;
  saved.days.forEach(function(day) {
    (day.tasks || []).forEach(function(t) {
      if (t.subject === subject && t.chapter === chapter) {
        hasMatch = true;
        if (!t.done) allDone = false;
      }
    });
  });
  if (!hasMatch) return;

  var data = loadWeekData();
  var changed = false;
  data.forEach(function(week) {
    week.goals.forEach(function(goal) {
      if ((goal.subject || goal.tagText) === subject && goal.chapter === chapter) {
        if (goal.done !== allDone) {
          goal.done = allDone;
          changed = true;
          writeGoalToJSON(week.week, subject, chapter, allDone);
        }
      }
    });
  });
  if (changed) {
    saveWeekData(data);
    renderWeeks();
  }
}

function editGoal(el, wi, gi) {
  el.contentEditable = 'true';
  el.focus();
}

function saveGoal(el, wi, gi) {
  el.contentEditable = 'false';
  var data = loadWeekData();
  if (data[wi] && data[wi].goals[gi]) {
    data[wi].goals[gi].topic = el.textContent.trim();
    saveWeekData(data);
  }
}

function deleteGoal(wi, gi) {
  var data = loadWeekData();
  if (data[wi] && data[wi].goals[gi]) {
    data[wi].goals.splice(gi, 1);
    saveWeekData(data);
    renderWeeks();
  }
}

function addGoal(wi) {
  var data = loadWeekData();
  if (data[wi]) {
    data[wi].goals.push({ tag: 'en', subject: '英语', chapter: '', topic: '新目标（双击编辑）', done: false });
    saveWeekData(data);
    renderWeeks();
  }
}

// 从API恢复AI计划和对话（localStorage为空时从文件加载）
function restoreFromAPI() {
  if (!localStorage.getItem('ai_daily_plan')) {
    fetch(apiUrl('/api/ai-plan'), { cache: 'no-cache' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.days) {
          try { localStorage.setItem('ai_daily_plan', JSON.stringify(d)); } catch(e) {}
          renderDailyExecPlan();
        }
      })
      .catch(function(e) {});
  }
  if (!localStorage.getItem('ai_conv_history')) {
    fetch(apiUrl('/api/ai-conv'), { cache: 'no-cache' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.length) {
          try { localStorage.setItem('ai_conv_history', JSON.stringify(d)); } catch(e) {}
          restoreConvHistory();
        }
      })
      .catch(function(e) {});
  }
}
loadSelfStudyData().then(function() {
  renderPlanning();
  renderWeeks();
  restoreConvHistory();
  renderDailyExecPlan();
  restoreFromAPI();
  // 异步从 JSON 文件加载最新计划数据，加载后重新渲染
  loadPlanFromJSON().then(function() {
    renderWeeks();
    renderPlanning();
    renderDailyExecPlan();
  });
}).catch(function(err) {
  console.error('初始化失败，使用降级渲染', err);
  renderPlanning();
  renderWeeks();
  renderDailyExecPlan();
  restoreFromAPI();
});

var COMP_SUBJECTS = [
  { code: '02324', name: '离散数学', icon: '🔢', totalChapters: 9 },
  { code: '13015', name: '计算机系统原理', icon: '💻', totalChapters: 6 },
  { code: '13003', name: '数据结构与算法', icon: '🌳', totalChapters: 8 },
  { code: '00023', name: '高等数学（工本）', icon: '📐', totalChapters: 6 },
  { code: '00015', name: '英语（二）', icon: '🔤', totalChapters: 0 }
];
var PY_TOTAL_POINTS = 29;

function levelCls(pct) {
  if (pct >= 60) return 'good';
  if (pct >= 1) return 'mid';
  return 'low';
}

function getSubjectComp(subj) {
  if (subj.totalChapters === 0) return { done: 0, total: 0, percent: 0, empty: true, detail: '暂无追踪数据' };
  var m = safeParse('ss_mastery_' + subj.code, { mastery: {} }).mastery || {};
  var mastered = 0, learning = 0, review = 0;
  for (var i = 1; i <= subj.totalChapters; i++) {
    var lv = m[i];
    if (lv === 2) mastered++;
    else if (lv === 1) learning++;
    else if (lv === 3) review++;
  }
  var done = mastered + review;
  return {
    done: done, total: subj.totalChapters,
    percent: Math.min(100, Math.round(done / subj.totalChapters * 100)),
    detail: '已掌握 ' + mastered + ' · 学习中 ' + learning + ' · 需复习 ' + review + ' · 共 ' + subj.totalChapters + ' 章'
  };
}

function getPyComp() {
  var st = safeParse('py_knowledge_tree_v1', {});
  var done = Object.keys(st).length;
  var branches = PY_BRANCHES.map(function(b) {
    var bd = Object.keys(st).filter(function(k) { return k.indexOf(b.prefix + '-') === 0; }).length;
    return { name: b.name, done: bd, total: b.total };
  });
  return { done: done, total: PY_TOTAL_POINTS, percent: Math.min(100, Math.round(done / PY_TOTAL_POINTS * 100)), branches: branches };
}

function renderCompletion() {
  // Subjects
  var sGrid = document.getElementById('compSubjectGrid');
  var sHtml = '';
  COMP_SUBJECTS.forEach(function(s) {
    var p = getSubjectComp(s);
    var cls = levelCls(p.percent);
    if (p.empty) {
      sHtml += '<div class="comp-card"><div class="comp-card-header"><span class="comp-card-icon">' + s.icon + '</span><span class="comp-card-name">' + s.name + '</span><span class="comp-card-percent low">—</span></div><div class="comp-card-bar"><div class="comp-card-fill low" style="width:0%"></div></div><div class="comp-card-detail"><span>' + p.detail + '</span></div></div>';
    } else {
      sHtml += '<div class="comp-card"><div class="comp-card-header"><span class="comp-card-icon">' + s.icon + '</span><span class="comp-card-name">' + s.name + '</span><span class="comp-card-percent ' + cls + '">' + p.percent + '%</span></div><div class="comp-card-bar"><div class="comp-card-fill ' + cls + '" style="width:' + p.percent + '%"></div></div><div class="comp-card-detail"><span>' + p.detail + '</span></div></div>';
    }
  });
  sGrid.innerHTML = sHtml;

  // Python
  var py = getPyComp();
  var pyCls = levelCls(py.percent);
  var pyDetail = py.done === 0
    ? '<div style="text-align:center;color:var(--muted);font-size:0.82rem;padding:0.5rem;">🌱 尚未开始勾选知识点</div>'
    : py.branches.map(function(b) { return '<span>' + b.name + ' ' + b.done + '/' + b.total + '</span>'; }).join('');
  document.getElementById('compPythonGrid').innerHTML =
    '<div class="comp-card"><div class="comp-card-header"><span class="comp-card-icon">🐍</span><span class="comp-card-name">Python 知识树</span><span class="comp-card-percent ' + pyCls + '">' + py.percent + '%</span></div><div class="comp-card-bar"><div class="comp-card-fill ' + pyCls + '" style="width:' + py.percent + '%"></div></div><div class="comp-card-detail">' + pyDetail + '</div></div>';

  // AI
  document.getElementById('compAIGrid').innerHTML =
    '<div class="comp-card"><div class="comp-card-header"><span class="comp-card-icon">🤖</span><span class="comp-card-name">AI 学习</span><span class="comp-card-percent low">0%</span></div><div class="comp-card-bar"><div class="comp-card-fill low" style="width:0%"></div></div><div class="comp-card-detail"><span>追踪机制待建立</span></div></div>';

  // Total
  var allDone = 0, allTotal = 0;
  COMP_SUBJECTS.forEach(function(s) {
    var p = getSubjectComp(s);
    if (!p.empty) { allDone += p.done; allTotal += p.total; }
  });
  allDone += py.done; allTotal += py.total;
  allTotal += 1; // AI placeholder weight
  var pct = allTotal ? Math.min(100, Math.round(allDone / allTotal * 100)) : 0;
  document.getElementById('compTotalPercent').textContent = pct + '%';
  document.getElementById('compTotalFill').style.width = pct + '%';
  document.getElementById('compTotalStats').innerHTML =
    '<span>📚 各科目 ' + allDone + '/' + allTotal + '</span><span>🐍 Python ' + py.done + '/' + py.total + '</span><span>🤖 AI 学习 0%</span>';
}
