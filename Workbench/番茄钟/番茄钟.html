<body>
<article class="pomo-page">

  <!-- Top Bar -->
  <div class="pomo-topbar">
    <div class="pomo-topbar-left">
      <h1>🍅 番茄任务闹钟</h1>
    </div>
    <div class="pomo-topbar-right">
      <span class="pomo-clock" id="pomoClock">--:--</span>
      <button class="pomo-notify-btn" id="notifyBtn" onclick="requestNotify()">开启通知</button>
    </div>
  </div>

  <!-- Timer Section -->
  <div class="pomo-timer-section" id="timerSection">
    <span class="pomo-phase-tag idle" id="phaseTag">待开始</span>
    <div class="pomo-countdown idle" id="countdown">--:--</div>
    <div class="pomo-task-info" id="taskInfo">加载今日计划中...</div>
    <div class="pomo-time-range" id="timeRange">&nbsp;</div>
    <div class="pomo-controls" id="controls">
      <button class="pomo-btn pomo-btn-primary" id="startBtn" onclick="startTimer()">▶ 开始</button>
      <button class="pomo-btn pomo-btn-secondary" id="pauseBtn" onclick="pauseTimer()" style="display:none;">⏸ 暂停</button>
      <button class="pomo-btn pomo-btn-ghost" id="skipBtn" onclick="skipSlot()" style="display:none;">⏭ 跳过</button>
    </div>
    <div class="pomo-dots" id="pomoDots" style="display:none;"></div>
    <div class="pomo-next-hint" id="nextHint">&nbsp;</div>
    <div class="pomo-settings" id="pomoSettings">
      <div class="pomo-setting-item">
        <label>番茄模式</label>
        <select id="pomoMode" onchange="onPomoModeChange()">
          <option value="off">关闭</option>
          <option value="25">标准 25/5</option>
          <option value="50">长番茄 50/5</option>
        </select>
      </div>
      <div class="pomo-setting-item" id="customSettings" style="display:none;">
        <label>工作</label>
        <input type="number" id="workMin" value="25" min="5" max="120">min
        <label>休息</label>
        <input type="number" id="breakMin" value="5" min="1" max="30">min
      </div>
    </div>
  </div>

  <!-- All Slots -->
  <div class="pomo-slots-header">
    <h2>今日全部时段</h2>
    <span class="pomo-progress-text" id="progressText">0/7</span>
  </div>
  <div class="pomo-slots" id="slotsContainer"></div>

</article>

<script>
// ============================================================
// 番茄任务闹钟 - 读取 study-plan.json 当日计划，按时段倒计时+通知提醒
// ============================================================

// 时段定义（与学习驾驶舱 DP_EXEC_SLOTS 一致）
var TIME_SLOTS = [
  { time: '08:00-10:50', startH: 8,  startM: 0,  endH: 10, endM: 50, tags: ['core','core2','key'], label: '上午主科（番茄法）' },
  { time: '14:00-15:30', startH: 14, startM: 0,  endH: 15, endM: 30, tags: ['core','core2','key'], label: '下午练习/真题' },
  { time: '15:30-16:00', startH: 15, startM: 30, endH: 16, endM: 0,  tags: ['review'], label: '间隔复习' },
  { time: '16:00-17:00', startH: 16, startM: 0,  endH: 17, endM: 0,  tags: ['py'], label: 'AI工程' },
  { time: '19:30-20:30', startH: 19, startM: 30, endH: 20, endM: 30, tags: ['ai'], label: 'AI学习' },
  { time: '20:30-21:00', startH: 20, startM: 30, endH: 21, endM: 0,  tags: ['en'], label: '英语' },
  { time: '21:00-21:30', startH: 21, startM: 0,  endH: 21, endM: 30, tags: ['review'], label: '当日复盘' }
];

var TAG_META = {
  core:    { text: '系统原理', cls: 'pomo-tag-core' },
  core2:   { text: '离散数学', cls: 'pomo-tag-core2' },
  key:     { text: '数据结构', cls: 'pomo-tag-key' },
  py:      { text: 'AI工程',   cls: 'pomo-tag-py' },
  ai:      { text: 'AI学习',   cls: 'pomo-tag-ai' },
  en:      { text: '英语',     cls: 'pomo-tag-en' },
  review:  { text: '复盘',     cls: 'pomo-tag-review' }
};

var STORAGE_KEY = 'pomo_completion';
var SETTINGS_KEY = 'pomo_settings';
var TIMER_STATE_KEY = 'pomo_timer_state';

var todayPlan = null;
var todayTasks = [];
var currentSlotIdx = -1;
var timerInterval = null;
var remainingSec = 0;
var isRunning = false;
var isPaused = false;
var pomoPhase = 'idle';
var pomoWorkCycle = 0;
var pomoTotalCycles = 0;
var completedSlots = {};

// ---------- 计时器状态持久化（基于时间戳，支持跨页面恢复） ----------
function saveTimerState() {
  if (!isRunning && !isPaused) {
    clearTimerState();
    return;
  }
  var state = {
    slotIdx: currentSlotIdx,
    pomoPhase: pomoPhase,
    pomoWorkCycle: pomoWorkCycle,
    pomoTotalCycles: pomoTotalCycles,
    targetEndTime: Date.now() + remainingSec * 1000,
    isRunning: isRunning,
    isPaused: isPaused,
    mode: document.getElementById('pomoMode').value
  };
  try { localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(state)); } catch(e) {}
}

function clearTimerState() {
  try { localStorage.removeItem(TIMER_STATE_KEY); } catch(e) {}
}

function loadTimerState() {
  try {
    var raw = localStorage.getItem(TIMER_STATE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function recoverTimer() {
  var state = loadTimerState();
  if (!state || !state.isRunning || state.isPaused) return false;
  if (state.slotIdx === undefined || state.slotIdx < 0 || state.slotIdx >= TIME_SLOTS.length) return false;

  var now = Date.now();
  var targetEnd = state.targetEndTime || 0;
  var diffSec = Math.floor((targetEnd - now) / 1000);

  currentSlotIdx = state.slotIdx;

  // 设置番茄模式
  var modeSelect = document.getElementById('pomoMode');
  if (state.mode) modeSelect.value = state.mode;
  onPomoModeChange();

  if (diffSec > 0) {
    // 计时器仍在进行中，恢复剩余时间
    remainingSec = diffSec;
    pomoPhase = state.pomoPhase || 'work';
    pomoWorkCycle = state.pomoWorkCycle || 0;
    pomoTotalCycles = state.pomoTotalCycles || 0;
    isRunning = true;
    isPaused = false;

    var phaseTag = document.getElementById('phaseTag');
    var countdown = document.getElementById('countdown');
    if (pomoPhase === 'work') {
      phaseTag.className = 'pomo-phase-tag work';
      phaseTag.textContent = '学习中';
      countdown.className = 'pomo-countdown work';
    } else if (pomoPhase === 'break') {
      phaseTag.className = 'pomo-phase-tag break';
      phaseTag.textContent = '休息中';
      countdown.className = 'pomo-countdown break';
    }

    if (modeSelect.value !== 'off') {
      document.getElementById('pomoDots').style.display = 'flex';
      renderPomoDots();
    }

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = '';
    document.getElementById('skipBtn').style.display = '';

    timerInterval = setInterval(tick, 1000);

    // 更新任务信息
    var slot = TIME_SLOTS[currentSlotIdx];
    var task = todayTasks[currentSlotIdx];
    var tagMeta = TAG_META[task ? task.tag : 'review'] || { text: '', cls: 'pomo-tag-review' };
    var taskInfoHtml = '';
    if (task) {
      taskInfoHtml = '<span class="pomo-subject ' + tagMeta.cls + '" style="font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:6px;">' + escapeHtml(tagMeta.text) + '</span>' + escapeHtml(task.text || '');
    } else {
      taskInfoHtml = slot.label;
    }
    document.getElementById('taskInfo').innerHTML = taskInfoHtml;
    document.getElementById('timeRange').textContent = slot.time + ' · ' + slot.label;

    return true;
  } else {
    // 计时器在页面关闭期间已到期
    clearTimerState();

    // 检查当前时段是否已过
    var slotInfo = TIME_SLOTS[currentSlotIdx];
    var curMin = new Date().getHours() * 60 + new Date().getMinutes();
    var eMin = slotInfo.endH * 60 + slotInfo.endM;
    if (curMin >= eMin) {
      // 时段已过，标记完成
      completedSlots[currentSlotIdx] = true;
      saveCompletion();
      currentSlotIdx = -1;
    }

    notify('计时器已恢复', '之前的计时在你离开期间已结束，请查看当前时段');
    return false;
  }
}

// ---------- 初始化 ----------
function init() {
  loadSettings();
  loadCompletion();
  updateClock();
  setInterval(updateClock, 1000);

  fetch('../../data/study-plan.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      todayPlan = findTodayPlan(data);
      if (todayPlan) {
        todayTasks = todayPlan.tasks || [];
        renderSlots();
        detectCurrentSlot();
        renderTimer();
        updateNextHint();

        // 尝试恢复计时器状态
        if (!recoverTimer()) {
          // 没有可恢复的计时器，正常显示
        } else {
          renderSlots(); // 恢复后重新渲染卡片状态
        }
      } else {
        document.getElementById('taskInfo').textContent = '今日无计划数据，请先在学习驾驶舱生成每日计划';
      }
    })
    .catch(function(e) {
      document.getElementById('taskInfo').textContent = '加载计划失败，请确保 dev_server 已启动';
    });

  if ('Notification' in window) {
    if (Notification.permission === 'granted') {
      var btn = document.getElementById('notifyBtn');
      btn.textContent = '通知已开启';
      btn.classList.add('granted');
    }
  }

  // 页面关闭/隐藏时保存状态
  window.addEventListener('beforeunload', saveTimerState);
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) saveTimerState();
  });
}

function findTodayPlan(data) {
  if (!data || !data.dailyPlans) return null;
  var today = new Date();
  var todayStr = (today.getMonth() + 1) + '/' + today.getDate();
  for (var i = 0; i < data.dailyPlans.length; i++) {
    var dp = data.dailyPlans[i];
    if (dp.days) {
      for (var j = 0; j < dp.days.length; j++) {
        if (dp.days[j].date === todayStr) {
          return dp.days[j];
        }
      }
    }
  }
  // 回退到第一个 dailyPlan 的第一天
  if (data.dailyPlans[0] && data.dailyPlans[0].days && data.dailyPlans[0].days[0]) {
    return data.dailyPlans[0].days[0];
  }
  return null;
}

// ---------- 时钟 ----------
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  var s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('pomoClock').textContent = h + ':' + m + ':' + s;

  if (!isRunning && !isPaused) {
    detectCurrentSlot();
    renderTimer();
  }
}

// ---------- 当前时段检测 ----------
function detectCurrentSlot() {
  var now = new Date();
  var curMin = now.getHours() * 60 + now.getMinutes();
  currentSlotIdx = -1;

  for (var i = 0; i < TIME_SLOTS.length; i++) {
    var s = TIME_SLOTS[i];
    var sMin = s.startH * 60 + s.startM;
    var eMin = s.endH * 60 + s.endM;
    if (curMin >= sMin && curMin < eMin) {
      currentSlotIdx = i;
      break;
    }
  }
}

// ---------- 渲染时段卡片 ----------
function renderSlots() {
  var container = document.getElementById('slotsContainer');
  var html = '';
  var doneCount = 0;

  for (var i = 0; i < TIME_SLOTS.length; i++) {
    var slot = TIME_SLOTS[i];
    var task = todayTasks[i] || null;
    var isDone = completedSlots[i];
    var isCurrent = (i === currentSlotIdx && !isDone);

    if (isDone) doneCount++;

    var cls = 'pomo-slot-card';
    if (isDone) cls += ' done';
    if (isCurrent) cls += ' current';

    var statusIcon = '';
    if (isDone) statusIcon = '✓';
    else if (isCurrent) statusIcon = '';

    var tagHtml = '';
    var textHtml = '—';
    if (task) {
      var tagMeta = TAG_META[task.tag] || { text: task.tagText || task.tag, cls: 'pomo-tag-review' };
      tagHtml = '<span class="pomo-slot-tag ' + tagMeta.cls + '">' + escapeHtml(tagMeta.text) + '</span>';
      textHtml = escapeHtml(task.text || '');
    }

    html += '<div class="' + cls + '" onclick="selectSlot(' + i + ')">';
    html += '<div class="pomo-slot-status">' + statusIcon + '</div>';
    html += '<span class="pomo-slot-time">' + slot.time + '</span>';
    html += tagHtml;
    html += '<span class="pomo-slot-text">' + textHtml + '</span>';
    html += '</div>';
  }

  container.innerHTML = html;
  document.getElementById('progressText').textContent = doneCount + '/' + TIME_SLOTS.length;
}

// ---------- 渲染计时器 ----------
function renderTimer() {
  var phaseTag = document.getElementById('phaseTag');
  var countdown = document.getElementById('countdown');
  var taskInfo = document.getElementById('taskInfo');
  var timeRange = document.getElementById('timeRange');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var skipBtn = document.getElementById('skipBtn');
  var dots = document.getElementById('pomoDots');
  var settings = document.getElementById('pomoSettings');

  if (currentSlotIdx === -1) {
    // 不在任何时段
    phaseTag.className = 'pomo-phase-tag idle';
    phaseTag.textContent = '非学习时段';
    countdown.className = 'pomo-countdown idle';
    countdown.textContent = '--:--';
    taskInfo.innerHTML = '<span style="color:var(--muted)">当前不在学习时段</span>';

    // 找下一个时段
    var nextIdx = findNextSlot();
    if (nextIdx !== -1) {
      var ns = TIME_SLOTS[nextIdx];
      timeRange.textContent = '下一项：' + ns.time + ' ' + ns.label;
    } else {
      timeRange.textContent = '今日时段已全部结束';
    }

    startBtn.style.display = 'none';
    pauseBtn.style.display = 'none';
    skipBtn.style.display = 'none';
    dots.style.display = 'none';
    settings.style.display = 'none';
    return;
  }

  var slot = TIME_SLOTS[currentSlotIdx];
  var task = todayTasks[currentSlotIdx];

  settings.style.display = 'flex';
  startBtn.style.display = '';
  skipBtn.style.display = '';

  if (!isRunning && !isPaused) {
    // 初始状态
    phaseTag.className = 'pomo-phase-tag work';
    phaseTag.textContent = '待开始';

    var now = new Date();
    var curMin = now.getHours() * 60 + now.getMinutes();
    var sMin = slot.startH * 60 + slot.startM;
    var eMin = slot.endH * 60 + slot.endM;
    var remainMin = eMin - curMin;
    remainingSec = remainMin * 60;

    countdown.className = 'pomo-countdown work';
    countdown.textContent = formatTime(remainingSec);

    var tagMeta = TAG_META[task ? task.tag : 'review'] || { text: '', cls: 'pomo-tag-review' };
    taskInfo.innerHTML = '';
    if (task) {
      taskInfo.innerHTML = '<span class="pomo-subject ' + tagMeta.cls + '" style="font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:6px;">' + escapeHtml(tagMeta.text) + '</span>' + escapeHtml(task.text || '');
    } else {
      taskInfo.textContent = slot.label;
    }
    timeRange.textContent = slot.time + ' · ' + slot.label;

    startBtn.textContent = '▶ 开始计时';
    startBtn.onclick = startTimer;
    pauseBtn.style.display = 'none';
  }
}

// ---------- 计时器控制 ----------
function startTimer() {
  if (currentSlotIdx === -1) return;

  if (isPaused) {
    isPaused = false;
    isRunning = true;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = '';
    timerInterval = setInterval(tick, 1000);
    saveTimerState();
    return;
  }

  isRunning = true;
  isPaused = false;

  var mode = document.getElementById('pomoMode').value;
  if (mode !== 'off') {
    startPomodoro();
  } else {
    pomoPhase = 'work';
    document.getElementById('phaseTag').className = 'pomo-phase-tag work';
    document.getElementById('phaseTag').textContent = '学习中';
    document.getElementById('countdown').className = 'pomo-countdown work';
  }

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = '';
  document.getElementById('skipBtn').style.display = '';

  timerInterval = setInterval(tick, 1000);
  saveTimerState();
}

function pauseTimer() {
  isPaused = true;
  isRunning = false;
  clearInterval(timerInterval);
  document.getElementById('startBtn').style.display = '';
  document.getElementById('startBtn').textContent = '▶ 继续';
  document.getElementById('pauseBtn').style.display = 'none';
  saveTimerState();
}

function skipSlot() {
  if (currentSlotIdx === -1) return;
  clearInterval(timerInterval);
  isRunning = false;
  isPaused = false;
  pomoPhase = 'idle';
  clearTimerState();

  // 标记完成
  completedSlots[currentSlotIdx] = true;
  saveCompletion();
  renderSlots();

  // 找下一个
  var nextIdx = findNextSlot();
  if (nextIdx !== -1) {
    currentSlotIdx = nextIdx;
  } else {
    currentSlotIdx = -1;
    notify('今日时段已全部结束', '学习辛苦了，好好休息！');
  }

  renderTimer();
  updateNextHint();
}

function tick() {
  remainingSec--;

  // 每5秒保存一次状态，支持悬浮按钮和跨页面恢复
  if (remainingSec % 5 === 0) saveTimerState();

  if (remainingSec <= 0) {
    // 时间到
    var mode = document.getElementById('pomoMode').value;
    if (mode !== 'off' && pomoPhase === 'work') {
      // 番茄模式：工作结束，进入休息
      pomoWorkCycle++;
      pomoPhase = 'break';
      var breakMin = getPomoBreakMin();
      remainingSec = breakMin * 60;

      document.getElementById('phaseTag').className = 'pomo-phase-tag break';
      document.getElementById('phaseTag').textContent = '休息中';
      document.getElementById('countdown').className = 'pomo-countdown break';

      renderPomoDots();
      playSound();
      var task = todayTasks[currentSlotIdx];
      var taskText = task ? task.text : '';
      notify('番茄完成！休息 ' + breakMin + ' 分钟', '刚才在学习：' + taskText);

      saveTimerState();
      checkSlotOverflow();
    } else if (mode !== 'off' && pomoPhase === 'break') {
      // 休息结束，进入工作
      pomoPhase = 'work';
      var workMin = getPomoWorkMin();
      remainingSec = workMin * 60;

      document.getElementById('phaseTag').className = 'pomo-phase-tag work';
      document.getElementById('phaseTag').textContent = '学习中';
      document.getElementById('countdown').className = 'pomo-countdown work';

      renderPomoDots();
      playSound();
      notify('休息结束，继续学习！', '下一个番茄开始，保持专注');

      saveTimerState();
      checkSlotOverflow();
    } else {
      // 非番茄模式：时段结束
      finishCurrentSlot();
    }
    return;
  }

  document.getElementById('countdown').textContent = formatTime(remainingSec);
}

function finishCurrentSlot() {
  clearInterval(timerInterval);
  isRunning = false;
  isPaused = false;
  pomoPhase = 'idle';
  clearTimerState();

  completedSlots[currentSlotIdx] = true;
  saveCompletion();

  var task = todayTasks[currentSlotIdx];
  var taskText = task ? task.text : '';
  playSound();
  notify('时段结束！', (task ? task.tagText : '') + ' ' + taskText);

  renderSlots();

  var nextIdx = findNextSlot();
  if (nextIdx !== -1) {
    currentSlotIdx = nextIdx;
  } else {
    currentSlotIdx = -1;
    notify('今日时段已全部结束', '学习辛苦了，好好休息！');
  }

  renderTimer();
  updateNextHint();
}

function checkSlotOverflow() {
  // 检查是否超出当前时段
  var slot = TIME_SLOTS[currentSlotIdx];
  var now = new Date();
  var curMin = now.getHours() * 60 + now.getMinutes();
  var eMin = slot.endH * 60 + slot.endM;
  if (curMin >= eMin) {
    finishCurrentSlot();
  }
}

// ---------- 番茄模式 ----------
function startPomodoro() {
  var workMin = getPomoWorkMin();
  pomoPhase = 'work';
  pomoWorkCycle = 0;

  var slot = TIME_SLOTS[currentSlotIdx];
  var slotMin = (slot.endH * 60 + slot.endM) - (slot.startH * 60 + slot.startM);
  pomoTotalCycles = Math.ceil(slotMin / (workMin + getPomoBreakMin()));

  remainingSec = workMin * 60;

  document.getElementById('phaseTag').className = 'pomo-phase-tag work';
  document.getElementById('phaseTag').textContent = '学习中';
  document.getElementById('countdown').className = 'pomo-countdown work';

  document.getElementById('pomoDots').style.display = 'flex';
  renderPomoDots();
}

function renderPomoDots() {
  var container = document.getElementById('pomoDots');
  var html = '';
  for (var i = 0; i < pomoTotalCycles; i++) {
    var cls = 'pomo-dot';
    if (i < pomoWorkCycle) cls += ' done';
    else if (i === pomoWorkCycle && pomoPhase === 'work') cls += ' active';
    html += '<div class="' + cls + '"></div>';
  }
  container.innerHTML = html;
}

function getPomoWorkMin() {
  var mode = document.getElementById('pomoMode').value;
  if (mode === '25') return 25;
  if (mode === '50') return 50;
  return parseInt(document.getElementById('workMin').value) || 25;
}

function getPomoBreakMin() {
  var mode = document.getElementById('pomoMode').value;
  if (mode === '25') return 5;
  if (mode === '50') return 5;
  return parseInt(document.getElementById('breakMin').value) || 5;
}

function onPomoModeChange() {
  var mode = document.getElementById('pomoMode').value;
  document.getElementById('customSettings').style.display = (mode === 'custom') ? 'flex' : 'none';
  if (!isRunning && !isPaused) {
    renderTimer();
  }
  saveSettings();
}

// ---------- 选择时段 ----------
function selectSlot(idx) {
  if (isRunning) {
    if (!confirm('正在计时中，切换时段会停止当前计时，确定吗？')) return;
    clearInterval(timerInterval);
    isRunning = false;
    isPaused = false;
    pomoPhase = 'idle';
  }
  currentSlotIdx = idx;
  isPaused = false;
  remainingSec = 0;
  clearTimerState();
  renderTimer();
  updateNextHint();
  renderSlots();
}

function findNextSlot() {
  for (var i = 0; i < TIME_SLOTS.length; i++) {
    if (!completedSlots[i] && i !== currentSlotIdx) {
      // 找下一个未完成且时间在当前之后的
      var slot = TIME_SLOTS[i];
      var now = new Date();
      var curMin = now.getHours() * 60 + now.getMinutes();
      var sMin = slot.startH * 60 + slot.startM;
      if (sMin >= curMin || i > currentSlotIdx) {
        return i;
      }
    }
  }
  // 找第一个未完成的
  for (var j = 0; j < TIME_SLOTS.length; j++) {
    if (!completedSlots[j]) return j;
  }
  return -1;
}

function updateNextHint() {
  var hint = document.getElementById('nextHint');
  var nextIdx = findNextSlot();
  if (nextIdx !== -1 && nextIdx !== currentSlotIdx) {
    var ns = TIME_SLOTS[nextIdx];
    var task = todayTasks[nextIdx];
    var taskText = task ? ' · ' + task.text : '';
    hint.textContent = '⏭ 下一项：' + ns.time + ' ' + ns.label + taskText;
  } else if (nextIdx === -1) {
    hint.textContent = '今日时段已全部完成 🎉';
  } else {
    hint.textContent = '';
  }
}

// ---------- 通知 ----------
function requestNotify() {
  if (!('Notification' in window)) {
    alert('您的浏览器不支持通知功能');
    return;
  }
  Notification.requestPermission().then(function(permission) {
    if (permission === 'granted') {
      var btn = document.getElementById('notifyBtn');
      btn.textContent = '通知已开启';
      btn.classList.add('granted');
      notify('通知已开启', '番茄任务闹钟将在时段开始/结束时提醒你');
    } else {
      alert('通知权限被拒绝，请在浏览器设置中手动开启');
    }
  });
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      var n = new Notification('🍅 ' + title, {
        body: body,
        icon: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><text x="32" y="48" font-size="48" text-anchor="middle">🍅</text></svg>'),
        tag: 'pomo-timer'
      });
      setTimeout(function() { n.close(); }, 10000);
    } catch(e) {}
  }
}

// ---------- 声音 ----------
function playSound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var playBeep = function(freq, duration, delay) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + duration);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration);
    };
    // 三声 beep
    playBeep(880, 0.15, 0);
    playBeep(880, 0.15, 0.25);
    playBeep(1100, 0.3, 0.5);
  } catch(e) {}
}

// ---------- 持久化 ----------
function loadCompletion() {
  try {
    var today = new Date();
    var key = STORAGE_KEY + '_' + (today.getMonth() + 1) + '_' + today.getDate();
    var saved = JSON.parse(localStorage.getItem(key));
    if (saved && typeof saved === 'object') {
      completedSlots = saved;
    }
  } catch(e) {
    completedSlots = {};
  }
}

function saveCompletion() {
  try {
    var today = new Date();
    var key = STORAGE_KEY + '_' + (today.getMonth() + 1) + '_' + today.getDate();
    localStorage.setItem(key, JSON.stringify(completedSlots));
  } catch(e) {}
}

function loadSettings() {
  try {
    var saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (saved) {
      if (saved.mode) document.getElementById('pomoMode').value = saved.mode;
      if (saved.workMin) document.getElementById('workMin').value = saved.workMin;
      if (saved.breakMin) document.getElementById('breakMin').value = saved.breakMin;
      onPomoModeChange();
    }
  } catch(e) {}
}

function saveSettings() {
  try {
    var settings = {
      mode: document.getElementById('pomoMode').value,
      workMin: document.getElementById('workMin').value,
      breakMin: document.getElementById('breakMin').value
    };
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch(e) {}
}

// ---------- 工具 ----------
function formatTime(sec) {
  if (sec < 0) sec = 0;
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ---------- 启动 ----------
init();
</script>
