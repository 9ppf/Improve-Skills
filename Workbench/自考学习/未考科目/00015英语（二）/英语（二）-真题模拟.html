<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语（二）· 真题模拟</title>
<style>
:root{--bg:#f8fafc;--bg2:rgba(255,255,255,0.72);--ink:#1e293b;--muted:#64748b;--rule:#e2e8f0;--accent:#2563eb;--accent2:#8b5cf6;--font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.75;padding:1.5rem 1rem}
article.page{max-width:820px;margin:0 auto}

.exam-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-bottom:1.5rem}
.exam-card{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:1.25rem;cursor:pointer;transition:all 0.2s;position:relative}
.exam-card:hover{box-shadow:0 6px 20px rgba(37,99,235,0.10);border-color:var(--accent)}
.exam-card .ec-year{font-size:1.15rem;font-weight:700;color:var(--accent)}
.exam-card .ec-info{font-size:0.85rem;color:var(--muted);margin-top:0.3rem}
.exam-card .ec-score{display:inline-block;padding:0.2rem 0.6rem;border-radius:6px;font-size:0.8rem;font-weight:600;margin-top:0.5rem}
.ec-score-done{background:#ecfdf5;color:var(--green)}
.ec-score-pending{background:#fffbeb;color:var(--amber)}

.exam-detail{display:none}
.exam-back{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;background:#eff6ff;border:none;border-radius:8px;color:var(--accent);font-size:0.88rem;font-weight:600;cursor:pointer;margin-bottom:1rem}
.exam-back:hover{background:#dbeafe}

.exam-section{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.exam-section h3{font-size:1.05rem;font-weight:700;margin-bottom:0.75rem;padding-left:0.6rem;border-left:3px solid var(--accent);color:var(--accent)}
.exam-passage{font-size:0.9rem;line-height:1.85;color:var(--ink);margin-bottom:1rem;padding:1rem;background:#f8fafc;border-radius:8px;border-left:3px solid var(--accent2)}

.exam-q{margin-bottom:1rem}
.exam-q .eq-text{font-size:0.92rem;font-weight:500;margin-bottom:0.4rem}
.exam-q .eq-text .eq-num{color:var(--accent);font-weight:700;margin-right:0.3rem}
.eq-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.5rem}
.eq-opt{padding:0.45rem 0.8rem;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:0.88rem;transition:all 0.2s}
.eq-opt:hover{border-color:var(--accent);background:#eff6ff}
.eq-opt.selected{border-color:var(--accent);background:#eff6ff}
.eq-opt.correct{border-color:var(--green);background:#ecfdf5;color:var(--green)}
.eq-opt.wrong{border-color:var(--red);background:#fef2f2;color:var(--red)}

.exam-actions{display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.exam-btn{padding:0.6rem 1.5rem;border:none;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-submit{background:var(--accent);color:#fff}
.btn-submit:hover{background:#1d4ed8}
.btn-reset{background:#f1f5f9;color:var(--muted)}
.btn-reset:hover{background:#e2e8f0}

.exam-result{display:none;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:1.5rem;text-align:center;margin-bottom:1.5rem}
.result-score{font-size:2rem;font-weight:700;color:var(--accent)}
.result-label{font-size:0.9rem;color:var(--muted);margin-top:0.25rem}
.result-breakdown{margin-top:1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:0.75rem}
.result-item{background:#f8fafc;border-radius:8px;padding:0.5rem;font-size:0.82rem}
.result-item .ri-label{color:var(--muted)}
.result-item .ri-score{font-weight:700;color:var(--accent)}

.exam-timer{position:fixed;top:1rem;right:1rem;background:var(--accent);color:#fff;padding:0.5rem 1rem;border-radius:10px;font-size:0.9rem;font-weight:600;z-index:100;box-shadow:0 4px 12px rgba(37,99,235,0.3);display:none}
.exam-timer.show{display:block}

.empty-state{text-align:center;padding:2rem;color:var(--muted)}
.empty-state .es-icon{font-size:2rem;margin-bottom:0.5rem}

@media(max-width:640px){
  .exam-list{grid-template-columns:1fr}
  .eq-opts{grid-template-columns:1fr}
  .result-breakdown{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<article class="page">

  <div class="exam-timer" id="examTimer">⏱ 150:00</div>

  <div id="examListView">
    <div class="exam-list" id="examList"></div>
    <div class="empty-state" id="examEmpty">
      <div class="es-icon">📝</div>
      <div>更多真题整理中，敬请期待</div>
      <div style="font-size:0.85rem;margin-top:0.5rem">建议从备考指南中的题型专项开始练习</div>
    </div>
  </div>

  <div class="exam-detail" id="examDetailView">
    <button class="exam-back" onclick="backToList()">← 返回真题列表</button>
    <div id="examContent"></div>
  </div>

</article>
<script>
(function(){
  var SCORES_KEY='en_exam_scores';
  var scores={};
  try{scores=JSON.parse(localStorage.getItem(SCORES_KEY)||'{}')}catch(e){scores={}}

  var EXAMS=[
    {
      id:'202310',
      year:'2023年10月',
      info:'阅读判断+阅读选择+概括补全+填句补文+填词补文+完形补文+短文写作',
      sections:[
        {
          title:'第一题 阅读判断（10分）',
          passage:'The concept of lifelong learning has gained increasing attention in recent years. In the past, people believed that education ended after formal schooling. Today, however, the rapid pace of technological change means that skills can quickly become outdated. Lifelong learning helps individuals adapt to these changes and remain competitive in the job market.\n\nMoreover, learning new skills has been shown to improve brain health. Studies indicate that adults who engage in continuous learning have better memory and cognitive function. Learning a new language or playing a musical instrument can be particularly beneficial.',
          questions:[
            {q:'People used to believe that education continued throughout life.',opts:['True','False','Not Given'],answer:1},
            {q:'Technological changes can make skills outdated quickly.',opts:['True','False','Not Given'],answer:0},
            {q:'Lifelong learning helps people stay competitive in the job market.',opts:['True','False','Not Given'],answer:0},
            {q:'Learning a new language has no effect on brain health.',opts:['True','False','Not Given'],answer:1},
            {q:'Playing a musical instrument is mentioned as a beneficial activity.',opts:['True','False','Not Given'],answer:0}
          ]
        },
        {
          title:'第五题 填词补文（15分）',
          passage:'Word bank: A. efficient  B. require  C. method  D. traditional  E. communication  F. available  G. solution  H. create  I. personal  J. approach  K. increase  L. reduce\n\nEmail has become the primary ___1___ of business communication. It is more ___2___ than phone calls because it allows people to respond at their convenience. However, email also has disadvantages: it can ___3___ misunderstandings because tone is hard to convey in writing.',
          questions:[
            {q:'空格1',opts:['A','B','C'],answer:2},
            {q:'空格2',opts:['A','B','C'],answer:0},
            {q:'空格3',opts:['K','H','L'],answer:1}
          ]
        },
        {
          title:'第七题 短文写作（30分）',
          passage:'题目：Some people think that online learning is more effective than traditional classroom learning. Do you agree or disagree? Write an essay of about 150 words stating your opinion and giving reasons.',
          questions:[
            {q:'请在纸上完成作文，写完后对照评分标准自评。',opts:['自我评分：优秀(25-30分)','自我评分：良好(18-24分)','自我评分：及格(12-17分)','自我评分：需改进(12分以下)'],answer:-1}
          ]
        }
      ]
    },
    {
      id:'202304',
      year:'2023年4月',
      info:'完整真题（待录入）',
      sections:[],
      pending:true
    },
    {
      id:'202210',
      year:'2022年10月',
      info:'完整真题（待录入）',
      sections:[],
      pending:true
    }
  ];

  function renderExamList(){
    var html='';
    var available=0;
    EXAMS.forEach(function(ex){
      if(ex.pending)return;
      available++;
      var sc=scores[ex.id];
      var scoreHtml=sc?'<span class="ec-score ec-score-done">得分：'+sc.total+'</span>':'<span class="ec-score ec-score-pending">未练习</span>';
      html+='<div class="exam-card" onclick="openExam(\''+ex.id+'\')">';
      html+='<div class="ec-year">'+ex.year+'</div>';
      html+='<div class="ec-info">'+ex.info+'</div>';
      html+=scoreHtml;
      html+='</div>';
    });
    document.getElementById('examList').innerHTML=html;
    document.getElementById('examEmpty').style.display=available===0?'block':'none';
  }

  var currentExam=null;
  var userAnswers={};
  var timerInterval=null;

  window.openExam=function(id){
    currentExam=EXAMS.find(function(e){return e.id===id});
    if(!currentExam||currentExam.pending)return;
    userAnswers={};
    var html='';
    currentExam.sections.forEach(function(sec,si){
      html+='<div class="exam-section"><h3>'+sec.title+'</h3>';
      if(sec.passage){
        var passageHtml=sec.passage.replace(/\n/g,'<br><br>');
        html+='<div class="exam-passage">'+passageHtml+'</div>';
      }
      sec.questions.forEach(function(q,qi){
        var qid='s'+si+'q'+qi;
        html+='<div class="exam-q"><div class="eq-text"><span class="eq-num">'+(qi+1)+'.</span>'+q.q+'</div>';
        html+='<div class="eq-opts">';
        q.opts.forEach(function(opt,oi){
          html+='<div class="eq-opt" onclick="selectAns(\''+qid+'\','+oi+','+si+','+qi+')" id="opt_'+qid+'_'+oi+'">'+String.fromCharCode(65+oi)+'. '+opt+'</div>';
        });
        html+='</div></div>';
      });
      html+='</div>';
    });

    html+='<div class="exam-result" id="examResult">';
    html+='<div class="result-score" id="resultScore">--</div>';
    html+='<div class="result-label">总分</div>';
    html+='<div class="result-breakdown" id="resultBreakdown"></div>';
    html+='</div>';

    html+='<div class="exam-actions"><button class="exam-btn btn-submit" onclick="submitExam()">交卷评分</button><button class="exam-btn btn-reset" onclick="resetExam()">重做</button></div>';

    document.getElementById('examContent').innerHTML=html;
    document.getElementById('examListView').style.display='none';
    document.getElementById('examDetailView').style.display='block';

    startTimer();
  };

  window.selectAns=function(qid,oi,si,qi){
    if(document.getElementById('examResult').style.display==='block')return;
    var existing=userAnswers[qid];
    if(existing!==undefined){
      document.getElementById('opt_'+qid+'_'+existing).classList.remove('selected');
    }
    userAnswers[qid]=oi;
    document.getElementById('opt_'+qid+'_'+oi).classList.add('selected');
  };

  window.submitExam=function(){
    if(!currentExam)return;
    var totalScore=0;
    var breakdown={};
    currentExam.sections.forEach(function(sec,si){
      var correct=0;
      var total=sec.questions.length;
      sec.questions.forEach(function(q,qi){
        var qid='s'+si+'q'+qi;
        var ua=userAnswers[qid];
        var optEls=document.querySelectorAll('#opt_'+qid+'_'+(ua!==undefined?ua:-1));
        if(ua===q.answer){
          correct++;
          if(ua!==undefined)document.getElementById('opt_'+qid+'_'+ua).classList.add('correct');
        }else{
          if(ua!==undefined)document.getElementById('opt_'+qid+'_'+ua).classList.add('wrong');
          if(q.answer>=0)document.getElementById('opt_'+qid+'_'+q.answer).classList.add('correct');
        }
      });
      if(q.answer>=0){
        var pct=total>0?correct/total:0;
        var sectionScore=Math.round(pct*30);
        totalScore+=sectionScore;
        breakdown[sec.title.substring(0,sec.title.indexOf('（'))]=sectionScore;
      }
    });

    var resultBox=document.getElementById('examResult');
    resultBox.style.display='block';
    document.getElementById('resultScore').textContent=totalScore;
    var bdHtml='';
    for(var k in breakdown){
      bdHtml+='<div class="result-item"><div class="ri-label">'+k+'</div><div class="ri-score">'+breakdown[k]+'分</div></div>';
    }
    document.getElementById('resultBreakdown').innerHTML=bdHtml;

    scores[currentExam.id]={total:totalScore,date:Date.now()};
    try{localStorage.setItem(SCORES_KEY,JSON.stringify(scores))}catch(e){}
    stopTimer();
    renderExamList();
  };

  window.resetExam=function(){
    if(!currentExam)return;
    userAnswers={};
    document.querySelectorAll('.eq-opt').forEach(function(el){
      el.classList.remove('selected','correct','wrong');
      el.style.pointerEvents='auto';
    });
    document.getElementById('examResult').style.display='none';
    startTimer();
  };

  window.backToList=function(){
    document.getElementById('examDetailView').style.display='none';
    document.getElementById('examListView').style.display='block';
    stopTimer();
    renderExamList();
  };

  function startTimer(){
    stopTimer();
    var total=150*60;
    var timerEl=document.getElementById('examTimer');
    timerEl.classList.add('show');
    timerInterval=setInterval(function(){
      total--;
      if(total<=0){
        clearInterval(timerInterval);
        alert('时间到！自动交卷');
        submitExam();
        return;
      }
      var m=Math.floor(total/60);
      var s=total%60;
      timerEl.textContent='⏱ '+String(m).padStart(3,'0')+':'+String(s).padStart(2,'0');
    },1000);
  }
  function stopTimer(){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null}
    document.getElementById('examTimer').classList.remove('show');
  }

  renderExamList();
})();
</script>
</body>
</html>
