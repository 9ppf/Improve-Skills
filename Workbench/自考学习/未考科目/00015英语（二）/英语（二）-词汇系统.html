<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语（二）· 词汇系统</title>
<link rel="stylesheet" href="../../../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../../../styles/shared/base.css">
<link rel="stylesheet" href="../../../../styles/shared/components.css">
<link rel="stylesheet" href="../../../../styles/自考学习/英语（二）/英语（二）-词汇系统.css">
<script src="../../../../js/shared/theme-sync.js"></script>
</head>
<body>
<article class="page">

  <div class="vocab-btns">
    <button class="vocab-btn active" onclick="vocabShowMode('study')">📚 学习</button>
    <button class="vocab-btn" onclick="vocabShowMode('quiz')">✏️ 测验</button>
    <button class="vocab-btn" onclick="vocabShowMode('list')">📋 词表</button>
  </div>

  <div class="vocab-stats">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">总词数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statKnown">0</div>
      <div class="stat-label">已掌握</div>
      <div class="stat-bar"><div class="stat-fill" id="statKnownBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statLearning">0</div>
      <div class="stat-label">学习中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statToday">0</div>
      <div class="stat-label">今日待复习</div>
    </div>
  </div>

  <!-- 学习模式 -->
  <div class="flashcard-area" id="modeStudy">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <span class="fc-level" id="fcLevel">—</span>
      <div class="fc-word" id="fcWord">点击开始</div>
      <div class="fc-phonetic" id="fcPhonetic"></div>
      <div class="fc-meaning" id="fcMeaning" style="display:none"></div>
      <div class="fc-hint" id="fcHint">点击卡片查看释义</div>
    </div>
    <div class="rate-btns" id="rateBtns" style="display:none">
      <button class="rate-btn rate-again" onclick="rateCard(0)">不会</button>
      <button class="rate-btn rate-hard" onclick="rateCard(2)">模糊</button>
      <button class="rate-btn rate-good" onclick="rateCard(4)">认识</button>
      <button class="rate-btn rate-easy" onclick="rateCard(5)">简单</button>
    </div>
  </div>

  <!-- 测验模式 -->
  <div class="quiz-area" id="modeQuiz">
    <div class="quiz-question" id="quizQ">
      <div class="quiz-q-text" id="quizQText">点击下方按钮开始测验</div>
      <input class="quiz-input" id="quizInput" style="display:none" placeholder="输入答案" onkeydown="if(event.key==='Enter')checkQuiz()">
      <div class="quiz-options" id="quizOpts"></div>
      <div class="quiz-feedback" id="quizFb"></div>
    </div>
    <div class="rate-btns">
      <button class="rate-btn rate-good" onclick="nextQuiz()">下一题</button>
    </div>
  </div>

  <!-- 词表模式 -->
  <div class="wordlist-area" id="modeList">
    <input class="wordlist-search" id="wlSearch" placeholder="搜索单词或释义..." oninput="renderWordlist()">
    <table class="wordlist-table">
      <thead><tr><th>单词</th><th>音标</th><th>释义</th><th>等级</th><th>状态</th></tr></thead>
      <tbody id="wlBody"></tbody>
    </table>
  </div>

</article>


  <script src="../../../../js/shared/utils.js"></script>
  <script src="../../../../js/自考学习/英语（二）/英语（二）-词汇系统.js"></script>
</body>
</html>
