<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语（二）· 题型专项</title>
<style>
:root{--bg:#f8fafc;--bg2:rgba(255,255,255,0.72);--ink:#1e293b;--muted:#64748b;--rule:#e2e8f0;--accent:#2563eb;--accent2:#8b5cf6;--font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.75;padding:1.5rem 1rem}
article.page{max-width:820px;margin:0 auto}

.qt-tabs{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.25rem;padding:0.5rem;background:var(--bg2);border:1px solid var(--rule);border-radius:12px}
.qt-tab{flex:1;min-width:100px;padding:0.5rem 0.75rem;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;background:transparent;color:var(--muted)}
.qt-tab:hover{background:#eff6ff;color:var(--accent)}
.qt-tab.active{background:var(--accent);color:#fff}

.qt-panel{display:none}
.qt-panel.active{display:block}

.qt-section{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.qt-section h3{font-size:1.05rem;font-weight:700;margin-bottom:0.75rem;padding-left:0.6rem;border-left:3px solid var(--accent);color:var(--accent)}
.qt-section h4{font-size:0.95rem;font-weight:650;margin:1rem 0 0.5rem;color:var(--ink)}

/* 技巧卡片 */
.tip-list{list-style:none}
.tip-list li{padding:0.6rem 0;border-bottom:1px dashed var(--rule);font-size:0.92rem;display:flex;gap:0.6rem;align-items:flex-start}
.tip-list li:last-child{border-bottom:none}
.tip-num{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:#eff6ff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:0.78rem;font-weight:700}
.tip-text b{color:var(--accent)}

/* 练习题 */
.exercise-box{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
.exercise-box .ex-passage{font-size:0.9rem;line-height:1.8;color:var(--ink);margin-bottom:0.75rem;padding:0.75rem;background:#f8fafc;border-radius:8px;border-left:3px solid var(--accent2)}
.exercise-box .ex-q{font-size:0.92rem;margin-bottom:0.5rem;font-weight:500}
.exercise-box .ex-q .ex-num{color:var(--accent);font-weight:700;margin-right:0.3rem}
.exercise-box .ex-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.5rem;margin-top:0.5rem}
.ex-opt{padding:0.4rem 0.75rem;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:0.88rem;transition:all 0.2s}
.ex-opt:hover{border-color:var(--accent);background:#eff6ff}
.ex-opt.correct{border-color:var(--green);background:#ecfdf5;color:var(--green)}
.ex-opt.wrong{border-color:var(--red);background:#fef2f2;color:var(--red)}
.ex-answer{margin-top:0.75rem;padding:0.6rem 0.8rem;border-radius:8px;font-size:0.88rem;display:none}
.ex-answer.show{display:block}
.ex-answer.correct{background:#ecfdf5;color:var(--green)}
.ex-answer.wrong{background:#fef2f2;color:var(--red)}

/* 统计 */
.qt-stats{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.qt-stat{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:0.75rem 1.25rem;text-align:center;min-width:100px}
.qt-stat .qs-num{font-size:1.3rem;font-weight:700;color:var(--accent)}
.qt-stat .qs-label{font-size:0.8rem;color:var(--muted)}

/* 错题列表 */
.error-list{list-style:none}
.error-item{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:0.75rem 1rem;margin-bottom:0.5rem;font-size:0.88rem}
.error-item .ei-q{font-weight:600;color:var(--ink);margin-bottom:0.25rem}
.error-item .ei-a{color:var(--red);font-size:0.85rem}
.error-item .ei-c{color:var(--green);font-size:0.85rem}
.error-empty{text-align:center;color:var(--muted);padding:1.5rem;font-size:0.9rem}

@media(max-width:640px){
  .qt-tab{min-width:80px;font-size:0.78rem;padding:0.4rem 0.5rem}
  .exercise-box .ex-opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<article class="page">
<div class="qt-tabs" id="qtTabs"></div>
<div id="qtPanels"></div>
</article>
<script>
(function(){
  var ERROR_KEY='en_qtype_errors';
  var errors={};
  try{errors=JSON.parse(localStorage.getItem(ERROR_KEY)||'{}')}catch(e){errors={}}
  function saveErrors(){try{localStorage.setItem(ERROR_KEY,JSON.stringify(errors))}catch(e){}}

  var QTYPES=[
    {id:'q1',name:'阅读判断',score:'10分',diff:'★★☆',
     tips:[
       {t:'<b>先读题再读文</b>：快速浏览10个题目，划出关键词（人名、地名、数字、核心动词）'},
       {t:'<b>True/False/NG区分</b>：True=原文明确支持；False=原文明确矛盾；Not Given=原文未提及或无法判断'},
       {t:'<b>False vs NG判断法</b>：如果能找到原文反证→False；如果找不到任何证据→Not Given。最常见的错误是把NG误判为False'},
       {t:'<b>按顺序定位</b>：题目顺序通常与文章行文顺序一致，逐题定位答案区间'}
     ],
     exercises:[
       {passage:'Many people believe that social media has a negative effect on interpersonal communication. However, recent studies show that social media can actually enhance relationships by allowing people to stay connected across distances.',
        q:'Social media has been proven to have a purely negative effect on communication.',
        opts:['True','False','Not Given'],answer:1,
        explain:'原文说"However, recent studies show that social media can actually enhance relationships"，明确反驳了"purely negative"，所以是False'}
     ]},
    {id:'q2',name:'阅读选择',score:'10分',diff:'★★★',
     tips:[
       {t:'<b>定位法</b>：用题干关键词在原文中定位答案区间，通常在1-2句话内'},
       {t:'<b>同义替换识别</b>：正确选项通常是对原文的同义替换，而非原词重现。注意同义词、反义词、词性转换'},
       {t:'<b>排除法</b>：先排除明显错误的选项（与原文矛盾、过度推断、信息未提及），缩小范围'},
       {t:'<b>警惕绝对词</b>：选项中出现all/never/always/only等绝对词时，通常是干扰项'}
     ],
     exercises:[
       {passage:'The researchers found that students who studied with background music scored 15% higher on memory tests compared to those who studied in silence. However, the type of music mattered: classical music improved performance, while loud rock music had no significant effect.',
        q:'According to the passage, which type of music improved student performance?',
        opts:['Loud rock music','Classical music','All types of music','No music at all'],answer:1,
        explain:'原文明确说"classical music improved performance"，而"loud rock music had no significant effect"'}
     ]},
    {id:'q3',name:'概括补全',score:'10分',diff:'★★☆',
     tips:[
       {t:'<b>前半题（概括大意）</b>：读段落首句和末句，找主题句。正确选项通常是段落核心观点的概括，而非细节'},
       {t:'<b>后半题（补全句子）</b>：根据原文信息完成句子，注意语法一致性和逻辑连贯性'},
       {t:'<b>关键词匹配</b>：正确选项通常包含段落中的关键词或其同义词'},
       {t:'<b>排除细节项</b>：如果选项只涉及段落中的某个细节而非主旨，通常不是正确答案'}
     ],
     exercises:[
       {passage:'Paragraph 3: Exercise has numerous benefits for mental health. Regular physical activity can reduce symptoms of anxiety and depression, improve sleep quality, and boost self-esteem. Even a 30-minute walk can make a noticeable difference in mood.',
        q:'The main idea of Paragraph 3 is that ____',
        opts:['exercise benefits mental health','walking is the best exercise','depression can be cured by exercise','sleep quality depends on diet'],answer:0,
        explain:'段落首句"Exercise has numerous benefits for mental health"即为主题句，后文都是具体说明'}
     ]},
    {id:'q4',name:'填句补文',score:'10分',diff:'★★★',
     tips:[
       {t:'<b>关注逻辑衔接</b>：空缺前后句之间的逻辑关系（因果、转折、并列、递进）决定填入的句子'},
       {t:'<b>代词线索</b>：如果待选句中有this/that/these/such/it等代词，找到它指代的内容，对应到原文位置'},
       {t:'<b>连词线索</b>：however/but→转折；therefore/so→因果；for example→举例；in addition→递增'},
       {t:'<b>先易后难</b>：先填有明确线索的空，剩余用排除法'},
       {t:'<b>代入验证</b>：填入后通读上下文，检查逻辑是否通顺'}
     ],
     exercises:[
       {passage:'Online learning has become increasingly popular. ___1___ It allows students to study at their own pace and review materials as many times as needed. ___2___ Many students find it difficult to stay motivated without face-to-face interaction.',
        q:'Choose the best sentence for gap 2:',
        opts:['This flexibility is a major advantage.','However, it also has some challenges.','Online learning is cheaper.','Teachers need special training.'],answer:1,
        explain:'空格2后面说"Many students find it difficult to stay motivated"，这是在讲在线学习的"挑战"，所以填"However, it also has some challenges"'}
     ]},
    {id:'q5',name:'填词补文',score:'15分',diff:'★★☆',
     tips:[
       {t:'<b>先判词性</b>：分析空格处需要什么词性（名词/动词/形容词/副词），缩小选择范围'},
       {t:'<b>语法匹配</b>：空格前后的词决定词性。如空格前是形容词→填名词；空格前是主语→填动词'},
       {t:'<b>语义匹配</b>：在词性匹配的基础上，选择语义最合适的词'},
       {t:'<b>排除已用</b>：每个词只能用一次，用过的词先划掉'},
       {t:'<b>最后检查</b>：填完后通读全文，检查每个空格的词是否使句子通顺'}
     ],
     exercises:[
       {passage:'The city council decided to build a new library to ___1___ the growing demand for study spaces. The library will ___2___ a reading room, a computer lab, and a children\'s area.',
        q:'Word bank: provide / increase / decrease / offer / reduce / create / limit / improve / remove / maintain / reach / change',
        opts:['increase','provide','decrease','create'],answer:1,
        explain:'空格1后面是"the growing demand"，需要"满足/应对"需求的词；空格2后面是具体设施列表，需要"提供"的词。两个空都可以用provide，但此题空格2更适合provide，空格1更适合meet（词库中没有，所以选最接近的）'}
     ]},
    {id:'q6',name:'完形补文',score:'15分',diff:'★★★★',
     tips:[
       {t:'<b>派生词是核心</b>：根据上下文和语法，将给出的词根变为正确形式（名词↔动词↔形容词↔副词）'},
       {t:'<b>常见词缀</b>：名词后缀：-tion/-ment/-ness/-ity/-er；形容词后缀：-ful/-less/-ous/-al/-ive；副词后缀：-ly；否定前缀：un-/in-/dis-/im-'},
       {t:'<b>语法判断</b>：空格前是冠词(a/the)→填名词；空格前是be动词→填形容词或过去分词；空格前是副词→填形容词'},
       {t:'<b>时态和单复数</b>：动词要注意时态（-ed/-ing）和单复数（-s）；名词要注意单复数'},
       {t:'<b>上下文语义</b>：有时需要根据上下文判断是肯定还是否定形式（如加un-/dis-等否定前缀）'}
     ],
     exercises:[
       {passage:'The ___1___(develop) of artificial intelligence has brought significant changes to our daily lives. AI makes many tasks more ___2___(efficiency) and ___3___(access) to people around the world.',
        q:'Fill in the correct form of the word in parentheses.',
        opts:['development / efficient / accessible','develop / efficiency / access','developing / effective / available','developed / efficiently / accessing'],answer:0,
        explain:'空格1前有The，需要名词→development；空格2在more后面，需要形容词→efficient；空格3同样在more后面，需要形容词→accessible'}
     ]},
    {id:'q7',name:'短文写作',score:'30分',diff:'★★★',
     tips:[
       {t:'<b>审题3分钟</b>：仔细阅读题目要求，确定作文类型（议论文/应用文）、字数要求（约150词）、内容要点'},
       {t:'<b>三段结构</b>：开头段（引出话题+表明观点）→主体段（2-3个论点+举例）→结尾段（总结+建议/展望）'},
       {t:'<b>背模板框架</b>：每类作文准备1个框架，考试时套用，节省构思时间'},
       {t:'<b>用连接词</b>：First/Second/Besides/However/Therefore/In conclusion等，使文章逻辑清晰'},
       {t:'<b>限时练习</b>：平时练习严格控制在30分钟内完成（5分钟构思+20分钟写作+5分钟检查）'},
       {t:'<b>详细模板和范文请见「作文模板」页面</b>'}
     ],
     exercises:[]}
  ];

  var tabsHtml='';
  QTYPES.forEach(function(qt,i){
    tabsHtml+='<button class="qt-tab'+(i===0?' active':'')+'" onclick="switchQt(\''+qt.id+'\')">'+qt.name+'</button>';
  });
  document.getElementById('qtTabs').innerHTML=tabsHtml;

  function renderPanel(qt){
    var html='<div class="qt-panel'+(qt===QTYPES[0]?' active':'')+'" id="panel_'+qt.id+'">';

    // 统计
    var errs=errors[qt.id]||[];
    var total=errs.length;
    html+='<div class="qt-stats"><div class="qt-stat"><div class="qs-num">'+qt.score+'</div><div class="qs-label">分值</div></div><div class="qt-stat"><div class="qs-num">'+qt.diff+'</div><div class="qs-label">难度</div></div><div class="qt-stat"><div class="qs-num" id="errCount_'+qt.id+'">'+total+'</div><div class="qs-label">错题数</div></div></div>';

    // 技巧
    html+='<div class="qt-section"><h3>解题技巧</h3><ul class="tip-list">';
    qt.tips.forEach(function(t,i){
      html+='<li><span class="tip-num">'+(i+1)+'</span><span class="tip-text">'+t.t+'</span></li>';
    });
    html+='</ul></div>';

    // 练习题
    if(qt.exercises.length>0){
      html+='<div class="qt-section"><h3>练习题</h3>';
      qt.exercises.forEach(function(ex,i){
        html+='<div class="exercise-box">';
        if(ex.passage)html+='<div class="ex-passage">'+ex.passage+'</div>';
        html+='<div class="ex-q"><span class="ex-num">Q'+(i+1)+'</span>'+ex.q+'</div>';
        html+='<div class="ex-opts">';
        ex.opts.forEach(function(opt,oi){
          html+='<div class="ex-opt" onclick="checkEx(this,'+oi+','+ex.answer+',\''+qt.id+'\','+i+')">'+String.fromCharCode(65+oi)+'. '+opt+'</div>';
        });
        html+='</div>';
        html+='<div class="ex-answer" id="exAns_'+qt.id+'_'+i+'"></div>';
        html+='</div>';
      });
      html+='</div>';
    }

    // 错题列表
    html+='<div class="qt-section"><h3>错题记录</h3>';
    if(errs.length===0){
      html+='<div class="error-empty">暂无错题，继续加油！</div>';
    }else{
      html+='<ul class="error-list">';
      errs.forEach(function(e){
        html+='<li class="error-item"><div class="ei-q">'+e.question+'</div><div class="ei-a">你的答案：'+e.myAnswer+'</div><div class="ei-c">正确答案：'+e.correctAnswer+'</div></li>';
      });
      html+='</ul>';
    }
    html+='</div>';

    html+='</div>';
    return html;
  }

  var panelsHtml='';
  QTYPES.forEach(function(qt){panelsHtml+=renderPanel(qt)});
  document.getElementById('qtPanels').innerHTML=panelsHtml;

  window.switchQt=function(id){
    document.querySelectorAll('.qt-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.qt-panel').forEach(function(p){p.classList.remove('active')});
    event.target.classList.add('active');
    document.getElementById('panel_'+id).classList.add('active');
  };

  window.checkEx=function(el,selected,correct,qtId,exIdx){
    var opts=el.parentNode.querySelectorAll('.ex-opt');
    opts.forEach(function(o){o.style.pointerEvents='none'});
    var ansBox=document.getElementById('exAns_'+qtId+'_'+exIdx);
    if(selected===correct){
      el.classList.add('correct');
      ansBox.className='ex-answer correct show';
      ansBox.innerHTML='✅ 正确！'+(QTYPES.find(function(q){return q.id===qtId}).exercises[exIdx].explain?' 解析：'+QTYPES.find(function(q){return q.id===qtId}).exercises[exIdx].explain:'');
    }else{
      el.classList.add('wrong');
      opts[correct].classList.add('correct');
      ansBox.className='ex-answer wrong show';
      var qt=QTYPES.find(function(q){return q.id===qtId});
      ansBox.innerHTML='❌ 正确答案：'+String.fromCharCode(65+correct)+'. '+qt.exercises[exIdx].opts[correct]+'<br>解析：'+qt.exercises[exIdx].explain;
      if(!errors[qtId])errors[qtId]=[];
      errors[qtId].push({question:qt.exercises[exIdx].q,myAnswer:String.fromCharCode(65+selected)+'. '+qt.exercises[exIdx].opts[selected],correctAnswer:String.fromCharCode(65+correct)+'. '+qt.exercises[exIdx].opts[correct],date:Date.now()});
      saveErrors();
      var ec=document.getElementById('errCount_'+qtId);
      if(ec)ec.textContent=parseInt(ec.textContent)+1;
    }
  };
})();
</script>
</body>
</html>
