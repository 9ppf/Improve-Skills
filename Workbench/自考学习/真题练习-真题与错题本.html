<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真题与错题本</title>
  <style>
    :root {
      --bg: #f8fafc;
      --bg2: rgba(255, 255, 255, 0.72);
      --ink: #1e293b;
      --muted: #64748b;
      --rule: #e2e8f0;
      --accent: #2563eb;
      --accent2: #8b5cf6;
      --coral: #e11d48;
      --green: #059669;
      --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --max: 860px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.75;
      padding: 2rem 1rem;
    }
    article.exam-page {
      max-width: var(--max);
      margin: 0 auto;
    }

    .exam-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .exam-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .exam-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .exam-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .exam-tab {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: var(--bg2);
      cursor: pointer;

      transition: all 0.2s;
    }
    .exam-tab:hover {
      border-color: var(--accent);

    }
    .exam-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .exam-section {
      background: var(--bg2);
      border: 1px solid rgba(37, 99, 235, 0.10);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }
    .exam-section h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .exam-filter {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;

    }
    .exam-filter select {
      padding: 0.4rem 0.8rem;

      border: 1px solid var(--rule);

      background: #fff;

      cursor: pointer;
    }

    .exam-question-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .exam-question {
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      background: #fff;
      transition: border-color 0.2s;
    }
    .exam-question:hover {
      border-color: var(--accent);
    }
    .exam-question-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .exam-badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .exam-badge-year { background: rgba(37, 99, 235, 0.10); color: var(--accent); }
    .exam-badge-type { background: rgba(139, 92, 246, 0.10); color: var(--accent2); }
    .exam-badge-status-correct { background: rgba(5, 150, 105, 0.10); color: var(--green); }
    .exam-badge-status-wrong { background: rgba(225, 29, 72, 0.10); color: var(--coral); }
    .exam-badge-status-pending { background: rgba(245, 158, 11, 0.10); color: #d97706; }
    .exam-question-title {
      font-weight: 600;
      color: var(--ink);
      font-size: 0.95rem;
    }
    .exam-question-body {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.3rem;
    }
    .exam-question-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }
    .exam-btn {
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--rule);
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }
    .exam-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .exam-btn-wrong:hover {
      border-color: var(--coral);
      color: var(--coral);
    }

    .exam-empty {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .exam-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .exam-add-form input,
    .exam-add-form select,
    .exam-add-form textarea {
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
      font-size: 0.85rem;
      font-family: var(--font);
      background: #fff;
      color: var(--ink);
    }
    .exam-add-form textarea {
      grid-column: 1 / -1;
      min-height: 80px;
      resize: vertical;
    }
    .exam-add-form button {
      grid-column: 1 / -1;
      padding: 0.6rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .exam-add-form button:hover { opacity: 0.9; }

    .exam-stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .exam-stat {
      flex: 1;
      min-width: 100px;
      text-align: center;
      padding: 0.75rem;
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.05);
    }
    .exam-stat-num {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .exam-stat-label {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .exam-stat-wrong .exam-stat-num { color: var(--coral); }
    .exam-stat-correct .exam-stat-num { color: var(--green); }

    @media (max-width: 640px) {
      body { padding: 1.5rem 0.9rem; }
      .exam-add-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <article class="exam-page">
    <div class="exam-tabs" id="subjectTabs">
      <div class="exam-tab active" data-subject="13015">13015 计算机系统原理</div>
      <div class="exam-tab" data-subject="02324">02324 离散数学</div>
      <div class="exam-tab" data-subject="13003">13003 数据结构与算法</div>
    </div>

    <div class="exam-section">
      <h2>📊 统计概览</h2>
      <div class="exam-stats" id="statsArea">
        <div class="exam-stat"><div class="exam-stat-num" id="statTotal">0</div><div class="exam-stat-label">总题数</div></div>
        <div class="exam-stat exam-stat-correct"><div class="exam-stat-num" id="statCorrect">0</div><div class="exam-stat-label">已掌握</div></div>
        <div class="exam-stat exam-stat-wrong"><div class="exam-stat-num" id="statWrong">0</div><div class="exam-stat-label">错题</div></div>
        <div class="exam-stat"><div class="exam-stat-num" id="statPending">0</div><div class="exam-stat-label">待做</div></div>
      </div>
    </div>

    <div class="exam-section">
      <h2>➕ 添加真题</h2>
      <div class="exam-add-form">
        <select id="qYear">
          <option value="">年份</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>
        <select id="qType">
          <option value="">题型</option>
          <option value="选择题">选择题</option>
          <option value="填空题">填空题</option>
          <option value="应用题">应用题</option>
          <option value="算法设计题">算法设计题</option>
          <option value="简答题">简答题</option>
        </select>
        <input type="text" id="qTitle" placeholder="题目标题（如：2024年真题第3题）" />
        <select id="qStatus">
          <option value="pending">待做</option>
          <option value="correct">已掌握</option>
          <option value="wrong">错题</option>
        </select>
        <textarea id="qBody" placeholder="题目内容、解题思路、易错点等（选填）"></textarea>
        <button id="addBtn">添加到题库</button>
      </div>
    </div>

    <div class="exam-section">
      <h2>📝 题库</h2>
      <div class="exam-filter">
        <select id="filterYear">
          <option value="">全部年份</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>
        <select id="filterType">
          <option value="">全部题型</option>
          <option value="选择题">选择题</option>
          <option value="填空题">填空题</option>
          <option value="应用题">应用题</option>
          <option value="算法设计题">算法设计题</option>
          <option value="简答题">简答题</option>
        </select>
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="pending">待做</option>
          <option value="correct">已掌握</option>
          <option value="wrong">错题</option>
        </select>
      </div>
      <div class="exam-question-list" id="questionList"></div>
    </div>

    <div class="exam-section">
      <h2>❌ 错题本</h2>
      <div class="exam-question-list" id="wrongList"></div>
    </div>
  </article>

  <script>
    var STORAGE_KEY = 'exam-questions-data';
    var urlParams = new URLSearchParams(window.location.search);
    var currentSubject = urlParams.get('subject') || '13015';
    var allData = {};

    function loadData() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        allData = raw ? JSON.parse(raw) : {};
      } catch(e) { allData = {}; }
    }

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); } catch(e) {}
    }

    function getQuestions(subject) {
      if (!allData[subject]) allData[subject] = [];
      return allData[subject];
    }

    function statusLabel(s) {
      if (s === 'correct') return '已掌握';
      if (s === 'wrong') return '错题';
      return '待做';
    }

    function renderStats() {
      var qs = getQuestions(currentSubject);
      var correct = 0, wrong = 0, pending = 0;
      qs.forEach(function(q) {
        if (q.status === 'correct') correct++;
        else if (q.status === 'wrong') wrong++;
        else pending++;
      });
      document.getElementById('statTotal').textContent = qs.length;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statPending').textContent = pending;
    }

    function renderQuestions() {
      var qs = getQuestions(currentSubject);
      var fy = document.getElementById('filterYear').value;
      var ft = document.getElementById('filterType').value;
      var fs = document.getElementById('filterStatus').value;

      var filtered = qs.filter(function(q) {
        return (!fy || q.year === fy) && (!ft || q.type === ft) && (!fs || q.status === fs);
      });

      var list = document.getElementById('questionList');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="exam-empty">暂无题目，点击上方「添加到题库」开始记录真题</div>';
        return;
      }

      list.innerHTML = filtered.map(function(q, i) {
        return '<div class="exam-question">' +
          '<div class="exam-question-header">' +
          '<span class="exam-badge exam-badge-year">' + q.year + '</span>' +
          '<span class="exam-badge exam-badge-type">' + q.type + '</span>' +
          '<span class="exam-badge exam-badge-status-' + q.status + '">' + statusLabel(q.status) + '</span>' +
          '</div>' +
          '<div class="exam-question-title">' + q.title + '</div>' +
          (q.body ? '<div class="exam-question-body">' + q.body.replace(/</g, '&lt;') + '</div>' : '') +
          '<div class="exam-question-actions">' +
          '<button class="exam-btn" onclick="setStatus(\'' + currentSubject + '\',' + q.id + ',\'correct\')">✓ 标记掌握</button>' +
          '<button class="exam-btn exam-btn-wrong" onclick="setStatus(\'' + currentSubject + '\',' + q.id + ',\'wrong\')">✗ 标记错题</button>' +
          '<button class="exam-btn" onclick="setStatus(\'' + currentSubject + '\',' + q.id + ',\'pending\')">○ 标记待做</button>' +
          '<button class="exam-btn exam-btn-wrong" onclick="deleteQuestion(\'' + currentSubject + '\',' + q.id + ')">删除</button>' +
          '</div></div>';
      }).join('');
    }

    function renderWrong() {
      var qs = getQuestions(currentSubject);
      var wrongs = qs.filter(function(q) { return q.status === 'wrong'; });
      var list = document.getElementById('wrongList');
      if (wrongs.length === 0) {
        list.innerHTML = '<div class="exam-empty">暂无错题，继续加油！</div>';
        return;
      }
      list.innerHTML = wrongs.map(function(q) {
        return '<div class="exam-question">' +
          '<div class="exam-question-header">' +
          '<span class="exam-badge exam-badge-year">' + q.year + '</span>' +
          '<span class="exam-badge exam-badge-type">' + q.type + '</span>' +
          '<span class="exam-badge exam-badge-status-wrong">错题</span>' +
          '</div>' +
          '<div class="exam-question-title">' + q.title + '</div>' +
          (q.body ? '<div class="exam-question-body">' + q.body.replace(/</g, '&lt;') + '</div>' : '') +
          '<div class="exam-question-actions">' +
          '<button class="exam-btn" onclick="setStatus(\'' + currentSubject + '\',' + q.id + ',\'correct\')">✓ 已攻克</button>' +
          '</div></div>';
      }).join('');
    }

    function setStatus(subject, id, status) {
      var qs = getQuestions(subject);
      var q = qs.find(function(x) { return x.id === id; });
      if (q) { q.status = status; saveData(); renderAll(); }
    }

    function deleteQuestion(subject, id) {
      var qs = getQuestions(subject);
      var idx = qs.findIndex(function(x) { return x.id === id; });
      if (idx >= 0) { qs.splice(idx, 1); saveData(); renderAll(); }
    }

    function addQuestion() {
      var year = document.getElementById('qYear').value;
      var type = document.getElementById('qType').value;
      var title = document.getElementById('qTitle').value.trim();
      var status = document.getElementById('qStatus').value;
      var body = document.getElementById('qBody').value.trim();

      if (!year || !type || !title) {
        alert('请填写年份、题型和标题');
        return;
      }

      var qs = getQuestions(currentSubject);
      var id = Date.now();
      qs.push({ id: id, year: year, type: type, title: title, status: status, body: body });
      saveData();

      document.getElementById('qYear').value = '';
      document.getElementById('qType').value = '';
      document.getElementById('qTitle').value = '';
      document.getElementById('qBody').value = '';
      document.getElementById('qStatus').value = 'pending';
      renderAll();
    }

    function renderAll() {
      renderStats();
      renderQuestions();
      renderWrong();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      document.querySelectorAll('.exam-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.subject === subject);
      });
      renderAll();
    }

    document.querySelectorAll('.exam-tab').forEach(function(t) {
      t.addEventListener('click', function() { switchSubject(t.dataset.subject); });
    });
    document.getElementById('filterYear').addEventListener('change', renderQuestions);
    document.getElementById('filterType').addEventListener('change', renderQuestions);
    document.getElementById('filterStatus').addEventListener('change', renderQuestions);
    document.getElementById('addBtn').addEventListener('click', addQuestion);

    loadData();
    switchSubject(currentSubject);
  </script>
</body>
</html>
