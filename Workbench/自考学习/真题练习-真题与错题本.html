<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真题练习</title>
  <script src="../../js/shared/theme-sync.js?v=4f76b4d7"></script>
  <link rel="stylesheet" href="../../styles/shared/base-vars.css">
  <link rel="stylesheet" href="../../styles/shared/base.css">
  <link rel="stylesheet" href="../../styles/shared/components.css">
  <link rel="stylesheet" href="../../styles/自考学习/真题练习-真题与错题本.css?v=202609220400">
</head>
<body>
<div class="exam-container">
  <!-- topbar：标题 + 科目标签 + 统计（与练习测验一致） -->
  <div class="exam-topbar">
    <div class="exam-topbar-left">
      <h1>真题与模拟</h1>
      <span class="subject-tag" id="subjectTag">科目</span>
    </div>
    <div class="exam-stats-mini" id="statsRow">
      <span class="pill pill-total"><span class="dot"></span>共 <b id="statTotal">0</b> 题</span>
      <span class="pill pill-done"><span class="dot"></span>已做 <b id="statDone">0</b> 题</span>
      <span class="pill pill-rate"><span class="dot"></span>正确率 <b id="statRate">0%</b></span>
    </div>
  </div>

  <!-- 专项训练面板 -->
  <div class="exam-mode-pane active" id="paneTraining">
    <!-- 筛选行（彩色边框区分维度） -->
    <div class="exam-filter-row">
      <select class="exam-filter exam-f-blue" id="filterYear">
        <option value="">全部年份</option>
      </select>
      <select class="exam-filter exam-f-purple" id="filterType">
        <option value="">全部题型</option>
      </select>
      <select class="exam-filter exam-f-blue" id="filterChapter">
        <option value="">全部知识点</option>
      </select>
      <select class="exam-filter exam-f-green" id="filterStatus">
        <option value="">全部状态</option>
      </select>
      <span class="exam-filter-count" id="filterCount">0 题</span>
    </div>

    <!-- 题目列表 -->
    <div class="exam-question-list" id="trainingList"></div>

    <!-- AI出题区 -->
    <div class="exam-ai-section">
      <div class="exam-ai-header">
        <h2 class="exam-section-title">🤖 AI专项出题</h2>
        <button class="exam-ai-gen-btn" id="aiGenBtn" onclick="generateAIExamQuestions()">🤖 AI出题</button>
      </div>
      <div class="exam-question-list" id="aiExamList">
        <div class="exam-empty">点击上方「🤖 AI出题」按钮，将按当前筛选范围（年份/题型/知识点）的真题风格生成 5 道新题目</div>
      </div>
    </div>

    <!-- 题目导航面板 -->
    <div class="exam-nav-panel collapsed" id="examNavPanel">
      <button class="exam-nav-collapsed-btn" onclick="toggleExamNav()">📋</button>
    </div>

    <!-- 错题本入口 -->
    <div class="exam-wrong-section">
      <a class="exam-link-btn exam-link-wrongbook" id="wrongBookLink" href="错题本.html">查看完整错题本 →</a>
    </div>
  </div>

</div>

  <script src="../../js/shared/utils.js?v=4f76b4d7"></script>
  <script src="../../js/shared/ai-chat.js?v=4f76b4d7"></script>
  <script src="../../js/shared/quiz-helpers.js?v=4f76b4d7"></script>
  <script src="../../js/自考学习/exam-data-loader.js?v=4f76b4d7"></script>
  <script src="../../js/自考学习/真题练习.js?v=4f76b4d7"></script>
</body>
</html>
