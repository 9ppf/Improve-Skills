<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习测验</title>
<link rel="stylesheet" href="../shared/base-vars.css">
<style>
  body {
  --green-light: #d1fae5;
  --coral-light: #fee2e2;
  --amber-light: #fef3c7;
  --bg-soft: #f9fafb;
}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f0f9ff 0%, #fdf4ff 50%, #f0fdf4 100%);
    min-height: 100vh; color: var(--ink); padding: 1.5rem 1rem;
  }
  .quiz-container { max-width: 820px; margin: 0 auto; }

  /* 第一层：标题 + 科目 + 统计 一行 */
  .quiz-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap;
  }
  .quiz-topbar-left { display: flex; align-items: baseline; gap: 0.5rem; }
  .quiz-topbar h1 {
    font-size: 1.1rem; font-weight: 700;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .quiz-topbar .subject-tag {
    font-size: 0.72rem; color: var(--muted);
    padding: 2px 8px; background: rgba(59,130,246,0.08);
    border-radius: 999px; font-weight: 600;
  }
  .quiz-stats-mini { display: flex; gap: 4px; font-size: 0.72rem; }
  .quiz-stats-mini .pill {
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
    display: flex; align-items: center; gap: 3px;
  }
  .quiz-stats-mini .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .quiz-stats-mini .pill.mastered { background: var(--green-light); color: #047857; }
  .quiz-stats-mini .pill.mastered .dot { background: var(--green); }
  .quiz-stats-mini .pill.unsure { background: var(--amber-light); color: #92400e; }
  .quiz-stats-mini .pill.unsure .dot { background: var(--amber); }
  .quiz-stats-mini .pill.unknown { background: var(--coral-light); color: #991b1b; }
  .quiz-stats-mini .pill.unknown .dot { background: var(--coral); }

  /* 第二层：筛选栏（三层下拉筛选 + 操作按钮） */
  .qf-bar {
    display: flex; align-items: center; gap: 0.4rem;
    flex-wrap: wrap; margin-bottom: 0.3rem;
    padding: 0.4rem 0.6rem;
    background: var(--bg-soft); border-radius: 8px;
  }
  .qf-select {
    padding: 0.3rem 0.6rem; border: 1.5px solid;
    border-radius: 8px; font-size: 0.78rem; font-weight: 500;
    cursor: pointer; white-space: nowrap; outline: none;
    transition: opacity 0.15s;
  }
  .qf-select:hover { opacity: 0.85; }
  .qf-kp { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .qf-type { border-color: var(--accent2); background: #f5f3ff; color: var(--accent2); }
  .qf-status { border-color: var(--green); background: #ecfdf5; color: var(--green); }
  .qf-sep { color: var(--rule); font-size: 0.75rem; }
  .qf-count {
    font-size: 0.72rem; color: var(--muted);
    margin-left: auto; background: #fff;
    padding: 0.2rem 0.5rem; border-radius: 6px;
    border: 1px solid var(--rule);
  }
  .quiz-controlbar {
    display: flex; align-items: center; gap: 0.4rem;
    flex-wrap: wrap; margin-bottom: 0.3rem;
    padding: 0.4rem 0.6rem;
    background: rgba(255,255,255,0.7);
    border-radius: 8px; backdrop-filter: blur(8px);
  }
  .mode-btn {
    padding: 0.35rem 0.9rem; border: 1.5px solid var(--rule);
    border-radius: 999px; background: #fff; font-size: 0.78rem;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    font-weight: 500;
  }
  .mode-btn:hover { border-color: var(--accent); }
  .mode-btn.zk-active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent; font-weight: 600;
  }
  .mode-btn.ai { border-color: #c4b5fd; color: #8b5cf6; }
  .qf-hint {
    font-size: 0.72rem; color: var(--muted); padding: 0 4px;
  }
  .mode-hint {
    font-size: 0.74rem; color: var(--muted);
    padding: 4px 10px; margin-bottom: 0.5rem;
    background: var(--bg-soft); border-radius: 6px; display: none;
  }
  .mode-hint.zk-show { display: block; }
  .mode-hint.warn { background: var(--amber-light); color: #92400e; }

  /* Session progress bar - mode-aware via --session-* vars */
  .session-bar {
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px; font-size: 12px;
    background: var(--session-bg, #f0fdf4); color: var(--session-color, #059669);
    transition: background 0.3s, color 0.3s;
  }
  .session-bar .session-track {
    flex: 1; height: 5px; background: var(--session-track, #d1fae5);
    border-radius: 3px; overflow: hidden;
  }
  .session-bar .session-fill {
    height: 100%; width: 0%; border-radius: 3px;
    background: var(--session-fill, #22c55e); transition: width 0.3s;
  }

  .quiz-list { display: flex; flex-direction: column; gap: 0.8rem; transition: opacity 0.15s; }
  .quiz-card {
    background: #fff; border-radius: 10px; padding: 1rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    border-left: 4px solid var(--accent2);
    transition: box-shadow 0.2s;
  }
  .quiz-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
  .quiz-card.mastered { border-left-color: var(--green); }
  .quiz-card.unsure { border-left-color: var(--amber); }
  .quiz-card.unknown { border-left-color: var(--coral); }

  .quiz-meta {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 0.5rem;
  }
  .quiz-chapter { font-size: 0.72rem; color: var(--muted); }
  .quiz-badge {
    display: inline-block; font-size: 0.68rem;
    padding: 0.12rem 0.5rem; border-radius: 999px; font-weight: 600;
  }
  .badge-choice { background: rgba(59,130,246,0.12); color: #2563eb; }
  .badge-fill { background: rgba(245,158,11,0.12); color: #92400e; }
  .badge-calculate { background: rgba(139,92,246,0.12); color: #7c3aed; }
  .badge-shortAnswer { background: rgba(16,185,129,0.12); color: #059669; }
  .badge-essay { background: rgba(236,72,153,0.12); color: #be185d; }
  .badge-proof { background: rgba(99,102,241,0.12); color: #4f46e5; }

  .quiz-question {
    font-size: 0.9rem; font-weight: 600;
    line-height: 1.6; margin-bottom: 0.4rem;
  }
  .quiz-hint {
    font-size: 0.75rem; color: var(--muted);
    margin-bottom: 0.6rem; padding: 0.3rem 0.5rem;
    background: var(--bg-soft); border-radius: 5px;
  }

  /* Choice */
  .choice-options { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.6rem; }
  .choice-option {
    display: flex; align-items: flex-start; gap: 0.4rem;
    padding: 0.4rem 0.6rem; border: 1.5px solid var(--rule);
    border-radius: 8px; cursor: pointer; transition: all 0.15s;
    font-size: 0.85rem; line-height: 1.5;
  }
  .choice-option:hover { border-color: var(--accent); background: rgba(59,130,246,0.04); }
  .choice-option.quiz-selected { border-color: var(--accent); background: rgba(59,130,246,0.08); }
  .choice-option.correct { border-color: var(--green); background: var(--green-light); }
  .choice-option.wrong { border-color: var(--coral); background: var(--coral-light); }
  .choice-option.quiz-disabled { cursor: default; }
  .choice-letter {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--rule); display: flex;
    align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
  }
  .choice-option.quiz-selected .choice-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
  .choice-option.correct .choice-letter { background: var(--green); color: #fff; border-color: var(--green); }
  .choice-option.wrong .choice-letter { background: var(--coral); color: #fff; border-color: var(--coral); }

  /* Fill */
  .fill-blank-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
  .fill-blank-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); width: 40px; flex-shrink: 0; }
  .fill-blank-input {
    flex: 1; min-width: 100px; padding: 0.35rem 0.5rem;
    border: 1.5px solid var(--rule); border-radius: 6px;
    font-size: 0.85rem; font-family: inherit;
  }
  .fill-blank-input:focus { outline: none; border-color: var(--accent); }
  .fill-blank-input:disabled { background: var(--bg-soft); }
  .fill-blank-input.correct { border-color: var(--green); background: var(--green-light); }
  .fill-blank-input.wrong { border-color: var(--coral); background: var(--coral-light); }
  .fill-blank-result { font-size: 0.75rem; font-weight: 600; }
  .fill-blank-result.correct { color: var(--green); }
  .fill-blank-result.wrong { color: var(--coral); }
  .fill-comparison {
    margin-top: 0.5rem; border: 1px solid var(--rule);
    border-radius: 8px; overflow: hidden; font-size: 0.78rem;
  }
  .fill-comp-row {
    display: flex; gap: 0.3rem; padding: 0.3rem 0.5rem;
    border-bottom: 1px solid var(--rule); align-items: center;
  }
  .fill-comp-row:last-child { border-bottom: none; }
  .fill-comp-row.quiz-header { background: var(--bg-soft); font-weight: 600; font-size: 0.72rem; color: var(--muted); }
  .fill-comp-cell { flex: 1; }
  .fill-comp-cell.idx { max-width: 40px; }

  /* Textarea (calculate/shortAnswer/essay/proof) */
  .answer-textarea {
    width: 100%; min-height: 80px; padding: 0.5rem 0.7rem;
    border: 1.5px solid var(--rule); border-radius: 8px;
    font-size: 0.85rem; font-family: inherit; line-height: 1.6;
    resize: vertical; transition: border-color 0.2s;
  }
  .answer-textarea.lg { min-height: 120px; }
  .answer-textarea.xl { min-height: 140px; }
  .answer-textarea:focus { outline: none; border-color: var(--accent); }
  .answer-textarea:disabled { background: var(--bg-soft); color: var(--muted); }

  /* Method box (proof) */
  .method-box {
    margin-bottom: 0.6rem; padding: 0.5rem 0.7rem;
    background: rgba(59,130,246,0.06); border-radius: 8px;
    border: 1px solid rgba(59,130,246,0.2);
  }
  .method-label { font-size: 0.78rem; color: var(--accent); font-weight: 600; }
  .method-hint { font-size: 0.73rem; color: var(--muted); margin-top: 0.2rem; }

  /* Symbol palette */
  .symbol-toggle {
    font-size: 0.73rem; color: var(--muted); cursor: pointer;
    margin-top: 0.3rem; display: inline-block;
  }
  .symbol-palette {
    display: flex; flex-wrap: wrap; gap: 0.25rem;
    margin-top: 0.4rem; padding: 0.4rem;
    background: var(--bg-soft); border-radius: 6px;
  }
  .symbol-btn {
    padding: 0.15rem 0.4rem; border: 1px solid var(--rule);
    border-radius: 4px; background: #fff; font-size: 0.78rem; cursor: pointer;
  }
  .symbol-btn:hover { background: rgba(59,130,246,0.1); }

  /* Submit */
  .submit-row {
    display: flex; gap: 0.4rem; align-items: center;
    margin-top: 0.5rem; justify-content: flex-end;
  }
  .submit-btn {
    padding: 0.4rem 1.2rem; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn.done { background: var(--muted); cursor: default; }

  /* Score result */
  .score-result { margin-top: 0.6rem; display: none; }
  .score-result.zk-show { display: block; }
  .score-header {
    display: flex; align-items: center; gap: 0.4rem;
    margin-bottom: 0.5rem; flex-wrap: wrap;
  }
  .score-badge {
    padding: 0.25rem 0.7rem; border-radius: 8px;
    font-size: 0.78rem; font-weight: 700;
  }
  .score-badge.mastered { background: var(--green-light); color: var(--green); }
  .score-badge.unsure { background: var(--amber-light); color: #92400e; }
  .score-badge.unknown { background: var(--coral-light); color: var(--coral); }
  .score-detail { font-size: 0.76rem; color: var(--muted); }

  /* Points/steps list */
  .points-list {
    list-style: none; padding: 0; margin: 0 0 0.5rem 0;
    border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  }
  .point-item {
    display: flex; align-items: flex-start; gap: 0.4rem;
    padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--rule);
    font-size: 0.8rem; line-height: 1.5;
  }
  .point-item:last-child { border-bottom: none; }
  .point-item.hit { background: var(--green-light); }
  .point-item.miss { background: #fff; }
  .point-icon { font-size: 0.95rem; flex-shrink: 0; margin-top: 1px; }
  .point-text { flex: 1; }
  .point-label { font-weight: 600; }
  .point-synonyms { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .point-synonyms .match { color: var(--green); font-weight: 600; }
  .point-desc { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

  /* Reference answer */
  .reference-answer {
    margin-top: 0.5rem; padding: 0.6rem;
    background: var(--bg-soft); border-radius: 8px;
    border-left: 3px solid var(--accent);
    font-size: 0.82rem; line-height: 1.7; display: none;
  }
  .reference-answer.zk-show { display: block; }
  .reference-label { font-weight: 700; font-size: 0.75rem; color: var(--accent); margin-bottom: 0.2rem; }
  .proof-step { padding: 0.15rem 0 0.15rem 0.4rem; border-left: 2px solid var(--rule); margin: 0.15rem 0; }

  /* Formula/steps (calculate) */
  .calc-formula {
    padding: 0.4rem 0.6rem; background: rgba(16,185,129,0.08);
    border-radius: 6px; border-left: 3px solid var(--green);
    font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem;
  }
  .calc-steps {
    list-style: decimal inside; padding: 0.3rem 0.6rem;
    font-size: 0.8rem; line-height: 1.8; margin-bottom: 0.3rem;
  }
  .calc-answer {
    display: inline-block; padding: 0.3rem 0.6rem;
    background: var(--amber-light); border-radius: 6px;
    font-size: 0.82rem; font-weight: 700; color: #92400e;
  }

  /* Self-eval */
  .self-eval {
    margin-top: 0.6rem; padding: 0.5rem 0.7rem;
    background: rgba(139,92,246,0.06); border-radius: 8px; display: none;
  }
  .self-eval.zk-show { display: block; }
  .self-eval-label { font-size: 0.75rem; color: var(--accent2); margin-bottom: 0.3rem; font-weight: 600; }
  .self-eval-buttons { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .self-eval-btn {
    padding: 0.3rem 0.7rem; border: 1.5px solid var(--rule);
    border-radius: 8px; background: #fff; font-size: 0.75rem;
    cursor: pointer; transition: all 0.2s;
  }
  .self-eval-btn:hover { border-color: var(--accent2); }
  .self-eval-btn.quiz-selected { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 0.85rem; }

  /* AI question actions */
  .ai-card-actions {
    display: flex; gap: 6px; align-items: center;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--rule);
  }
  .ai-badge {
    font-size: 0.68rem; color: var(--accent2); font-weight: 600;
    padding: 2px 8px; background: #f5f3ff; border-radius: 4px;
  }
  .ai-action-btn {
    padding: 3px 12px; font-size: 0.75rem; border-radius: 6px;
    cursor: pointer; transition: all 0.15s; border: 1px solid;
  }
  .ai-action-bookmark { border-color: #d1fae5; background: #f0fdf4; color: #059669; }
  .ai-action-bookmark:hover { background: #d1fae5; }
  .ai-action-bookmark.done { opacity: 0.5; cursor: default; }
  .ai-action-delete { border-color: #fee2e2; background: #fef2f2; color: var(--coral); margin-left: auto; }
  .ai-action-delete:hover { background: #fee2e2; }

  /* Generic card badge row (shared by AI and weak modes) */
  .card-badge-row {
    display: flex; gap: 6px; align-items: center;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--rule);
  }
  .card-badge {
    font-size: 0.68rem; font-weight: 600;
    padding: 2px 8px; border-radius: 4px;
  }
  .card-badge.ai { background: #f5f3ff; color: var(--accent2); }
  .card-badge.weak { background: #fef2f2; color: var(--coral); }

  /* Mobile: control bar wraps, mode buttons scroll horizontally */
  @media (max-width: 480px) {
    .quiz-controlbar { padding: 0.3rem 0.4rem; }
    .quiz-mode-group {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 4px; justify-content: flex-start;
    }
    .mode-btn { flex-shrink: 0; }
    .quiz-stats-mini .pill { font-size: 0.68rem; padding: 2px 6px; }
    .quiz-topbar h1 { font-size: 1rem; }
  }

  /* 单题AI助手样式 */
  .ai-help-btn {
    padding: 0.4rem 1rem; border: 1px solid var(--accent2); border-radius: 8px;
    background: #fff; color: var(--accent2); font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .ai-help-btn:hover { background: var(--accent2); color: #fff; }
  .ai-help-btn.active { background: var(--accent2); color: #fff; }
  .ai-help-panel {
    margin-top: 0.6rem; border: 1px solid var(--rule); border-radius: 10px;
    background: var(--bg2); overflow: hidden; display: none;
  }
  .ai-help-panel.zk-show { display: flex; flex-direction: column; }
  .ai-help-messages {
    max-height: 300px; overflow-y: auto; padding: 0.6rem;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .ai-msg {
    max-width: 85%; padding: 0.5rem 0.8rem; border-radius: 10px;
    font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .ai-msg.user {
    align-self: flex-end; background: var(--accent); color: #fff;
  }
  .ai-msg.assistant {
    align-self: flex-start; background: #fff; border: 1px solid var(--rule);
  }
  .ai-msg.loading {
    align-self: flex-start; background: #fff; border: 1px solid var(--rule);
    color: var(--muted); font-style: italic;
  }
  .ai-help-input-row {
    display: flex; gap: 0.4rem; padding: 0.5rem; border-top: 1px solid var(--rule);
    background: #fff;
  }
  .ai-help-input {
    flex: 1; padding: 0.4rem 0.6rem; border: 1px solid var(--rule);
    border-radius: 8px; font-size: 0.82rem; outline: none;
  }
  .ai-help-input:focus { border-color: var(--accent2); }
  .ai-help-send {
    padding: 0.4rem 0.8rem; border: none; border-radius: 8px;
    background: var(--accent2); color: #fff; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .ai-help-send:hover { opacity: 0.9; }
  .ai-help-send:disabled { background: var(--muted); cursor: not-allowed; }
</style>
</head>
<body>
<div class="quiz-container">
  <div class="quiz-topbar">
    <div class="quiz-topbar-left">
      <h1 id="pageTitle">练习测验</h1>
      <span class="subject-tag" id="subjectTag">科目</span>
    </div>
    <div class="quiz-stats-mini" id="statsMini">
      <span class="pill mastered"><span class="dot"></span>已掌握 <span id="statMastered">0</span></span>
      <span class="pill unsure"><span class="dot"></span>不熟练 <span id="statUnsure">0</span></span>
      <span class="pill unknown"><span class="dot"></span>不会 <span id="statUnknown">0</span></span>
    </div>
  </div>
  <div class="qf-bar" id="filterBar">
    <select class="qf-select qf-kp" id="kpFilter" onchange="switchKp(this.value)"><option value="all">📚 知识点：全部</option></select>
    <span class="qf-sep">·</span>
    <select class="qf-select qf-type" id="typeFilter" onchange="switchType(this.value)"><option value="all">📝 题型：全部</option></select>
    <span class="qf-sep">·</span>
    <select class="qf-select qf-status" id="statusFilter" onchange="switchStatus(this.value)"><option value="all">📊 状态：全部</option></select>
    <span class="qf-count" id="filterCount">显示 0 题</span>
  </div>
  <div class="quiz-controlbar" id="actionBar">
    <button class="mode-btn" id="todayBtn" onclick="activateToday()">📅 今日任务</button>
    <span class="qf-sep">·</span>
    <button class="mode-btn ai" id="aiBtn" onclick="switchMode('ai')">🤖 AI出题</button>
    <span class="qf-hint" id="todayHint"></span>
  </div>
  <div class="mode-hint" id="modeHint"></div>
  <div class="session-bar" id="sessionBar" style="display:none;">

// 知识框架 JSON 转换为卡片数组（统一数据源，不再依赖 recite-cards）
function transformKfToCards(data) {
  var cards = [];
  if (!data || !data.chapters) return cards;
  data.chapters.forEach(function(ch) {
    var chName = ch.name || ch.title || ('第' + (ch.id || '?') + '章');
    var sections = ch.sections || [];
    for (var si = 0; si < sections.length; si++) {
      var s = sections[si];
      if (s.type === '核心概念') {
        var concepts = s.coreConcepts || s.items || [];
        concepts.forEach(function(c) {
          var term = c.term || '';
          if (!term) return;
          var defParts = [];
          if (c.summary) defParts.push(c.summary);
          if (c.points && c.points.length) {
            c.points.forEach(function(p) { defParts.push('• ' + p); });
          }
          var card = {
            term: term,
            chapter: chName,
            question: '什么是' + term + '？',
            def: defParts.join('\n'),
            ex: c.ex || '',
            exam: c.exam || '',
            hint: c.hint || '',
            cardType: c.cardType || 'memory'
          };
          if (c.formula) card.formula = c.formula;
          if (c.steps) card.steps = c.steps;
          if (c.answer) card.answer = c.answer;
          if (c.answerAliases) card.answerAliases = c.answerAliases;
          cards.push(card);
        });
      } else if (s.type === '必会公式') {
        var formulas = s.items || s.points || [];
        formulas.forEach(function(f) {
          var formulaText = typeof f === 'string' ? f : (f.term || f.point || '');
          if (!formulaText) return;
          var colonIdx = formulaText.indexOf('：');
          var title = colonIdx > 0 ? formulaText.substring(0, colonIdx) : formulaText.substring(0, 10);
          var content = colonIdx > 0 ? formulaText.substring(colonIdx + 1) : formulaText;
          cards.push({
            term: title,
            chapter: chName,
            question: title + '的公式是什么？',
            def: content,
            ex: '',
            exam: '',
            hint: '',
            cardType: 'calculation'
          });
        });
      }
    }
  });
  return cards;
}

function normalize(str) {
  if (!str) return '';
  return str.replace(/\s+/g, '').replace(/[，。、；：""''（）\(\)\[\]\{\}]/g, '').toLowerCase();
}

function getLevel(score, total, passThreshold) {
  if (score >= passThreshold) return 'mastered';
  if (score >= Math.ceil(passThreshold * 0.5)) return 'unsure';
  return 'unknown';
}

function levelText(level) {
  if (level === 'mastered') return { text: '已掌握', icon: '🟢', cls: 'mastered' };
  if (level === 'unsure') return { text: '不熟练', icon: '🟡', cls: 'unsure' };
  return { text: '不会', icon: '🔴', cls: 'unknown' };
}

function getCurrentLevel(qId) {

/* ====== SCORERS ====== */

function scoreChoice(q, userSelection) {
  var correct = q.answer;
  var isCorrect = false;
  if (q.subType === 'multi') {
    var userSet = (userSelection || '').split('').sort().join('');
    var correctSet = correct.split('').sort().join('');
    isCorrect = userSet === correctSet;
  } else {
    // 默认按单选题处理（subType 为 'single'、'judge' 或未定义）
    isCorrect = userSelection === correct;
  }
  return {
    score: isCorrect ? 1 : 0, total: 1,
    level: isCorrect ? 'mastered' : 'unknown',
    details: { isCorrect: isCorrect, userAnswer: userSelection, correctAnswer: correct }
  };
}

function scoreFill(q, userAnswers) {
  var hits = [], hitCount = 0;
  q.blanks.forEach(function(b, i) {
    var ua = normalize(userAnswers[i] || '');
    var allTerms = [b.answer].concat(b.synonyms || []);
    var matched = false;
    for (var j=0; j<allTerms.length; j++) {
      if (ua.indexOf(normalize(allTerms[j])) >= 0) { matched = true; break; }
    }
    hits.push({ idx: i, userAnswer: userAnswers[i]||'', correctAnswer: b.answer, matched: matched });
    if (matched) hitCount++;
  });
  var threshold = Math.ceil(q.blanks.length * 0.6);
  return {
    score: hitCount, total: q.blanks.length,
    level: getLevel(hitCount, q.blanks.length, threshold),
    details: { hits: hits }
  };
}

function scoreCalculate(q, userAnswer) {
  var normUser = normalize(userAnswer);
  var allTerms = [q.answer].concat(q.answerAliases || []);
  var matched = false;
  for (var i=0; i<allTerms.length; i++) {
    var normTerm = normalize(allTerms[i]);
    if (!normTerm) continue;
    if (normUser === normTerm || normUser.indexOf(normTerm) >= 0 || normTerm.indexOf(normUser) >= 0) { matched = true; break; }
  }
  return {
    score: matched ? 1 : 0, total: 1,
    level: matched ? 'mastered' : 'unknown',
    details: { isCorrect: matched }
  };
}

function scorePointsBased(q, userAnswer) {
  var normUser = normalize(userAnswer);
  var hits = [], totalWeight = 0, hitWeight = 0;
  (q.points || []).forEach(function(p) {
    totalWeight += p.weight || 1;
    var allTerms = [p.point].concat(p.synonyms || []);
    var matched = false, matchedTerm = null;
    for (var i=0; i<allTerms.length; i++) {
      if (normUser.indexOf(normalize(allTerms[i])) >= 0) { matched = true; matchedTerm = allTerms[i]; break; }
    }
    hits.push({ point: p.point, synonyms: p.synonyms||[], matched: matched, matchedTerm: matchedTerm, weight: p.weight||1 });
    if (matched) hitWeight += (p.weight||1);
  });
  return {
    score: hitWeight, total: totalWeight,
    level: getLevel(hitWeight, totalWeight, q.passThreshold || Math.ceil(totalWeight*0.6)),
    details: { hits: hits }
  };
}

function scoreProof(q, userAnswer) {
  var normUser = normalize(userAnswer);
  var hits = [], hitCount = 0;
  (q.steps || []).forEach(function(s) {
    var matched = false, matchedTerm = null;
    for (var i=0; i<(s.keywords||[]).length; i++) {
      if (normUser.indexOf(normalize(s.keywords[i])) >= 0) { matched = true; matchedTerm = s.keywords[i]; break; }
    }
    hits.push({ desc: s.desc, keywords: s.keywords||[], matched: matched, matchedTerm: matchedTerm, hint: s.hint||'' });
    if (matched) hitCount++;
  });
  return {
    score: hitCount, total: (q.steps||[]).length,
    level: getLevel(hitCount, (q.steps||[]).length, q.passThreshold || Math.ceil((q.steps||[]).length*0.6)),
    details: { hits: hits }
  };
}

function scoreQuestion(q, userAnswer, userSelection) {
  switch(q.type) {
    case 'choice': return scoreChoice(q, userSelection);
    case 'fill': return scoreFill(q, userAnswer);
    case 'calculate': return scoreCalculate(q, userAnswer);
    case 'shortAnswer':
    case 'essay': return scorePointsBased(q, userAnswer);
    case 'proof': return scoreProof(q, userAnswer);
    default: return { score:0, total:1, level:'unknown', details:{} };
  }
}

function renderReference(label, content, isProof) {
  if (!content) return '';
  var html = '<div class="reference-answer zk-show"><div class="reference-label">'+label+'</div>';
  if (isProof && Array.isArray(content)) {
    html += content.map(function(line) {
      if (line === '') return '<br>';
      if (line.indexOf('步骤') >= 0 || line.indexOf('结论') >= 0) return '<div class="proof-step">'+esc(line)+'</div>';
      return '<div>'+esc(line)+'</div>';
    }).join('');
  } else {
    html += esc(content);
  }
  html += '</div>';
  return html;
}

function renderChoiceCard(q) {
  var r = results[q.id];

  var optionsHTML = q.options.map(function(opt, i) {
    var letter = letters[i];
    var cls = '';
    if (r) {
      cls += ' disabled';
      var userSel = (r.details && r.details.userAnswer) || '';
      var correctAns = (r.details && r.details.correctAnswer) || '';
      if (correctAns.indexOf(letter) >= 0) cls += ' correct';
      else if (userSel.indexOf(letter) >= 0) cls += ' wrong';
      else if (userSel.indexOf(letter) >= 0 && correctAns.indexOf(letter) < 0) cls += ' wrong';
    }
    return '<div class="choice-option'+cls+'" data-letter="'+letter+'" data-qid="'+q.id+'">' +

  }).join('');

        : '';
      return '<li class="point-item '+(h.matched?'hit':'miss')+'">' +

function renderCard(q) {
  switch(q.type) {
    case 'choice': return renderChoiceCard(q);
    case 'fill': return renderFillCard(q);
    case 'calculate': return renderCalculateCard(q);
    case 'shortAnswer': return renderShortAnswerCard(q);
    case 'essay': return renderEssayCard(q);
    case 'proof': return renderProofCard(q);
    default: return '<div class="quiz-card">未知题型: '+q.type+'</div>';
  }
}

/* ====== SUBMIT HANDLERS ====== */

window.choiceSelections = {};

function toggleChoiceOption(qId, letter) {
  if (results[qId]) return;
  var q = quizData.find(function(x){return x.id===qId;}) || aiQuizData.find(function(x){return x.id===qId;});
  if (!q) return;
  if (q.subType === 'multi') {
    var sel = window.choiceSelections[qId] || '';
    var idx = sel.indexOf(letter);
    if (idx >= 0) sel = sel.replace(letter, '');
    else sel += letter;
    window.choiceSelections[qId] = sel;
  } else {
    window.choiceSelections[qId] = letter;
  }
  document.querySelectorAll('#card-'+qId+' .choice-option').forEach(function(el) {
    var l = el.dataset.letter;
    var selected = (window.choiceSelections[qId] || '').indexOf(l) >= 0;
    el.classList.toggle('quiz-selected', selected);
  });
}

function submitChoice(qId) {
  if (results[qId]) return;
  var q = quizData.find(function(x){return x.id===qId;}) || aiQuizData.find(function(x){return x.id===qId;});
  if (!q) return;
  var sel = window.choiceSelections[qId] || '';
  if (!sel) { alert('请先选择答案'); return; }
  var result = scoreChoice(q, sel);
  results[qId] = { score: result.score, total: result.total, level: result.level, details: result.details, selfOverride: null };
  updateMastery(q.chapter, result.level);
  saveQuizRecord(q, null, sel, result);
  updateStats(); render();
}

function submitFill(qId) {
  if (results[qId]) return;
  var q = quizData.find(function(x){return x.id===qId;}) || aiQuizData.find(function(x){return x.id===qId;});
  if (!q) return;
  var answers = q.blanks.map(function(b, i) {
    var el = document.getElementById('fill-'+qId+'-'+i);
    return el ? el.value.trim() : '';
  });
  if (answers.every(function(a){return !a;})) { alert('请先填写答案'); return; }
  var result = scoreFill(q, answers);
  results[qId] = { score: result.score, total: result.total, level: result.level, details: result.details, selfOverride: null };
  updateMastery(q.chapter, result.level);
  saveQuizRecord(q, answers.join(' | '), null, result);
  updateStats(); render();
}

function submitText(qId) {
  if (results[qId]) return;
  var q = quizData.find(function(x){return x.id===qId;}) || aiQuizData.find(function(x){return x.id===qId;});
  if (!q) return;
  var ta = document.getElementById('input-'+qId);
  if (!ta) return;
  var ans = ta.value.trim();
  if (!ans) { alert('请先输入答案'); return; }
  var result = scoreQuestion(q, ans, null);
  results[qId] = { score: result.score, total: result.total, level: result.level, details: result.details, selfOverride: null };
  updateMastery(q.chapter, result.level);
  saveQuizRecord(q, ans, null, result);
  updateStats(); render();
}

function selfEval(qId, level) {
  if (!results[qId]) return;
  results[qId].selfOverride = level;
  var q = quizData.find(function(x){return x.id===qId;}) || aiQuizData.find(function(x){return x.id===qId;});
  if (q) updateMastery(q.chapter, level);
  updateStats(); render();
}

function toggleSymbols(qId) {
  var pal = document.getElementById('sym-'+qId);
  if (pal) pal.style.display = pal.style.display === 'none' ? '' : 'none';
}

function insertSymbol(qId, sym) {
  var ta = document.getElementById('input-'+qId);
  if (!ta || ta.disabled) return;
  var s = ta.selectionStart || 0, e = ta.selectionEnd || 0;
  ta.value = ta.value.substring(0, s) + sym + ta.value.substring(e);
  ta.selectionStart = ta.selectionEnd = s + sym.length;
  ta.focus();
}

/* ====== RENDER ====== */

function renderTypeFilter() {
  var config = SUBJECT_CONFIG[currentSubject];
  if (!config) return;
  var availableTypes = {};
  var source = currentMode === 'ai' ? aiQuizData : quizData;
  source.forEach(function(q) { if (q.type) availableTypes[q.type] = (availableTypes[q.type]||0)+1; });
  var filter = document.getElementById('typeFilter');
  if (!filter) return;
  var html = '<option value="all"'+(currentTypeFilter==='all'?' selected':'')+'>📝 题型：全部 ('+source.length+')</option>';
  config.types.forEach(function(t) {
    if (!availableTypes[t]) return;
    var meta = TYPE_META[t];
    if (meta) html += '<option value="'+t+'"'+(currentTypeFilter===t?' selected':'')+'>'+meta.icon+' '+meta.label+' ('+availableTypes[t]+')</option>';
  });
  filter.innerHTML = html;
}

/* 知识点筛选：从 quizData 提取 cardId 去重 */
function renderKpFilter() {
  var kpMap = {};
  var source = currentMode === 'ai' ? aiQuizData : quizData;
  source.forEach(function(q) {
    var kp = q.cardId || '';
    if (kp) kpMap[kp] = (kpMap[kp]||0)+1;
  });
  var filter = document.getElementById('kpFilter');
  if (!filter) return;
  var total = source.length;
  var html = '<option value="all"'+(currentKpFilter==='all'?' selected':'')+'>📚 知识点：全部 ('+total+')</option>';
  Object.keys(kpMap).sort().forEach(function(kp) {
    html += '<option value="'+kp+'"'+(currentKpFilter===kp?' selected':'')+'>'+kp+' ('+kpMap[kp]+')</option>';
  });
  filter.innerHTML = html;
}

/* 状态筛选：根据答题记录分类 */
function renderStatusFilter() {
  var filter = document.getElementById('statusFilter');
  if (!filter) return;
  var source = currentMode === 'ai' ? aiQuizData : quizData;
  var undone = 0, wrong = 0, right = 0;
  source.forEach(function(q) {
    var r = results[q.id];
    if (!r) { undone++; }
    else {
      var lv = getCurrentLevel(q.id);
      if (lv === 'mastered') right++; else wrong++;
    }
  });
  var html = '<option value="all"'+(currentStatusFilter==='all'?' selected':'')+'>📊 状态：全部 ('+source.length+')</option>';
  html += '<option value="undone"'+(currentStatusFilter==='undone'?' selected':'')+'>未做 ('+undone+')</option>';
  html += '<option value="wrong"'+(currentStatusFilter==='wrong'?' selected':'')+'>做错 ('+wrong+')</option>';
  html += '<option value="right"'+(currentStatusFilter==='right'?' selected':''  )+'>做对 ('+right+')</option>';
  filter.innerHTML = html;
}

function switchKp(val) { currentKpFilter = val; renderKpFilter(); updateFilterCount(); render(); }
function switchStatus(val) { currentStatusFilter = val; renderStatusFilter(); updateFilterCount(); render(); }

/* 更新筛选计数 */
function updateFilterCount() {
  var filtered = getFilteredQuiz();
  var el = document.getElementById('filterCount');
  if (el) el.textContent = '显示 ' + filtered.length + ' 题';
}

/* 三层筛选：知识点 + 题型 + 状态 */
function getFilteredQuiz() {
  var source = currentMode === 'ai' ? aiQuizData : quizData;
  return source.filter(function(q) {
    /* 知识点筛选 */
    if (currentKpFilter !== 'all') {
      if ((q.cardId || '') !== currentKpFilter) return false;
    }
    /* 题型筛选 */
    if (currentTypeFilter !== 'all') {
      if (q.type !== currentTypeFilter) return false;
    }
    /* 状态筛选 */
    if (currentStatusFilter !== 'all') {
      var r = results[q.id];
      if (currentStatusFilter === 'undone' && r) return false;
      if (currentStatusFilter === 'wrong' && (!r || getCurrentLevel(q.id) === 'mastered')) return false;
      if (currentStatusFilter === 'right' && (!r || getCurrentLevel(q.id) !== 'mastered')) return false;
    }
    return true;
  });
}

/* 判断题目章节是否属于本周计划 */
function isTodayChapter(ch) {
  if (!ch || todayChapters.length === 0) return false;
  return todayChapters.some(function(tc) { return ch === tc || ch.indexOf(tc + ' ') === 0; });
}

/* 今日任务：自动筛选本周章节 */
function activateToday() {
  currentMode = 'today';
  var kpFilter = document.getElementById('kpFilter');
  if (!kpFilter) return;
  /* 从 quizData 中找出属于今日章节的 cardId */
  var todayKps = {};
  quizData.forEach(function(q) {
    if (isTodayChapter(q.chapter) && q.cardId) todayKps[q.cardId] = true;
  });
  var todayList = Object.keys(todayKps);
  if (todayList.length === 1) {
    currentKpFilter = todayList[0];
  } else {
    currentKpFilter = 'all';
  }
  /* 更新今日按钮状态 */
  var todayBtn = document.getElementById('todayBtn');
  var aiBtn = document.getElementById('aiBtn');
  if (todayBtn) todayBtn.classList.add('zk-active');
  if (aiBtn) aiBtn.classList.remove('zk-active');
  /* 显示提示 */
  var hint = document.getElementById('todayHint');
  if (hint) {
    var chLabel = todayChapters.length > 0 ? todayChapters.join('、') : '未加载';
    hint.textContent = '本周计划：' + chLabel;
  }
  renderKpFilter(); renderTypeFilter(); renderStatusFilter(); updateFilterCount(); render();
}

function updateSessionAndStats(filtered) {
  var answered = 0, correct = 0, wrong = 0;
  filtered.forEach(function(q) {
    if (results[q.id]) {
      answered++;
      var lv = getCurrentLevel(q.id);
      if (lv === 'mastered') correct++; else wrong++;
    }
  });
  var bar = document.getElementById('sessionBar');
  if (bar) {
    bar.style.display = filtered.length > 0 ? 'flex' : 'none';
    document.getElementById('sessionAnswered').textContent = answered;
    document.getElementById('sessionTotal').textContent = filtered.length;
    document.getElementById('sessionFill').style.width = (answered / filtered.length * 100) + '%';
    var rate = answered > 0 ? Math.round(correct / answered * 100) : 0;
    document.getElementById('sessionRate').textContent = answered > 0 ? '✅' + correct + ' ❌' + wrong + ' · ' + rate + '%' : '';
  }
}

/* ====== 单题AI助手 ====== */
var aiHelpHistory = {}; /* 按题目ID存储对话历史 */

/* 切换AI助手面板显示 */
function toggleAIHelp(qId) {
  var panel = document.getElementById('ai-help-' + qId);
  if (!panel) {
    /* 面板不存在，创建并插入到卡片末尾 */
    var card = document.getElementById('card-' + qId);
    if (!card) return;
    panel = document.createElement('div');
    panel.className = 'ai-help-panel zk-show';
    panel.id = 'ai-help-' + qId;
    panel.innerHTML = renderAIHelpPanel(qId);
    card.appendChild(panel);
    /* 聚焦输入框 */
    var input = panel.querySelector('.ai-help-input');
    if (input) input.focus();
  } else {
    panel.classList.toggle('zk-show');
  }
}

/* 渲染AI助手面板内容 */
function renderAIHelpPanel(qId) {
  var history = aiHelpHistory[qId] || [];
  var msgsHTML = history.map(function(m) {
    return '<div class="ai-msg '+m.role+'">'+esc(m.content)+'</div>';
  }).join('');
  if (msgsHTML === '') {
    msgsHTML = '<div class="ai-msg assistant">你好！我是AI学习助手，关于这道题有什么疑问尽管问我。可以问"这道题考什么知识点"、"这道题怎么解"等。</div>';
  }
  return '<div class="ai-help-messages" id="ai-msgs-'+qId+'">'+msgsHTML+'</div>' +
    '<div class="ai-help-input-row">' +
    '<input type="text" class="ai-help-input" id="ai-input-'+qId+'" placeholder="输入你的问题..." onkeydown="if(event.key===\'Enter\')sendAIHelp(\''+qId+'\')">' +
    '<button class="ai-help-send" id="ai-send-'+qId+'" onclick="sendAIHelp(\''+qId+'\')">发送</button>' +
    '</div>';
}

/* 发送问题给AI */
function sendAIHelp(qId) {
  var input = document.getElementById('ai-input-' + qId);
  if (!input) return;
  var question = input.value.trim();
  if (!question) return;

  /* 初始化对话历史 */
  if (!aiHelpHistory[qId]) aiHelpHistory[qId] = [];

  /* 添加用户消息 */
  aiHelpHistory[qId].push({ role: 'user', content: question });
  input.value = '';
  input.disabled = true;
  var sendBtn = document.getElementById('ai-send-' + qId);
  if (sendBtn) sendBtn.disabled = true;

  /* 渲染用户消息 + loading */
  var msgs = document.getElementById('ai-msgs-' + qId);
  if (msgs) {
    msgs.innerHTML += '<div class="ai-msg user">'+esc(question)+'</div>';
    msgs.innerHTML += '<div class="ai-msg loading" id="ai-loading-'+qId+'">AI正在思考...</div>';
    msgs.scrollTop = msgs.scrollHeight;
  }

  /* 构造题目上下文 */
  var allQuestions = quizData.concat(aiQuizData);
  var q = allQuestions.find(function(x) { return x.id === qId; });
  var questionContext = '';
  if (q) {
    questionContext = '当前题目信息：\n';
    questionContext += '科目：' + (SUBJECT_CONFIG[currentSubject] ? SUBJECT_CONFIG[currentSubject].name : '') + '\n';
    questionContext += '章节：' + (q.chapter || '') + '\n';
    questionContext += '题型：' + (TYPE_META[q.type] ? TYPE_META[q.type].label : q.type) + '\n';
    questionContext += '题目：' + (q.question || q.text || '') + '\n';
    if (q.options) questionContext += '选项：' + q.options.map(function(o,i){return 'ABCDEFGH'[i]+'.'+o;}).join('  ') + '\n';
    if (q.answer) questionContext += '正确答案：' + q.answer + '\n';
    if (q.formula) questionContext += '公式：' + q.formula + '\n';
    if (q.steps) questionContext += '解题步骤：' + q.steps.join(' → ') + '\n';
    if (q.blanks) questionContext += '填空答案：' + q.blanks.map(function(b){return b.answer;}).join('、') + '\n';
    if (q.referenceAnswer) questionContext += '参考答案：' + q.referenceAnswer + '\n';
    if (q.explanation) questionContext += '解析：' + q.explanation + '\n';
  }

  /* 构造消息列表 */
  var messages = [{ role: 'system', content: '你是一个专业的学习助手。用户正在做练习题，请基于题目内容回答用户的疑问。要求：1.解答清晰易懂 2.给出涉及的知识点 3.不要直接给出答案，引导用户思考（除非用户明确要求看答案）\n\n' + questionContext }];
  aiHelpHistory[qId].forEach(function(m) {
    messages.push({ role: m.role, content: m.content });
  });

  /* 调用AI */
  fetch(apiUrl('/api/chat'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: messages,
      stream: false,
      max_tokens: 1500
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var content = '';
    if (data.choices && data.choices[0]) {
      content = data.choices[0].message.content;
    } else if (data.content) {
      content = data.content;
    } else if (typeof data === 'string') {
      content = data;
    }
    /* 移除loading */
    var loading = document.getElementById('ai-loading-' + qId);
    if (loading) loading.remove();
    /* 添加AI回复 */
    aiHelpHistory[qId].push({ role: 'assistant', content: content });
    if (msgs) {
      msgs.innerHTML += '<div class="ai-msg assistant">'+esc(content)+'</div>';
      msgs.scrollTop = msgs.scrollHeight;
    }
    input.disabled = false;
    if (sendBtn) sendBtn.disabled = false;
    input.focus();
  })
  .catch(function(err) {
    var loading = document.getElementById('ai-loading-' + qId);
    if (loading) loading.remove();
    if (msgs) {
      msgs.innerHTML += '<div class="ai-msg assistant" style="color:var(--coral);">⚠️ 请求失败：'+esc(err.message||'网络错误')+'，请重试</div>';
      msgs.scrollTop = msgs.scrollHeight;
    }
    input.disabled = false;
    if (sendBtn) sendBtn.disabled = false;
    input.focus();
  });
}

function renderCardWithAIActions(q) {
  var html = renderCard(q);
  if (q.src === 'ai') {
    var bookmarked = q._bookmarked ? ' done' : '';
    var bookmarkText = q._bookmarked ? '⭐ 已收藏' : '⭐ 收藏';
    var cardBadge = q.cardId ? 'AI生成 · 来源：卡片' + q.cardId : 'AI生成';
    var actions = '<div class="card-badge-row">' +
      '<span class="card-badge ai">🤖 ' + cardBadge + '</span>' +
      '<button class="ai-action-btn ai-action-bookmark' + bookmarked + '" onclick="bookmarkAIQuestion(\'' + q.id + '\')"' + (q._bookmarked ? ' disabled' : '') + '>' + bookmarkText + '</button>' +
      '<button class="ai-action-btn ai-action-delete" onclick="deleteAIQuestion(\'' + q.id + '\')">🗑️ 删除</button>' +
      '</div>';
    var pos = html.lastIndexOf('</div>');
    if (pos !== -1) html = html.substring(0, pos) + actions + '</div>';
  }
  return html;
}

function bookmarkAIQuestion(qId) {
  var q = aiQuizData.find(function(x) { return x.id === qId; });
  if (!q || q._bookmarked) return;
  fetch(apiUrl('/api/quiz-bank?subject=' + currentSubject), { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(bank) {
      bank = Array.isArray(bank) ? bank : [];
      var clean = JSON.parse(JSON.stringify(q));
      delete clean._bookmarked;
      clean.id = 'bk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      clean.src = 'ai-bookmarked';
      bank.push(clean);
      return fetch(apiUrl('/api/quiz-bank'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject: currentSubject, data: bank })
      });
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      q._bookmarked = true;
      render();
    })
    .catch(function(err) {
      alert('收藏失败：' + (err.message || '网络错误'));
    });
}

function deleteAIQuestion(qId) {
  aiQuizData = aiQuizData.filter(function(q) { return q.id !== qId; });
  delete results[qId];
  render();
}

function render() {
  var list = document.getElementById('quizList');
  var filtered;

  /* AI出题模式 */
  if (currentMode === 'ai') {
    if (aiLoading) {
      list.innerHTML = '<div style="text-align:center;padding:40px 20px;">' +
        '<div style="width:36px;height:36px;border:3px solid #c4b5fd;border-top-color:#8b5cf6;border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite;"></div>' +
        '<div style="font-size:14px;color:#8b5cf6;font-weight:600;">AI正在出题...</div>' +
        '<div style="font-size:12px;color:#a78bfa;margin-top:4px;">正在分析背诵卡内容 · 生成5道结构化题目</div>' +
        '</div>';
      var sb0 = document.getElementById('sessionBar');
      if (sb0) sb0.style.display = 'none';
      return;
    }
    if (aiQuizData.length === 0) {
      var chapterInfo = todayChapters.length > 0 ? '本周章节：' + todayChapters.join('、') : '全部章节';
      list.innerHTML = '<div class="empty-state">' +
        '<div style="font-size:14px;color:#8b5cf6;font-weight:600;margin-bottom:6px;">🤖 AI出题</div>' +
        '<div style="font-size:12px;color:#64748b;margin-bottom:14px;">' + chapterInfo + ' · 根据背诵卡内容生成5道题</div>' +
        '<button onclick="generateAIQuestions()" style="padding:10px 24px;border-radius:8px;border:1px solid #c4b5fd;background:#f5f3ff;color:#8b5cf6;font-weight:600;font-size:14px;cursor:pointer;">🤖 生成5道题</button>' +
        '</div>';
      var sb1 = document.getElementById('sessionBar');
      if (sb1) sb1.style.display = 'none';
      return;
    }
    filtered = getFilteredQuiz();
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">该筛选条件下暂无AI题目</div>';
      var sb2 = document.getElementById('sessionBar');
      if (sb2) sb2.style.display = 'none';
      return;
    }
    list.innerHTML = filtered.map(renderCardWithAIActions).join('');
    updateSessionAndStats(filtered);
    return;
  }

  /* 三层筛选：知识点 + 题型 + 状态 */
  filtered = getFilteredQuiz();
  /* URL参数过滤（从背诵卡跳转） */
  if (chapterParam) filtered = filtered.filter(function(q) { return q.chapter === chapterParam; });
  if (questionIdParam) filtered = filtered.filter(function(q) { return q.id === questionIdParam; });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">该筛选条件下暂无题目</div>';
    var sb = document.getElementById('sessionBar');
    if (sb) sb.style.display = 'none';
    return;
  }
  list.innerHTML = filtered.map(renderCard).join('');
  updateSessionAndStats(filtered);
  if (Object.keys(window.choiceSelections).length > 0) {
    Object.keys(window.choiceSelections).forEach(function(qId) {
      var sel = window.choiceSelections[qId] || '';
      document.querySelectorAll('#card-'+qId+' .choice-option').forEach(function(el) {
        var l = el.dataset.letter;
        if (sel.indexOf(l) >= 0) el.classList.add('quiz-selected');
      });
    });
  }
}

function switchType(type) {
  currentTypeFilter = type;
  renderTypeFilter();
  updateFilterCount();
  render();
}


/* ====== MODE / STUDY PLAN ====== */

function loadStudyPlan(callback) {
  fetch(apiUrl('/api/study-plan'), { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var weeks = data && data.weeks ? data.weeks : [];
      var currentWeek = null;
      for (var i = 0; i < weeks.length; i++) {
        if (weeks[i].isCurrent) { currentWeek = weeks[i]; break; }
      }
      todayChapters = [];
      if (currentWeek && currentWeek.goals) {
        var subjectName = SUBJECT_NAME_MAP[currentSubject];
        for (var j = 0; j < currentWeek.goals.length; j++) {
          var g = currentWeek.goals[j];
          if (g.subject === subjectName && g.chapter) {
            todayChapters.push(g.chapter);
          }
        }
      }
      if (callback) callback();
    })
    .catch(function() {
      todayChapters = [];
      if (callback) callback();
    });
}

function getTodayFiltered() {
  if (todayChapters.length === 0) return [];
  return quizData.filter(function(q) {
    if (!q.chapter) return false;
    return todayChapters.some(function(tc) { return q.chapter === tc || q.chapter.indexOf(tc + ' ') === 0; });
  });
}

function updateModeHint() {
  var hint = document.getElementById('modeHint');
  if (!hint) return;
  if (currentMode === 'ai') {
    hint.className = 'mode-hint zk-show';
    hint.style.background = '#f5f3ff';
    hint.style.color = '#8b5cf6';
    hint.textContent = '🤖 AI出题 · 根据背诵卡内容生成5道结构化题目';
  } else {
    hint.className = 'mode-hint';
    hint.style.background = '';
    hint.style.color = '';
  }
}

function switchMode(mode) {
  if (mode !== 'ai') return;
  currentMode = 'ai';
  currentKpFilter = 'all';
  currentTypeFilter = 'all';
  currentStatusFilter = 'all';
  var todayBtn = document.getElementById('todayBtn');
  var aiBtn = document.getElementById('aiBtn');
  if (todayBtn) todayBtn.classList.remove('zk-active');
  if (aiBtn) aiBtn.classList.add('zk-active');
  renderKpFilter(); renderTypeFilter(); renderStatusFilter(); updateFilterCount();
  updateModeHint();
  updateChrome(mode);
  render();
}

function updateChrome(mode) {
  var statsMini = document.getElementById('statsMini');
  var sb = document.getElementById('sessionBar');
  if (statsMini) statsMini.style.display = (mode === 'ai' || mode === 'weak') ? 'none' : 'flex';
  if (sb) {
    if (mode === 'weak') {
      sb.style.setProperty('--session-bg', '#fef2f2');
      sb.style.setProperty('--session-color', '#dc2626');
      sb.style.setProperty('--session-track', '#fecaca');
      sb.style.setProperty('--session-fill', '#ef4444');
    } else if (mode === 'ai') {
      sb.style.setProperty('--session-bg', '#f5f3ff');
      sb.style.setProperty('--session-color', '#7c3aed');
      sb.style.setProperty('--session-track', '#ddd6fe');
      sb.style.setProperty('--session-fill', '#8b5cf6');
    } else {
      sb.style.setProperty('--session-bg', '#f0fdf4');
      sb.style.setProperty('--session-color', '#059669');
      sb.style.setProperty('--session-track', '#d1fae5');
      sb.style.setProperty('--session-fill', '#22c55e');
    }
  }
}

/* ====== AI 出题 ====== */
var aiQuizData = [];
var aiLoading = false;


function generateAIQuestions() {
  if (aiLoading) return;
  aiLoading = true;
  render();

  var subjectName = SUBJECT_CONFIG[currentSubject].name;
  var chapterList = todayChapters.length > 0 ? todayChapters.join('、') : '全部章节';

  /* 1. 从知识框架 JSON 获取知识点内容并转换为卡片 */
  var kfUrl = apiUrl('/data/knowledge-framework-' + currentSubject + '.json');
  fetch(kfUrl, { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var cards = transformKfToCards(data);
      if (cards.length === 0) {
        throw new Error('该科目暂无知识点内容，无法生成题目');
      }
      /* 筛选今日章节卡片（前缀匹配，兼容"第1章"和"第1章 标题"），或全量 */
      var targetCards = todayChapters.length > 0
        ? cards.filter(function(c) {
            return c.chapter && todayChapters.some(function(tc) { return c.chapter.indexOf(tc) >= 0; });
          })
        : cards;
      if (targetCards.length === 0) targetCards = cards.slice(0, 5);

      /* 2. 构造 prompt */
      var cardText = targetCards.slice(0, 8).map(function(c, i) {
        var parts = ['卡片' + (i+1) + '：' + (c.question || '')];
        if (c.def) parts.push('定义：' + c.def);
        if (c.ex) parts.push('举例：' + c.ex);
        if (c.exam) parts.push('考点：' + c.exam);
        if (c.formula) parts.push('公式：' + c.formula);
        if (c.steps) parts.push('步骤：' + c.steps.join('；'));
        return parts.join('\n');
      }).join('\n\n');

      var config = SUBJECT_CONFIG[currentSubject];
      var typeList = config.types.map(function(t) { return t + '(' + TYPE_META[t].label + ')'; }).join('、');
      var prompt = '你是自考出题专家。根据以下知识点生成5道练习题。\n\n' +
        '科目：' + subjectName + '\n' +
        '章节：' + chapterList + '\n' +
        '可用题型（type字段必须用英文key）：' + typeList + '\n\n' +
        '知识点内容：\n' + cardText + '\n\n' +
        '要求：\n' +
        '1. 生成5道题，题型尽量覆盖：2道选择题+1道填空题+1道计算题+1道简答题\n' +
        '2. 每题的type字段必须使用英文key：choice(选择题)、fill(填空题)、calculate(计算题)、shortAnswer(简答题)、essay(论述题)、proof(证明题)\n' +
        '3. 选择题包含options数组（4个选项）和answer（正确选项字母如A）\n' +
        '4. 填空题包含text字段（题目中用___表示空格）和blanks数组（各空答案）\n' +
        '5. 计算题包含formula、steps数组、answer和answerAliases数组\n' +
        '6. 简答题包含points数组（每项含point和synonyms）、referenceAnswer和passThreshold\n' +
        '7. 每题包含chapter、question、explanation字段\n' +
        '8. 严格返回JSON数组格式，不要有其他文字\n' +
        '9. 每题加src字段值为"ai"，cardId字段填写对应知识点卡片的序号（1、2、3...，对应上面给出的卡片编号）';

      /* 3. 调用 AI API */
      return fetch(apiUrl('/api/chat'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: prompt }],
          stream: false,
          max_tokens: 3000
        })
      });
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      /* 4. 解析 AI 返回 */
      var content = '';
      if (data.choices && data.choices[0]) {
        content = data.choices[0].message.content;
      } else if (data.content) {
        content = data.content;
      } else if (typeof data === 'string') {
        content = data;
      }

      var questions = parseAIQuestions(content);
      if (questions.length === 0) {
        throw new Error('AI返回格式解析失败，请重试');
      }

      /* 5. 标准化 type 字段 + 给每题加 id 和来源标签 */
      var TYPE_ALIAS = {
        '单选题':'choice','多选题':'choice','选择题':'choice',
        '填空题':'fill','填空':'fill',
        '计算题':'calculate','计算':'calculate',
        '简答题':'shortAnswer','简答':'shortAnswer',
        '论述题':'essay','论述':'essay',
        '证明题':'proof','证明':'proof'
      };
      questions.forEach(function(q, i) {
        if (q.type && TYPE_ALIAS[q.type]) q.type = TYPE_ALIAS[q.type];
        q.id = 'ai-' + Date.now() + '-' + i;
        q.src = 'ai';
        if (!q.cardId) q.cardId = null;
      });

      aiQuizData = questions;
      aiLoading = false;
      render();
    })
    .catch(function(err) {
      aiLoading = false;
      var list = document.getElementById('quizList');
      if (list) {
        list.innerHTML = '<div class="empty-state">⚠️ AI出题失败：' + (err.message || '网络错误') + '<br><button onclick="generateAIQuestions()" style="margin-top:8px;padding:6px 14px;border-radius:6px;border:1px solid #c4b5fd;background:#f5f3ff;color:#8b5cf6;cursor:pointer;">重试</button></div>';
      }
    });
}

function parseAIQuestions(content) {
  if (!content) return [];
  /* 尝试直接 JSON.parse */
  var text = content.trim();
  /* 去除可能的 markdown 代码块 */
  text = text.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '');
  /* 找 JSON 数组起始 */
  var start = text.indexOf('[');
  var end = text.lastIndexOf(']');
  if (start >= 0 && end > start) {
    text = text.substring(start, end + 1);
  }
  try {
    var arr = JSON.parse(text);
    if (Array.isArray(arr)) return arr;
    if (arr && typeof arr === 'object') return [arr];
  } catch(e) {}
  /* 尝试逐题提取 */
  var questions = [];
  var pattern = /\{[^{}]*\}/g;
  var match;
  while ((match = pattern.exec(text)) !== null) {
    try {
      var obj = JSON.parse(match[0]);
      if (obj.question || obj.type) questions.push(obj);
    } catch(e) {}
  }
  return questions;
}

/* ====== INIT ====== */

function init() {
  var config = SUBJECT_CONFIG[currentSubject];
  if (!config) { currentSubject = '13015'; config = SUBJECT_CONFIG[currentSubject]; }
  document.title = config.name + ' - 练习测验';
  document.getElementById('pageTitle').textContent = config.name + ' · 练习测验';
  var tag = document.getElementById('subjectTag');
  if (tag) tag.textContent = config.name;
  if (fromRecite || questionIdParam) {
    currentMode = 'free';
  }
  renderTypeFilter();
  renderKpFilter();
  renderStatusFilter();
  /* 并行加载学习计划、题库、答题记录，三者就绪后再渲染 */
  var planDone = false, bankDone = false, recordsDone = false;
  var pendingRecords = [];
  function finalize() {
    if (!planDone || !bankDone || !recordsDone) return;
    /* 题库就绪后，用 pendingRecords 重构 details */
    pendingRecords.forEach(function(rec) {
      if (!rec.questionId || results[rec.questionId]) return;
      var q = quizData.find(function(x) { return x.id === rec.questionId; });
      var details = '';
      if (q && rec.userAnswer) {
        if (q.type === 'choice') {
          details = { isCorrect: rec.isCorrect, userAnswer: rec.userAnswer, correctAnswer: q.answer || '' };
        } else if (q.type === 'fill' && q.blanks) {
          var userArr = rec.userAnswer.split(' | ');
          details = { hits: q.blanks.map(function(b, i) {
            return { idx: i, userAnswer: userArr[i] || '', correctAnswer: b.answer, matched: (userArr[i] || '').indexOf(b.answer) >= 0 };
          })};
        } else if (q.type === 'calculate') {
          details = { isCorrect: rec.isCorrect };
        } else if ((q.type === 'shortAnswer' || q.type === 'essay') && q.points) {
          details = { hits: q.points.map(function(p) {
            var matched = false; var matchedTerm = null;
            var ua = rec.userAnswer.toLowerCase();
            var candidates = [p.point].concat(p.synonyms || []);
            for (var c = 0; c < candidates.length; c++) {
              if (candidates[c] && ua.indexOf(candidates[c].toLowerCase()) >= 0) { matched = true; matchedTerm = candidates[c]; break; }
            }
            return { point: p.point, synonyms: p.synonyms || [], matched: matched, matchedTerm: matchedTerm, weight: p.weight || 1 };
          })};
        } else if (q.type === 'proof' && q.steps) {
          details = { hits: q.steps.map(function(s) {
            var matched = false; var matchedTerm = null;
            var ua = rec.userAnswer.toLowerCase();
            var keywords = s.keywords || [];
            for (var k = 0; k < keywords.length; k++) {
              if (keywords[k] && ua.indexOf(keywords[k].toLowerCase()) >= 0) { matched = true; matchedTerm = keywords[k]; break; }
            }
            return { desc: s.desc, keywords: keywords, matched: matched, matchedTerm: matchedTerm, hint: s.hint || '' };
          })};
        }
      }
      results[rec.questionId] = {
        score: rec.score || 0,
        total: rec.total || 1,
        level: rec.level || 'unknown',
        details: details,
        selfOverride: null
      };
    });
    pendingRecords = [];
    /* 初始化筛选器和今日任务 */
    renderKpFilter(); renderTypeFilter(); renderStatusFilter();
    if (currentMode !== 'free') {
      activateToday();
    } else {
      updateFilterCount();
      updateChrome(currentMode);
      render();
    }
    updateModeHint();
    if (questionIdParam) {
      setTimeout(function() {
        var card = document.getElementById('card-' + questionIdParam);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }
  }
  loadStudyPlan(function() { planDone = true; finalize(); });
  fetch(apiUrl('/api/quiz-bank?subject=' + currentSubject), { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      quizData = Array.isArray(data) ? data : [];
      bankDone = true;
      finalize();
    })
    .catch(function() {
      quizData = [];
      bankDone = true;
      finalize();
    });
  /* 加载已答题记录（先存储，等题库就绪后在 finalize 中处理） */
  fetch(apiUrl('/api/quiz-records?subject=' + currentSubject), { cache: 'no-cache' })
    .then(function(r) { return r.json(); })
    .then(function(records) {
      pendingRecords = Array.isArray(records) ? records : [];
      recordsDone = true;
      finalize();
    })
    .catch(function() {
      recordsDone = true;
      finalize();
    });
}

document.addEventListener('click', function(e) {
  var el = e.target.closest('.choice-option');
  if (el && el.dataset.qid) {
    toggleChoiceOption(el.dataset.qid, el.dataset.letter);
  }
});

init();
