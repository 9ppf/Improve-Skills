<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库</title>
  <script src="../../js/shared/theme-sync.js?v=62719872"></script>
  <link rel="stylesheet" href="../../styles/shared/base-vars.css">
  <link rel="stylesheet" href="../../styles/shared/base.css">
  <link rel="stylesheet" href="../../styles/shared/components.css">
  <link rel="stylesheet" href="../../styles/自考学习/知识库.css?v=202609230100">
</head>
<body>
<div class="kb-container">

  <!-- 顶部栏 -->
  <div class="kb-topbar">
    <a href="复盘总结-章节复盘.html" class="back-btn">←</a>
    <span class="kb-title" id="pageTitle">知识库</span>
    <span class="kb-stat"><b id="statTotal">0</b> 个知识点</span>
    <span class="kb-stat">⭐ 平均 <b id="statAvgWeight">0</b></span>
  </div>

  <!-- 筛选行 -->
  <div class="kb-filter-row">
    <select class="kb-filter kb-f-blue" id="filterChapter">
      <option value="">全部章节</option>
    </select>
    <select class="kb-filter kb-f-purple" id="filterWeight">
      <option value="">全部权重</option>
      <option value="5">⭐⭐⭐⭐⭐ 5星</option>
      <option value="4">⭐⭐⭐⭐ 4星及以上</option>
      <option value="3">⭐⭐⭐ 3星及以上</option>
      <option value="2">⭐⭐ 2星及以上</option>
      <option value="1">⭐ 1星</option>
    </select>
    <select class="kb-filter kb-f-green" id="filterSource">
      <option value="">全部来源</option>
    </select>
    <div class="kb-search-box">
      <input type="text" id="searchInput" placeholder="搜索知识点标题或内容...">
    </div>
    <span class="kb-filter-count" id="filterCount">0 条</span>
  </div>

  <!-- 知识点列表 -->
  <div class="kb-list" id="knowledgeList">
    <div class="kb-empty">加载中...</div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="kb-modal" id="editModal" style="display:none;">
    <div class="kb-modal-content">
      <div class="kb-modal-header">
        <span id="modalTitle">编辑知识点</span>
        <span class="kb-modal-close" id="modalClose">×</span>
      </div>
      <div class="kb-modal-body">
        <div class="kb-form-group">
          <label>标题</label>
          <input type="text" id="editTitle" class="kb-form-input">
        </div>
        <div class="kb-form-group">
          <label>章节</label>
          <input type="text" id="editChapter" class="kb-form-input" list="chapterList">
          <datalist id="chapterList"></datalist>
        </div>
        <div class="kb-form-group">
          <label>权重</label>
          <div class="kb-star-input" id="editStars">
            <span data-star="1">⭐</span>
            <span data-star="2">⭐</span>
            <span data-star="3">⭐</span>
            <span data-star="4">⭐</span>
            <span data-star="5">⭐</span>
          </div>
        </div>
        <div class="kb-form-group">
          <label>标签（逗号分隔）</label>
          <input type="text" id="editTags" class="kb-form-input">
        </div>
        <div class="kb-form-group">
          <label>内容</label>
          <textarea id="editContent" class="kb-form-textarea" rows="10"></textarea>
        </div>
      </div>
      <div class="kb-modal-footer">
        <button class="kb-modal-btn" id="modalCancel">取消</button>
        <button class="kb-modal-btn kb-btn-primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

</div>

<script src="../../js/shared/utils.js?v=62719872"></script>
<script src="../../js/自考学习/知识库.js?v=62719872"></script>
</body>
</html>
