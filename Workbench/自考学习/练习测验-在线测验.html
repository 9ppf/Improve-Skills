<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习测验</title>
<script src="../../js/shared/theme-sync.js"></script>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/自考学习/练习测验.css">
</head>
<body>
<div class="quiz-container">
  <div class="quiz-topbar">
    <div class="quiz-topbar-left">
      <h1 id="pageTitle">练习测验</h1>
      <span class="subject-tag" id="subjectTag">科目</span>
    </div>
    <div class="quiz-stats-mini" id="statsMini">
      <span class="pill mastered"><span class="dot"></span>已掌握 <span id="statMastered">0</span></span>
      <span class="pill unsure"><span class="dot"></span>不熟练 <span id="statUnsure">0</span></span>
      <span class="pill unknown"><span class="dot"></span>不会 <span id="statUnknown">0</span></span>
      <span class="pill sync-status" id="syncStatus" title="待同步记录数，点击立即同步" onclick="syncNow()" style="cursor:pointer;opacity:0.85;">
        <span class="dot"></span><span id="syncStatusText">同步中…</span>
      </span>
    </div>
  </div>
  <div class="qf-bar" id="filterBar">
    <select class="qf-select qf-kp" id="chapterFilter" onchange="switchChapter(this.value)"><option value="all">📖 章节：全部</option></select>
    <span class="qf-sep">·</span>
    <select class="qf-select qf-type" id="typeFilter" onchange="switchType(this.value)"><option value="all">📝 题型：全部</option></select>
    <span class="qf-sep">·</span>
    <select class="qf-select qf-status" id="statusFilter" onchange="switchStatus(this.value)"><option value="all">📊 状态：全部</option></select>
    <span class="qf-count" id="filterCount">显示 0 题</span>
  </div>
  <div class="quiz-controlbar" id="actionBar">
    <button class="mode-btn zk-seg" id="todayBtn" onclick="activateToday()">📅 今日任务</button>
    <span class="qf-sep">·</span>
    <button class="mode-btn ai zk-seg" id="aiBtn" onclick="switchMode('ai')">🤖 AI出题</button>
    <span class="qf-hint" id="todayHint"></span>
  </div>
  <div class="mode-hint" id="modeHint"></div>
  <div class="session-bar" id="sessionBar">
    <span>📊 本次进度：<b id="sessionAnswered">0</b>/<b id="sessionTotal">0</b> 题</span>
    <div class="session-track">
      <div id="sessionFill" class="session-fill"></div>
    </div>
    <span id="sessionRate"></span>
  </div>
  <div class="quiz-list" id="quizList"></div>
  <div class="quiz-guide-flow" id="guideFlow">
    <a class="quiz-guide-btn zk-btn-primary" id="guideBtn" href="#">
      ✅ 去复盘总结 →
      <div class="quiz-guide-subtext" id="guideSubText">点击查看错题和解析</div>
    </a>
  </div>
</div>

<!-- 浮动题号导航面板 -->
<div class="quiz-nav-panel collapsed" id="quizNavPanel">
  <button class="quiz-nav-collapsed-btn" onclick="toggleQuizNav()">📋</button>
</div>

  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/自考学习/练习测验.js"></script>
</body>
</html>
