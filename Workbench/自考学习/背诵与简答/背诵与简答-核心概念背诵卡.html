        { chapter: '第7章 内部排序', question: '直接选择排序和堆排序的原理是什么？', answer: '直接选择排序(Selection Sort)：\n每轮选最小元素放到已排序末尾。\n\n过程：\n① 在未排序部分找最小元素\n② 与未排序部分第一个元素交换\n③ 已排序部分扩展一位\n④ 重复\n\n时间：O(n²)（无论最好最坏）\n空间：O(1)\n稳定：否\n\n堆排序(Heap Sort)：\n利用堆的性质进行排序。\n\n堆(Heap)：完全二叉树\n- 大根堆：根≥左右孩子\n- 小根堆：根≤左右孩子\n\n堆排序步骤：\n① 建大根堆（从最后一个非叶子节点开始调整）\n② 交换堆顶(最大值)与末尾元素\n③ 堆大小减1，重新调整为堆\n④ 重复②③直到堆大小为1\n\n调整操作（向下调整/sift-down）：\n- 比较节点与左右孩子\n- 与较大的孩子交换（大根堆）\n- 递归向下调整\n\n建堆时间：O(n)\n排序时间：O(n log n)\n总时间：O(n log n)\n空间：O(1)\n稳定：否\n\n堆排序特点：最坏也是O(n log n)，适合大数据量', hint: '选择每次选最小O(n²)，堆排序建堆+反复取顶O(nlogn)', mastery: 'unknown' },
        { chapter: '第7章 内部排序', question: '归并排序和基数排序的原理是什么？', answer: '归并排序(Merge Sort)：\n将序列分成两半，分别排序后合并。\n\n过程（2路归并）：\n① 将序列分成两半\n② 递归排序左半和右半\n③ 合并两个有序序列\n\n合并操作：\n- 双指针分别指向两个序列开头\n- 比较取较小者放入结果\n- 直到某一序列取完，剩余直接复制\n\n时间：O(n log n)（始终如此）\n空间：O(n)（需要辅助数组）\n稳定：是\n\n基数排序(Radix Sort)：\n按关键字各位从低到高（或高到低）分配收集。\n\n过程（LSD最低位优先）：\n① 按个位数分配到10个桶(0-9)\n② 按桶序收集\n③ 按十位数分配\n④ 收集\n⑤ 重复直到最高位\n\n时间：O(d×(n+r))\nd=位数, r=基数(如10), n=元素数\n空间：O(n+r)\n稳定：是\n\n特点：\n- 非比较排序\n- 适合位数固定的整数\n- 空间较大但时间稳定', hint: '归并：分治+合并O(nlogn)，基数：按位分配O(d(n+r))', mastery: 'unknown' },
        { chapter: '第8章 查找', question: '什么是顺序查找和二分查找？', answer: '顺序查找(Sequential Search)：\n从头到尾逐个比较。\n\n时间：O(n)\n适用：无序表、链表\n\n二分查找(Binary Search)：\n在有序表中，每次比较中间元素，缩小一半范围。\n\n过程：\n① low=0, high=n-1\n② mid=(low+high)/2\n③ 若key==a[mid]，找到\n④ 若key<a[mid]，high=mid-1\n⑤ 若key>a[mid]，low=mid+1\n⑥ 重复直到low>high（未找到）\n\n时间：O(log n)\n空间：O(1)（迭代）/O(log n)（递归）\n适用：有序顺序表（不支持链表）\n\n注意：\n- 必须是有序表\n- 必须支持随机访问（顺序表，不能用链表）\n- ASL(平均查找长度)：\n  顺序查找：(n+1)/2\n  二分查找：log₂(n+1)-1\n\n二分查找变体：\n- 查找第一个等于key的位置\n- 查找最后一个等于key的位置\n- 查找第一个大于key的位置', hint: '顺序O(n)，二分O(logn)需有序+随机访问', mastery: 'unknown' },
        { chapter: '第8章 查找', question: '什么是哈希表？如何处理冲突？', answer: '哈希表(Hash Table)：\n根据关键字直接计算存储位置的数据结构。\n\n哈希函数：H(key) = address\n\n常见哈希函数构造方法：\n① 直接定址法：H(key)=a×key+b\n② 除留余数法：H(key)=key mod p（最常用）\n③ 数字分析法：取关键字中分布均匀的位\n④ 平方取中法：key²取中间几位\n\n冲突：不同关键字映射到同一地址\n\n冲突处理方法：\n\n① 开放定址法：\n- 线性探测：Hᵢ=(H(key)+i) mod m\n- 二次探测：Hᵢ=(H(key)+i²) mod m\n- 双散列：Hᵢ=(H(key)+i×H₂(key)) mod m\n\n② 链地址法(拉链法)：\n- 同一地址的元素用链表连接\n- 适合经常增删的场景\n\n③ 再哈希法：\n- 用第二个哈希函数计算新地址\n\n性能指标：\n- 装填因子α = 元素数/表长\n- α越大冲突越多\n- 查找ASL取决于α和处理方法\n\n哈希表查找：\n- 平均O(1)\n- 最坏O(n)（全部冲突）', hint: 'H(key)=key mod p，冲突用线性探测/链地址', mastery: 'unknown' },
        { chapter: '第8章 查找', question: '什么是二叉排序树和B树？', answer: '二叉排序树(BST)：\n左<根<右，中序遍历有序。\n- 查找/插入/删除：平均O(log n)，最坏O(n)\n- 缺点：可能退化，需平衡\n\nB树(B-Tree)：多路平衡搜索树。\n\nB树性质(m阶B树)：\n① 每个节点最多m个子树\n② 根节点至少2个子树（非叶子时）\n③ 非根非叶节点至少⌈m/2⌉个子树\n④ 叶子节点在同一层\n⑤ 有k个子树的节点有k-1个关键字\n\nB+树(B+ Tree)：\nB树的变体，数据库索引常用。\n- 非叶子节点只存索引（不存数据）\n- 所有数据在叶子节点\n- 叶子节点用链表连接（范围查询高效）\n- 更适合磁盘I/O\n\nB树vs B+树：\n        B树         B+树\n数据    所有节点     仅叶子\n叶子    不连接       链表连接\n范围查  中序遍历     沿链表扫描\n适用    内存查找     磁盘索引\n\n为什么数据库用B+树：\n- 非叶节点不存数据→扇出更大→树更矮→I/O更少\n- 叶子链表→范围查询高效\n- 查找稳定（都要到叶子）', hint: 'B树多路平衡，B+树数据在叶子+链表连接', mastery: 'unknown' },
        { chapter: '第8章 查找', question: '什么是平衡二叉树（AVL）的旋转操作？', answer: 'AVL树插入后失衡的四种旋转：\n\n① LL型（左孩子的左子树插入）：\n- 失衡节点A，左孩子B\n- 右旋：B上升为根，A变为B的右孩子\n- B的原右子树变为A的左子树\n\n② RR型（右孩子的右子树插入）：\n- 失衡节点A，右孩子B\n- 左旋：B上升为根，A变为B的左孩子\n- B的原左子树变为A的右子树\n\n③ LR型（左孩子的右子树插入）：\n- 失衡节点A，左孩子B，B的右孩子C\n- 先左旋B（以C为支点）→变成LL型\n- 再右旋A（以C为支点）\n- C上升为新根\n\n④ RL型（右孩子的左子树插入）：\n- 失衡节点A，右孩子B，B的左孩子C\n- 先右旋B（以C为支点）→变成RR型\n- 再左旋A（以C为支点）\n- C上升为新根\n\n记忆技巧：\n- LL=右旋一次，RR=左旋一次\n- LR=先左后右两次，RL=先右后左两次\n- 旋转后子树高度恢复，不影响上层\n\n时间：查找/插入/删除O(log n)', hint: 'LL右旋/RR左旋/LR先左后右/RL先右后左', mastery: 'unknown' }
      ],
      'en': [
        { chapter: '阅读判断', question: 'True/False/Not Given 题型的核心判断标准是什么？', answer: '三种判断的核心标准：\n\nTRUE(正确)：\n- 题目信息与原文一致\n- 原文能直接支持题目的说法\n- 同义替换后意思完全吻合\n\nFALSE(错误)：\n- 题目信息与原文矛盾/对立\n- 原文明确否定题目的说法\n- 关键信息相反（如方向、数字、态度）\n\nNOT GIVEN(未提及)：\n- 原文没有提到题目中的信息\n- 原文提到了但无法判断对错\n- 题目添加了原文没有的内容\n\n关键原则：不能凭自己的知识判断，只能根据原文！', hint: 'TRUE=一致，FALSE=矛盾，NG=无法判断', mastery: 'unknown' },
        { chapter: '阅读判断', question: '如何区分FALSE和NOT GIVEN？', answer: '这是最容易混淆的两种判断：\n\nFALSE的核心：原文有相关信息，但与题目矛盾\n- 原文说"增加"，题目说"减少"→ FALSE\n- 原文说"多数"，题目说"全部"→ FALSE\n\nNOT GIVEN的核心：原文没有足够信息判断\n- 原文没提到这个话题 → NG\n- 原文提到A，题目说A导致B，但原文没说因果关系 → NG\n- 原文说"有些人认为"，题目说"所有人都认为"→ 可能NG\n\n判断技巧：\n① 先定位原文相关句子\n② 如果找到矛盾→FALSE\n③ 如果找不到或信息不足→NG\n④ 不要用常识推断！只看原文！', hint: 'FALSE=有信息但矛盾，NG=信息不足', mastery: 'unknown' },
        { chapter: '阅读判断', question: '阅读判断题的解题步骤是什么？', answer: '解题步骤：\n\n① 审题：先看题目关键词（人名、地名、数字、专有名词）\n\n② 定位：用关键词在原文中定位相关段落/句子\n  - 注意题目顺序通常与原文顺序一致\n  - 利用特殊词汇快速定位\n\n③ 对比：逐句对比题目和原文\n  - 找同义替换（synonyms）\n  - 注意否定词、程度副词的变化\n\n④ 判断：\n  - 信息一致→TRUE\n  - 信息矛盾→FALSE\n  - 找不到或无法判断→NOT GIVEN\n\n⑤ 检查：\n  - TRUE/FALSE/NG通常各有一定数量\n  - 不要全部选同一个答案', hint: '审题→定位→对比→判断→检查', mastery: 'unknown' },
        { chapter: '阅读判断', question: '阅读判断题中常见的同义替换有哪些？', answer: '常见同义替换类型：\n\n① 同义词替换：\n  important = significant = crucial\n  problem = issue = challenge\n  show = demonstrate = indicate\n\n② 词性转换：\n  succeed(v.) → success(n.) → successful(adj.)\n  develop(v.) → development(n.)\n\n③ 主动/被动转换：\n  "The government built the road"\n  = "The road was built by the government"\n\n④ 否定表达替换：\n  not ... = fail to ... = hardly ...\n  no longer = cease to\n\n⑤ 因果关系替换：\n  because of = due to = as a result of\n  cause = lead to = result in\n\n注意：同义替换是TRUE的主要信号，但要警惕"似是而非"的替换', hint: '5种替换：同义词、词性、主被动、否定、因果', mastery: 'unknown' },
        { chapter: '高频词汇', question: '英语（二）阅读中常见表示"重要/关键"的词汇有哪些？', answer: '表示"重要/关键"的高频词：\n\n① important = significant = crucial = vital = essential\n② key = central = core = fundamental\n③ main = primary = principal = major\n④ necessary = indispensable = required\n\n常考搭配：\n- play a key/vital role in...\n- be of great importance\n- it is essential to do...\n- make a significant contribution to...\n\n注意区分程度：\n- essential > crucial > important > significant\n- indispensable = absolutely necessary', hint: 'important系列+key系列+搭配', mastery: 'unknown' },
        { chapter: '高频词汇', question: '英语（二）阅读中常见表示"增加/减少/变化"的词汇有哪些？', answer: '增加类：\n  increase = rise = grow = climb = surge = soar\n  ↑ ascend = go up = boost = expand\n\n减少类：\n  decrease = decline = drop = fall = reduce\n  ↓ descend = shrink = slump = diminish\n\n波动/稳定：\n  fluctuate = vary = oscillate（波动）\n  remain = stay = keep stable（稳定）\n  level off = plateau（趋于平稳）\n\n程度修饰词：\n  significantly/dramatically（大幅）\n  slightly/gradually（小幅/缓慢）\n  steadily（稳定地）\n\n注意：图表描述题中这些词的准确使用至关重要', hint: '增加↑ 减少↓ 波动 稳定 程度修饰', mastery: 'unknown' }
      ]
    };

    function loadData() {
      try {
        var storedVersion = localStorage.getItem(VERSION_KEY);
        if (storedVersion !== String(DATA_VERSION)) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
          allData = {};
          return;
        }
        var raw = localStorage.getItem(STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : {};
        allData = (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
      } catch(e) { allData = {}; }
    }
    function saveData() {
      try {
        localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      } catch(e) {}
    }
    function loadPresetCards() {
      var changed = false;
      Object.keys(PRESET_CARDS).forEach(function(subject) {
        var cards = getCards(subject);
        var existingQs = {};
        cards.forEach(function(c) { existingQs[c.question] = true; });
        PRESET_CARDS[subject].forEach(function(p, i) {
          if (!existingQs[p.question]) {
            cards.push({
              id: Date.now() + i + Math.random(),
              chapter: p.chapter,
              question: p.question,
              answer: p.answer,
              hint: p.hint || '',
              mastery: p.mastery || 'unknown'
            });
            changed = true;
          }
        });
      });
      if (changed) saveData();
    }
    function getCards(subject) {
      if (!allData[subject]) allData[subject] = [];
      return allData[subject];
    }

    var masteryLabel = { known: '已掌握', unsure: '不熟练', unknown: '不会' };

    function renderStats() {
      var cards = getCards(currentSubject);
      if (currentView === 'today') cards = cards.filter(isTodayCard);
      var known = 0, unsure = 0, unknown = 0;
      cards.forEach(function(c) {
        if (c.mastery === 'known') known++;
        else if (c.mastery === 'unsure') unsure++;
        else unknown++;
      });
      document.getElementById('statTotal').textContent = cards.length;
      document.getElementById('statKnown').textContent = known;
      document.getElementById('statUnsure').textContent = unsure;
      document.getElementById('statUnknown').textContent = unknown;
      document.getElementById('statsTitle').textContent = currentView === 'today' ? '📊 今日统计' : '📊 总计统计';
      document.getElementById('cardsTitle').textContent = currentView === 'today' ? '🎴 今日卡片（' + getTodayChapterPrefix() + '）' : '🎴 全部卡片';
    }

    function updateChapterFilter() {
      var cards = getCards(currentSubject);
      var chapters = {};
      cards.forEach(function(c) { if (c.chapter) chapters[c.chapter] = true; });
      var sel = document.getElementById('filterChapter');
      var current = sel.value;
      sel.innerHTML = '<option value="">全部章节</option>' +
        Object.keys(chapters).sort().map(function(ch) {
          return '<option value="' + ch + '">' + ch + '</option>';
        }).join('');
      sel.value = current;
    }

    function renderCards() {
      var cards = getCards(currentSubject);
      if (currentView === 'today') cards = cards.filter(isTodayCard);
      var fc = document.getElementById('filterChapter').value;
      var fm = document.getElementById('filterMastery').value;

      var filtered = cards.filter(function(c) {
        return (!fc || c.chapter === fc) && (!fm || c.mastery === fm);
      });

      var masteryOrder = { 'unknown': 0, 'unsure': 1, 'known': 2 };
      filtered.sort(function(a, b) {
        var chCompare = (a.chapter || '').localeCompare(b.chapter || '');
        if (chCompare !== 0) return chCompare;
        return (masteryOrder[a.mastery] || 0) - (masteryOrder[b.mastery] || 0);
      });

      var grid = document.getElementById('cardGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="recite-empty">暂无卡片，点击上方「添加卡片」开始背诵</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(c) {
        return '<div class="recite-card" id="card-' + c.id + '" onclick="flipCard(this)">' +
          '<div class="recite-card-inner">' +
          '<div class="recite-card-front">' +
          '<div class="recite-card-chapter">' + (c.chapter || '未分类') + '</div>' +
          '<div class="recite-card-label">问题</div>' +
          '<div class="recite-card-question">' + c.question.replace(/</g, '&lt;') + '</div>' +
          (c.hint ? '<div style="font-size:0.8rem;color:var(--muted);margin-top:0.3rem;">💡 ' + c.hint.replace(/</g, '&lt;') + '</div>' : '') +
          '<span class="recite-mastery ' + c.mastery + '">' + masteryLabel[c.mastery] + '</span>' +
          '</div>' +
          '<div class="recite-card-back">' +
          '<div class="recite-card-label">答案</div>' +
          '<div class="recite-card-answer">' + c.answer.replace(/</g, '&lt;') + '</div>' +
          '<div class="recite-card-actions" onclick="event.stopPropagation()">' +
          '<button class="recite-card-btn known' + (c.mastery === 'known' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'known\')"><span>✓ 掌握</span></button>' +
          '<button class="recite-card-btn unsure' + (c.mastery === 'unsure' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unsure\')"><span>○ 不熟</span></button>' +
          '<button class="recite-card-btn unknown' + (c.mastery === 'unknown' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unknown\')"><span>✗ 不会</span></button>' +
          '<button class="recite-card-btn" style="color:var(--coral);border-color:var(--coral);flex:0 0 auto;padding:0.35rem 0.7rem;" onclick="deleteCard(' + c.id + ')">删</button>' +
          '</div></div></div></div>';
      }).join('');
      adjustCardHeights();
    }

    function adjustCardHeights() {
      document.querySelectorAll('.recite-card-inner').forEach(function(inner) {
        var front = inner.querySelector('.recite-card-front');
        var back = inner.querySelector('.recite-card-back');
        if (front && back) {
          inner.style.minHeight = '';
          var frontH = front.scrollHeight;
          var backH = back.scrollHeight;
          var maxH = Math.max(frontH, backH, 120);
          inner.style.minHeight = maxH + 'px';
        }
      });
    }

    function flipCard(el) {
      el.classList.toggle('flipped');
    }

    function scrollToCard(id) {
      var el = document.getElementById('card-' + id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flipped');
        setTimeout(function() { el.classList.remove('flipped'); }, 2000);
      }
    }

    function setMastery(id, mastery) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === id; });
      if (c) { c.mastery = mastery; saveData(); renderAll(); }
    }

    function deleteCard(id) {
      var cards = getCards(currentSubject);
      var idx = cards.findIndex(function(x) { return x.id === id; });
      if (idx >= 0) { cards.splice(idx, 1); saveData(); renderAll(); }
    }

    function addCard() {
      var chapter = document.getElementById('cardChapter').value.trim();
      var question = document.getElementById('cardQuestion').value.trim();
      var answer = document.getElementById('cardAnswer').value.trim();
      var hint = document.getElementById('cardHint').value.trim();
      var mastery = document.getElementById('cardMastery').value;

      if (!question || !answer) {
        alert('请填写问题和答案');
        return;
      }

      var cards = getCards(currentSubject);
      cards.push({
        id: Date.now(),
        chapter: chapter,
        question: question,
        answer: answer,
        hint: hint,
        mastery: mastery
      });
      saveData();

      document.getElementById('cardChapter').value = '';
      document.getElementById('cardQuestion').value = '';
      document.getElementById('cardAnswer').value = '';
      document.getElementById('cardHint').value = '';
      document.getElementById('cardMastery').value = 'unknown';
      renderAll();
    }

    function renderAll() {
      renderStats();
      updateChapterFilter();
      renderCards();
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.recite-view-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      renderAll();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      renderAll();
    }

    document.getElementById('btnViewToday').addEventListener('click', function() { switchView('today'); });
    document.getElementById('btnViewTotal').addEventListener('click', function() { switchView('total'); });
    document.getElementById('filterChapter').addEventListener('change', renderCards);
    document.getElementById('filterMastery').addEventListener('change', renderCards);
    document.getElementById('addCardBtn').addEventListener('click', addCard);

    /* ===== 测验模式 ===== */
    var currentMode = 'recite';
    var QUIZ_BANK_KEY = 'recite-quiz-bank';
    var quizQuestions = [];
    var QUIZ_TYPE_LABELS = {
      fill: '填空题', choice: '选择题', short: '简答题',
      calculate: '计算题', explain: '名词解释题', apply: '综合应用题'
    };
    var bankFilter = 'all';

    function loadQuizBank() {
      try {
        var stored = localStorage.getItem(QUIZ_BANK_KEY);
        if (stored) quizQuestions = JSON.parse(stored);
      } catch(e) { quizQuestions = []; }
    }

    function saveQuizBank() {
      try {
        localStorage.setItem(QUIZ_BANK_KEY, JSON.stringify(quizQuestions));
      } catch(e) {}
    }

    function switchMode(mode) {
      currentMode = mode;
      var btnRecite = document.getElementById('btnModeRecite');
      var btnQuiz = document.getElementById('btnModeQuiz');
      var btnBank = document.getElementById('btnModeBank');
      var sectionCards = document.getElementById('sectionCards');
      var sectionQuiz = document.getElementById('sectionQuiz');
      var sectionBank = document.getElementById('sectionBank');
      var sectionAdd = document.getElementById('sectionAdd');
      var sectionStats = document.getElementById('sectionStats');

      btnRecite.classList.remove('active');
      btnQuiz.classList.remove('active');
      btnBank.classList.remove('active');
      sectionCards.style.display = 'none';
      sectionQuiz.style.display = 'none';
      sectionBank.style.display = 'none';
      sectionAdd.style.display = 'none';

      if (mode === 'recite') {
        btnRecite.classList.add('active');
        sectionCards.style.display = '';
        sectionAdd.style.display = '';
        sectionStats.style.display = '';
      } else if (mode === 'quiz') {
        btnQuiz.classList.add('active');
        sectionQuiz.style.display = '';
        sectionStats.style.display = '';
        renderQuiz();
      } else if (mode === 'bank') {
        btnBank.classList.add('active');
        sectionBank.style.display = '';
        renderQuizBank();
      }
    }

    function getQuizCards() {
      var cards = getCards(currentSubject);
      if (currentView === 'today') cards = cards.filter(isTodayCard);
      return cards;
    }

    function generateQuiz() {
      var cards = getQuizCards();
      if (cards.length === 0) {
        document.getElementById('quizGenStatus').textContent = '没有可用的卡片';
        document.getElementById('quizGenStatus').className = 'quiz-gen-status error';
        return;
      }

      var btn = document.getElementById('quizGenBtn');
      var status = document.getElementById('quizGenStatus');
      btn.disabled = true;
      status.textContent = '正在生成题目...';
      status.className = 'quiz-gen-status';

      var container = document.getElementById('quizContainer');
      var loadingEl = document.createElement('div');
      loadingEl.className = 'quiz-loading';
      loadingEl.id = 'quizLoading';
      loadingEl.innerHTML = '<span class="spinner"></span>AI 正在根据今日卡片生成题目...';
      container.appendChild(loadingEl);

      var cardData = cards.map(function(c) {
        return { chapter: c.chapter, question: c.question, answer: c.answer, hint: c.hint, id: c.id };
      });

      var prompt = '你是自考出题专家。根据以下知识点卡片，生成测验题。\n\n' +
        '要求：\n' +
        '1. 每张卡片生成1道题，共' + cardData.length + '道\n' +
        '2. 题型混合：填空题(fill)、选择题(choice)、简答题(short)、计算题(calculate)、名词解释题(explain)、综合应用题(apply)\n' +
        '3. 选择题给4个选项，标注正确答案的索引(0-3)\n' +
        '4. 填空题用______标注空位，给出正确答案\n' +
        '5. 简答题/名词解释题/综合应用题给出参考答案要点\n' +
        '6. 计算题给出计算过程和最终结果\n\n' +
        '必须返回纯JSON数组，格式：\n' +
        '[{"type":"fill","chapter":"章节","question":"题目","answer":"正确答案","cardId":卡片ID},\n' +
        ' {"type":"choice","chapter":"章节","question":"题目","options":["A","B","C","D"],"correctIndex":0,"cardId":卡片ID},\n' +
        ' {"type":"short","chapter":"章节","question":"题目","answer":"参考答案","cardId":卡片ID},\n' +
        ' {"type":"calculate","chapter":"章节","question":"题目","answer":"计算过程和结果","cardId":卡片ID},\n' +
        ' {"type":"explain","chapter":"章节","question":"题目","answer":"名词解释","cardId":卡片ID},\n' +
        ' {"type":"apply","chapter":"章节","question":"题目","answer":"参考答案","cardId":卡片ID}]\n\n' +
        '知识点卡片：\n' + JSON.stringify(cardData, null, 2);

      var controller = new AbortController();
      var timeoutId = setTimeout(function() { controller.abort(); }, 60000);

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: prompt }],
          model: 'deepseek-chat',
          stream: false,
          max_tokens: 8000
        }),
        signal: controller.signal
      })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data) {
        clearTimeout(timeoutId);
        var el = document.getElementById('quizLoading');
        if (el) el.remove();
        var text = '';
        if (data.choices && data.choices[0] && data.choices[0].message) {
          text = data.choices[0].message.content || '';
        } else if (data.response) {
          text = data.response;
        } else if (data.error) {
          throw new Error(data.error);
        }
        var jsonMatch = text.match(/\[[\s\S]*\]/);
        if (jsonMatch) {
          var newQuestions = JSON.parse(jsonMatch[0]);
          var now = Date.now();
          newQuestions.forEach(function(q, i) {
            q.qid = now + '-' + i;
            q.createdAt = new Date().toISOString();
            q.subject = currentSubject;
            q.userAnswer = null;
            q.isCorrect = null;
          });
          quizQuestions = quizQuestions.concat(newQuestions);
          saveQuizBank();
          renderQuiz();
          status.textContent = '已累计 ' + quizQuestions.length + ' 道题（本次新增 ' + newQuestions.length + ' 道）';
          status.className = 'quiz-gen-status success';
        } else {
          throw new Error('AI 返回格式异常');
        }
      })
      .catch(function(err) {
        clearTimeout(timeoutId);
        var el2 = document.getElementById('quizLoading');
        if (el2) el2.remove();
        status.textContent = 'AI 生成失败，使用本地出题';
        status.className = 'quiz-gen-status error';
        generateLocalQuiz(cards);
      })
      .finally(function() {
        btn.disabled = false;
      });
    }

    function generateLocalQuiz(cards) {
      var now = Date.now();
      var newQuestions = cards.map(function(c, i) {
        var mod = i % 6;
        var q = { cardId: c.id, chapter: c.chapter, qid: now + '-' + i, createdAt: new Date().toISOString(), subject: currentSubject, userAnswer: null, isCorrect: null };
        if (mod === 0) {
          var keyTerm = c.answer.split(/[，。、：\n]/)[0].trim();
          if (keyTerm.length > 2) {
            var blanked = c.question.replace(keyTerm, '______');
            if (blanked === c.question) blanked = c.question + '（提示：' + (c.hint || keyTerm) + '）';
            q.type = 'fill'; q.question = blanked; q.answer = keyTerm;
          } else {
            q.type = 'short'; q.question = c.question; q.answer = c.answer;
          }
        } else if (mod === 1) {
          q.type = 'explain'; q.question = '解释概念：' + c.question; q.answer = c.answer;
        } else if (mod === 2) {
          q.type = 'short'; q.question = c.question; q.answer = c.answer;
        } else if (mod === 3) {
          q.type = 'calculate'; q.question = c.question + '（请给出计算过程）'; q.answer = c.answer;
        } else if (mod === 4) {
          q.type = 'apply'; q.question = '综合应用：' + c.question + ' 请结合实际场景分析。'; q.answer = c.answer;
        } else {
          q.type = 'fill'; q.question = c.question + '（填入核心概念）'; q.answer = c.answer.split('\n')[0];
        }
        return q;
      });
      quizQuestions = quizQuestions.concat(newQuestions);
      saveQuizBank();
      renderQuiz();
    }

    function renderQuiz() {
      var container = document.getElementById('quizContainer');

      var pending = quizQuestions.map(function(q, i) {
        return { q: q, idx: i };
      }).filter(function(item) {
        return item.q.isCorrect === null;
      }).sort(function(a, b) {
        var ta = a.q.createdAt ? new Date(a.q.createdAt).getTime() : 0;
        var tb = b.q.createdAt ? new Date(b.q.createdAt).getTime() : 0;
        return tb - ta;
      });

      if (pending.length === 0) {
        if (quizQuestions.length === 0) {
          container.innerHTML = '<div class="quiz-empty">暂无题目，点击上方「AI 出题」按钮生成</div>';
        } else {
          container.innerHTML = '<div class="quiz-empty">所有题目已答完，可在「📚 题库」中查看答题记录</div>';
        }
        return;
      }

      container.innerHTML = pending.map(function(item) {
        var q = item.q;
        var i = item.idx;
        var typeLabel = QUIZ_TYPE_LABELS[q.type] || '简答题';
        var html = '<div class="quiz-card" id="quiz-q' + i + '">' +
          '<span class="quiz-type-badge ' + q.type + '">' + typeLabel + '</span>' +
          '<div class="quiz-chapter-tag">' + (q.chapter || '未分类') + '</div>' +
          '<div class="quiz-question-text">' + (q.question || '').replace(/</g, '&lt;') + '</div>';

        if (q.type === 'fill' || q.type === 'calculate') {
          html += '<input type="text" class="quiz-input" placeholder="输入你的答案..." id="quiz-input-' + i + '">' +
            '<button class="quiz-submit-btn" onclick="checkQuizAnswer(' + i + ',\'' + q.type + '\')">提交答案</button>' +
            '<div class="quiz-feedback" id="quiz-feedback-' + i + '"><div class="quiz-feedback-title"></div><div class="quiz-feedback-answer"></div></div>';
        } else if (q.type === 'choice') {
          html += '<div class="quiz-options" id="quiz-options-' + i + '">';
          (q.options || []).forEach(function(opt, oi) {
            html += '<label class="quiz-option" onclick="selectQuizOption(' + i + ',' + oi + ')">' +
              '<input type="radio" name="quiz-q' + i + '" value="' + oi + '">' +
              String.fromCharCode(65 + oi) + '. ' + (opt || '').replace(/</g, '&lt;') +
              '</label>';
          });
          html += '</div>';
          html += '<button class="quiz-submit-btn" onclick="checkQuizAnswer(' + i + ',\'choice\')">提交答案</button>' +
            '<div class="quiz-feedback" id="quiz-feedback-' + i + '"><div class="quiz-feedback-title"></div><div class="quiz-feedback-answer"></div></div>';
        } else {
          html += '<textarea class="quiz-textarea" placeholder="输入你的回答..." id="quiz-input-' + i + '"></textarea>' +
            '<button class="quiz-submit-btn" onclick="checkQuizAnswer(' + i + ',\'' + q.type + '\')">提交答案</button>' +
            '<div class="quiz-feedback" id="quiz-feedback-' + i + '"><div class="quiz-feedback-title"></div><div class="quiz-feedback-answer"></div></div>';
        }

        html += '</div>';
        return html;
      }).join('');
    }

    function selectQuizOption(qi, oi) {
      var options = document.querySelectorAll('#quiz-options-' + qi + ' .quiz-option');
      options.forEach(function(opt) { opt.classList.remove('selected'); });
      options[oi].classList.add('selected');
      options[oi].querySelector('input').checked = true;
    }

    function checkQuizAnswer(qi, type) {
      var q = quizQuestions[qi];
      var feedback = document.getElementById('quiz-feedback-' + qi);
      var card = document.getElementById('quiz-q' + qi);
      var isCorrect = false;
      var userInput = '';

      if (type === 'fill' || type === 'calculate') {
        var input = document.getElementById('quiz-input-' + qi).value.trim();
        if (!input) { alert('请输入答案'); return; }
        userInput = input;
        var answer = (q.answer || '').toLowerCase();
        var userAns = input.toLowerCase();
        isCorrect = answer.indexOf(userAns) >= 0 || userAns.indexOf(answer) >= 0;
      } else if (type === 'choice') {
        var selected = document.querySelector('#quiz-options-' + qi + ' input:checked');
        if (!selected) { alert('请选择一个答案'); return; }
        var selectedIdx = parseInt(selected.value);
        userInput = String.fromCharCode(65 + selectedIdx);
        isCorrect = selectedIdx === (q.correctIndex || 0);
        var options = document.querySelectorAll('#quiz-options-' + qi + ' .quiz-option');
        options.forEach(function(opt) { opt.classList.remove('correct-answer', 'wrong-answer'); });
        options[q.correctIndex || 0].classList.add('correct-answer');
        if (!isCorrect) options[selectedIdx].classList.add('wrong-answer');
      } else {
        var text = document.getElementById('quiz-input-' + qi).value.trim();
        if (!text || text.length < 10) { alert('请输入至少 10 个字的回答'); return; }
        userInput = text;
        var refAns = (q.answer || '').toLowerCase();
        var userText = text.toLowerCase();
        var keywords = refAns.split(/[\s,，。、；;：:（）()]+/).filter(function(w) { return w.length > 1; });
        var matchCount = 0;
        keywords.forEach(function(kw) { if (userText.indexOf(kw) >= 0) matchCount++; });
        isCorrect = matchCount >= Math.max(2, Math.ceil(keywords.length * 0.3));
      }

      q.userAnswer = userInput;
      q.isCorrect = isCorrect;
      saveQuizBank();

      if (isCorrect) {
        card.classList.add('correct');
        feedback.className = 'quiz-feedback show correct';
        feedback.querySelector('.quiz-feedback-title').textContent = '✅ 回答正确！';
        feedback.querySelector('.quiz-feedback-answer').textContent = '参考答案：' + (q.answer || '');
        updateCardMasteryFromQuiz(q.cardId, true);
      } else {
        card.classList.add('wrong');
        feedback.className = 'quiz-feedback show wrong';
        feedback.querySelector('.quiz-feedback-title').textContent = '❌ 答案不正确';
        feedback.querySelector('.quiz-feedback-answer').textContent = '参考答案：' + (q.answer || '');
        updateCardMasteryFromQuiz(q.cardId, false);
      }
    }

    function renderQuizBank() {
      var container = document.getElementById('quizBankContainer');
      var statsEl = document.getElementById('quizBankStats');

      if (quizQuestions.length === 0) {
        statsEl.innerHTML = '';
        container.innerHTML = '<div class="quiz-empty">题库为空，在测验模式中出题后会自动保存到此处</div>';
        return;
      }

      var total = quizQuestions.length;
      var answered = quizQuestions.filter(function(q) { return q.isCorrect !== null; }).length;
      var correct = quizQuestions.filter(function(q) { return q.isCorrect === true; }).length;
      var wrong = quizQuestions.filter(function(q) { return q.isCorrect === false; }).length;
      var unanswered = total - answered;
      var rate = answered > 0 ? Math.round(correct / answered * 100) : 0;

      statsEl.innerHTML =
        '<div class="quiz-bank-stat">总题数 <strong>' + total + '</strong></div>' +
        '<div class="quiz-bank-stat">已答 <strong>' + answered + '</strong></div>' +
        '<div class="quiz-bank-stat">正确 <strong>' + correct + '</strong></div>' +
        '<div class="quiz-bank-stat">错误 <strong>' + wrong + '</strong></div>' +
        '<div class="quiz-bank-stat">正确率 <strong>' + rate + '%</strong></div>';

      var filterHtml = '<div class="quiz-bank-filter">' +
        '<button class="quiz-bank-filter-btn' + (bankFilter === 'all' ? ' active' : '') + '" onclick="setBankFilter(\'all\')">全部 (' + total + ')</button>' +
        '<button class="quiz-bank-filter-btn' + (bankFilter === 'wrong' ? ' active' : '') + '" onclick="setBankFilter(\'wrong\')">错题 (' + wrong + ')</button>' +
        '<button class="quiz-bank-filter-btn' + (bankFilter === 'correct' ? ' active' : '') + '" onclick="setBankFilter(\'correct\')">正确 (' + correct + ')</button>' +
        '<button class="quiz-bank-filter-btn' + (bankFilter === 'unanswered' ? ' active' : '') + '" onclick="setBankFilter(\'unanswered\')">未答 (' + unanswered + ')</button>' +
        '</div>';

      var filtered = quizQuestions.filter(function(q) {
        if (bankFilter === 'correct') return q.isCorrect === true;
        if (bankFilter === 'wrong') return q.isCorrect === false;
        if (bankFilter === 'unanswered') return q.isCorrect === null;
        return true;
      }).sort(function(a, b) {
        var ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        var tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tb - ta;
      });

      if (filtered.length === 0) {
        container.innerHTML = filterHtml + '<div class="quiz-empty">该分类下暂无题目</div>';
        return;
      }

      container.innerHTML = filterHtml + filtered.map(function(q) {
        var typeLabel = QUIZ_TYPE_LABELS[q.type] || '简答题';
        var statusClass = q.isCorrect === true ? 'correct' : (q.isCorrect === false ? 'wrong' : 'unanswered');
        var dateStr = q.createdAt ? new Date(q.createdAt).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

        var html = '<div class="quiz-bank-item ' + statusClass + '">' +
          '<div class="quiz-bank-meta">' +
            '<span class="quiz-type-badge ' + q.type + '">' + typeLabel + '</span>' +
            '<span class="quiz-chapter-tag">' + (q.chapter || '未分类') + '</span>' +
            '<span class="quiz-bank-date">' + dateStr + '</span>' +
          '</div>' +
          '<div class="quiz-question-text">' + (q.question || '').replace(/</g, '&lt;') + '</div>';

        if (q.userAnswer) {
          html += '<div class="quiz-bank-user-answer">你的答案：' + (q.userAnswer || '').replace(/</g, '&lt;') + '</div>';
        }
        html += '<div class="quiz-bank-ref-answer">参考答案：' + (q.answer || '').replace(/</g, '&lt;') + '</div>';
        html += '</div>';
        return html;
      }).join('');
    }

    function setBankFilter(filter) {
      bankFilter = filter;
      renderQuizBank();
    }

    function clearQuizBank() {
      if (!confirm('确定清空题库？所有已生成的题目和答题记录将被删除。')) return;
      quizQuestions = [];
      saveQuizBank();
      renderQuizBank();
      if (currentMode === 'quiz') renderQuiz();
    }

    function updateCardMasteryFromQuiz(cardId, correct) {
      if (!cardId) return;
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === cardId; });
      if (!c) return;
      if (correct) {
        if (c.mastery === 'unknown') c.mastery = 'unsure';
        else if (c.mastery === 'unsure') c.mastery = 'known';
      } else {
        c.mastery = 'unknown';
      }
      saveData();
      renderStats();
    }

    document.getElementById('btnModeRecite').addEventListener('click', function() { switchMode('recite'); });
    document.getElementById('btnModeQuiz').addEventListener('click', function() { switchMode('quiz'); });
    document.getElementById('btnModeBank').addEventListener('click', function() { switchMode('bank'); });

    loadData();
    loadPresetCards();
    loadQuizBank();
    switchSubject(currentSubject);
  </script>
</body>
</html>
