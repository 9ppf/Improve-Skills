<body>
  <article class="recite-page">
    <div class="recite-header">
      <h1>核心概念背诵卡</h1>
      <p>正面问题 · 背面答案 · 点击翻转 · 标记掌握度</p>
    </div>

    <div class="recite-tabs" id="subjectTabs">
      <div class="recite-tab active" data-subject="13015">13015 计算机系统原理</div>
      <div class="recite-tab" data-subject="02324">02324 离散数学</div>
      <div class="recite-tab" data-subject="13003">13003 数据结构与算法</div>
    </div>

    <div class="recite-section">
      <h2>📊 统计</h2>
      <div class="recite-stats">
        <div class="recite-stat"><div class="recite-stat-num" id="statTotal">0</div><div class="recite-stat-label">总卡片</div></div>
        <div class="recite-stat recite-stat-known"><div class="recite-stat-num" id="statKnown">0</div><div class="recite-stat-label">已掌握</div></div>
        <div class="recite-stat recite-stat-unsure"><div class="recite-stat-num" id="statUnsure">0</div><div class="recite-stat-label">不熟练</div></div>
        <div class="recite-stat recite-stat-unknown"><div class="recite-stat-num" id="statUnknown">0</div><div class="recite-stat-label">不会</div></div>
      </div>
    </div>

    <div class="recite-section">
      <h2>➕ 新建卡片</h2>
      <div class="recite-add-form">
        <input type="text" id="cardChapter" placeholder="章节（如：第2章 数据表示）" />
        <select id="cardMastery">
          <option value="unknown">不会</option>
          <option value="unsure">不熟练</option>
          <option value="known">已掌握</option>
        </select>
        <input type="text" id="cardQuestion" placeholder="正面：问题/术语（如：什么是补码？）" />
        <input type="text" id="cardHint" placeholder="提示（选填，如：注意0的表示）" />
        <textarea id="cardAnswer" placeholder="背面：答案/定义/解释"></textarea>
        <button id="addCardBtn">添加卡片</button>
      </div>
    </div>

    <div class="recite-section">
      <h2>🎴 卡片列表</h2>
      <div class="recite-filter">
        <select id="filterChapter">
          <option value="">全部章节</option>
        </select>
        <select id="filterMastery">
          <option value="">全部掌握度</option>
          <option value="known">已掌握</option>
          <option value="unsure">不熟练</option>
          <option value="unknown">不会</option>
        </select>
      </div>
      <p class="recite-hint">💡 点击卡片翻转查看答案</p>
      <div class="recite-card-grid" id="cardGrid"></div>
    </div>
  </article>

  <script>
    var STORAGE_KEY = 'recite-cards-data';
    var urlParams = new URLSearchParams(window.location.search);
    var currentSubject = urlParams.get('subject') || '13015';
    var allData = {};

    function loadData() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        allData = raw ? JSON.parse(raw) : {};
      } catch(e) { allData = {}; }
    }
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); } catch(e) {}
    }
    function getCards(subject) {
      if (!allData[subject]) allData[subject] = [];
      return allData[subject];
    }

    var masteryLabel = { known: '已掌握', unsure: '不熟练', unknown: '不会' };

    function renderStats() {
      var cards = getCards(currentSubject);
      var known = 0, unsure = 0, unknown = 0;
      cards.forEach(function(c) {
        if (c.mastery === 'known') known++;
        else if (c.mastery === 'unsure') unsure++;
        else unknown++;
      });
      document.getElementById('statTotal').textContent = cards.length;
      document.getElementById('statKnown').textContent = known;
      document.getElementById('statUnsure').textContent = unsure;
      document.getElementById('statUnknown').textContent = unknown;
    }

    function updateChapterFilter() {
      var cards = getCards(currentSubject);
      var chapters = {};
      cards.forEach(function(c) { if (c.chapter) chapters[c.chapter] = true; });
      var sel = document.getElementById('filterChapter');
      var current = sel.value;
      sel.innerHTML = '<option value="">全部章节</option>' +
        Object.keys(chapters).sort().map(function(ch) {
          return '<option value="' + ch + '">' + ch + '</option>';
        }).join('');
      sel.value = current;
    }

    function renderCards() {
      var cards = getCards(currentSubject);
      var fc = document.getElementById('filterChapter').value;
      var fm = document.getElementById('filterMastery').value;

      var filtered = cards.filter(function(c) {
        return (!fc || c.chapter === fc) && (!fm || c.mastery === fm);
      });

      var grid = document.getElementById('cardGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="recite-empty">暂无卡片，点击上方「添加卡片」开始背诵</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(c) {
        return '<div class="recite-card" onclick="flipCard(this)">' +
          '<div class="recite-card-inner">' +
          '<div class="recite-card-front">' +
          '<div class="recite-card-chapter">' + (c.chapter || '未分类') + '</div>' +
          '<div class="recite-card-label">问题</div>' +
          '<div class="recite-card-question">' + c.question.replace(/</g, '&lt;') + '</div>' +
          (c.hint ? '<div style="font-size:0.8rem;color:var(--muted);margin-top:0.3rem;">💡 ' + c.hint.replace(/</g, '&lt;') + '</div>' : '') +
          '<span class="recite-mastery ' + c.mastery + '">' + masteryLabel[c.mastery] + '</span>' +
          '</div>' +
          '<div class="recite-card-back">' +
          '<div class="recite-card-label">答案</div>' +
          '<div class="recite-card-answer">' + c.answer.replace(/</g, '&lt;') + '</div>' +
          '<div class="recite-card-actions" onclick="event.stopPropagation()">' +
          '<button class="recite-card-btn known' + (c.mastery === 'known' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'known\')"><span>✓ 掌握</span></button>' +
          '<button class="recite-card-btn unsure' + (c.mastery === 'unsure' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unsure\')"><span>○ 不熟</span></button>' +
          '<button class="recite-card-btn unknown' + (c.mastery === 'unknown' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unknown\')"><span>✗ 不会</span></button>' +
          '<button class="recite-card-btn" style="color:var(--coral);border-color:var(--coral);flex:0 0 auto;padding:0.35rem 0.7rem;" onclick="deleteCard(' + c.id + ')">删</button>' +
          '</div></div></div></div>';
      }).join('');
    }

    function flipCard(el) {
      el.classList.toggle('flipped');
    }

    function setMastery(id, mastery) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === id; });
      if (c) { c.mastery = mastery; saveData(); renderAll(); }
    }

    function deleteCard(id) {
      var cards = getCards(currentSubject);
      var idx = cards.findIndex(function(x) { return x.id === id; });
      if (idx >= 0) { cards.splice(idx, 1); saveData(); renderAll(); }
    }

    function addCard() {
      var chapter = document.getElementById('cardChapter').value.trim();
      var question = document.getElementById('cardQuestion').value.trim();
      var answer = document.getElementById('cardAnswer').value.trim();
      var hint = document.getElementById('cardHint').value.trim();
      var mastery = document.getElementById('cardMastery').value;

      if (!question || !answer) {
        alert('请填写问题和答案');
        return;
      }

      var cards = getCards(currentSubject);
      cards.push({
        id: Date.now(),
        chapter: chapter,
        question: question,
        answer: answer,
        hint: hint,
        mastery: mastery
      });
      saveData();

      document.getElementById('cardChapter').value = '';
      document.getElementById('cardQuestion').value = '';
      document.getElementById('cardAnswer').value = '';
      document.getElementById('cardHint').value = '';
      document.getElementById('cardMastery').value = 'unknown';
      renderAll();
    }

    function renderAll() {
      renderStats();
      updateChapterFilter();
      renderCards();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      document.querySelectorAll('.recite-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.subject === subject);
      });
      renderAll();
    }

    document.querySelectorAll('.recite-tab').forEach(function(t) {
      t.addEventListener('click', function() { switchSubject(t.dataset.subject); });
    });
    document.getElementById('filterChapter').addEventListener('change', renderCards);
    document.getElementById('filterMastery').addEventListener('change', renderCards);
    document.getElementById('addCardBtn').addEventListener('click', addCard);

    loadData();
    switchSubject(currentSubject);
  </script>
</body>
</html>
