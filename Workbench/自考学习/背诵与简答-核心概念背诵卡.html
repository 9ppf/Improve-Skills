<body>
  <article class="recite-page">
    <div class="recite-view-tabs">
      <button class="recite-view-btn zk-active" data-view="today" id="btnViewToday">📌 今日任务</button>
      <button class="recite-view-btn" data-view="total" id="btnViewTotal">📚 总任务</button>
    </div>

    <div class="recite-section" id="sectionStats">
      <h2 id="statsTitle">📊 今日统计</h2>
      <div class="recite-stats">
        <div class="recite-stat"><div class="recite-stat-num" id="statTotal">0</div><div class="recite-stat-label">总卡片</div></div>
        <div class="recite-stat recite-stat-known"><div class="recite-stat-num" id="statKnown">0</div><div class="recite-stat-label">已掌握</div></div>
        <div class="recite-stat recite-stat-unsure"><div class="recite-stat-num" id="statUnsure">0</div><div class="recite-stat-label">不熟练</div></div>
        <div class="recite-stat recite-stat-unknown"><div class="recite-stat-num" id="statUnknown">0</div><div class="recite-stat-label">不会</div></div>
      </div>
    </div>

    <div class="recite-section" id="sectionAdd">
      <h2>➕ 新建卡片</h2>
      <div class="recite-add-form">
        <input type="text" id="cardChapter" placeholder="章节（如：第2章 数据表示）" />
        <select id="cardMastery">
          <option value="unknown">不会</option>
          <option value="unsure">不熟练</option>
          <option value="known">已掌握</option>
        </select>
        <input type="text" id="cardQuestion" placeholder="正面：问题/术语（如：什么是补码？）" />
        <input type="text" id="cardHint" placeholder="提示（选填，如：注意0的表示）" />
        <textarea id="cardAnswer" placeholder="背面：答案/定义/解释"></textarea>
        <button id="addCardBtn">添加卡片</button>
      </div>
    </div>

    <div class="recite-section" id="sectionCards">
      <h2 id="cardsTitle">🎴 今日卡片</h2>
      <div class="recite-filter" id="cardFilter">
        <div class="card-type-filter">
          <button class="card-type-btn zk-active" onclick="setCardTypeFilter('all', this)">全部卡片</button>
          <button class="card-type-btn memory" onclick="setCardTypeFilter('memory', this)">🧠 记忆卡</button>
          <button class="card-type-btn calc" onclick="setCardTypeFilter('calculation', this)">🧮 计算卡</button>
        </div>
        <select id="filterChapter">
          <option value="">全部章节</option>
        </select>
        <select id="filterMastery">
          <option value="">全部掌握度</option>
          <option value="known">已掌握</option>
          <option value="unsure">不熟练</option>
          <option value="unknown">不会</option>
        </select>
      </div>
      <p class="recite-hint">💡 点击卡片翻转查看答案 · 章节内按不会→不熟→掌握排列</p>
      <div class="recite-card-grid" id="cardGrid"></div>
      <div class="recite-guide-flow" id="guideFlow" style="display:none;margin-top:16px;text-align:center;">
        <a class="recite-guide-btn" id="guideBtn" href="#" style="display:inline-block;padding:14px 28px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(34,197,94,0.3);">
          ✅ 去练习测验 →
          <div style="font-size:11px;font-weight:400;opacity:0.85;margin-top:2px;">点击检验今日学习成果</div>
        </a>
      </div>
    </div>

  <script>
    var STORAGE_KEY = 'recite-cards-data';
    var MASTERY_KEY = 'recite-cards-mastery';
    var VERSION_KEY = 'recite-cards-version';
    var urlParams = new URLSearchParams(window.location.search);
    // 数据缓存版本号：优先从URL的v参数读取，与self-study.json版本号同步
    var DATA_VERSION = urlParams.get('v') || '23';
    var currentSubject = window.RECITE_SUBJECT || urlParams.get('subject') || '13015';
    var currentView = 'today';
    var currentCardType = 'all';
    window.__apiMastery = null;
    // 防止 API 数据加载完成前用户操作覆盖服务器数据
    var _apiLoaded = false;
    var API_BASE = (location.protocol === 'file:') ? 'http://localhost:8000' : '';
    function apiUrl(path) { return API_BASE + path; }
    function apiPost(url, data) {
      try {
        fetch(apiUrl(url), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).catch(function(e) {});
      } catch(e) {}
    }
    var allData = {};
    // 当前周次各科目对应的章节列表（从 study-plan.json 动态加载）
    var todayChapters = {};

    function getTodayChapterPrefix() {
      var startDate = new Date('2026-08-25');
      var today = new Date();
      var daysDiff = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
      var weekNum = Math.floor(daysDiff / 7) + 1;
      if (weekNum < 1) weekNum = 1;
      return '第' + weekNum + '章';
    }

    // 科目代码与学习计划中科目名称的映射
    var SUBJECT_NAME_MAP = {
      '02324': '离散数学',
      '13003': '数据结构',
      '13015': '系统原理'
    };

    function isTodayCard(card) {
      if (currentSubject === 'en') return true;

      if (chapters && chapters.length > 0) {

        return chapters.some(function(prefix) { return ch.indexOf(prefix) === 0; });

      var prefix = getTodayChapterPrefix();

        // 提取章号并排序
        var nums = chapters.map(function(ch) {
          var m = ch.match(/第(\d+)章/);
          return m ? parseInt(m[1]) : 0;
        }).filter(function(n) { return n > 0; }).sort(function(a, b) { return a - b; });
        if (nums.length === 0) return chapters.join('、');
        if (nums.length === 1) return '第' + nums[0] + '章';
        return '第' + nums[0] + '-' + nums[nums.length - 1] + '章';
      }
      return getTodayChapterPrefix();
    }

    // 卡片唯一标识：优先用 term，兼容旧 question
    function cardKey(c) { return c.term || c.question || ''; }
    // 知识框架 JSON 转换为卡片数组
    function transformKfToCards(data) {
      var cards = [];
      if (!data || !data.chapters) return cards;
      data.chapters.forEach(function(ch) {
        var chName = ch.name || ch.title || ('第' + (ch.id || '?') + '章');
        var sections = ch.sections || [];
        for (var si = 0; si < sections.length; si++) {
          var s = sections[si];
          if (s.type === '核心概念') {
            // 核心概念 → 记忆卡/计算卡
            var concepts = s.coreConcepts || s.items || [];
            concepts.forEach(function(c) {
              var term = c.term || '';
              if (!term) return;
              // 合并 summary + points 作为定义
              var defParts = [];
              if (c.summary) defParts.push(c.summary);
              if (c.points && c.points.length) {
                c.points.forEach(function(p) { defParts.push('• ' + p); });
              }
              var card = {
                id: Date.now() + Math.random(),
                term: term,
                chapter: chName,
                question: '什么是' + term + '？',
                def: defParts.join('\n'),
                ex: c.ex || '',
                exImage: c.exImage || '',
                exam: c.exam || '',
                hint: c.hint || '',
                cardType: c.cardType || 'memory',
                mastery: 'unknown'
              };
              // 计算卡字段
              if (c.formula) card.formula = c.formula;
              if (c.steps) card.steps = c.steps;
              if (c.answer) card.answer = c.answer;
              if (c.answerAliases) card.answerAliases = c.answerAliases;
              cards.push(card);
            });
          } else if (s.type === '必会公式') {
            // 必会公式 → 计算卡
            var formulas = s.items || s.points || [];
            formulas.forEach(function(f) {
              var formulaText = typeof f === 'string' ? f : (f.term || f.point || '');
              if (!formulaText) return;
              // 拆分标题和内容（以中文冒号分隔）
              var colonIdx = formulaText.indexOf('：');
              var title = colonIdx > 0 ? formulaText.substring(0, colonIdx) : formulaText.substring(0, 10);
              var content = colonIdx > 0 ? formulaText.substring(colonIdx + 1) : formulaText;
              cards.push({
                id: Date.now() + Math.random(),
                term: title,
                chapter: chName,
                question: title + '的公式是什么？',
                def: content,
                ex: '',
                exam: '',
                hint: '',
                cardType: 'calculation',
                mastery: 'unknown'
              });
            });
          }
        }
      });
      return cards;
    }
    function saveMastery() {
      // API 数据未加载完成时跳过保存，防止空状态覆盖服务器数据
      if (!_apiLoaded) return;
      try {
        var masteryMap = {};
        Object.keys(allData).forEach(function(subject) {
          allData[subject].forEach(function(c) {
            var key = cardKey(c);
            if (key && c.mastery) {
              masteryMap[key] = c.mastery;
            }
          });
        });
        localStorage.setItem(MASTERY_KEY, JSON.stringify(masteryMap));
        apiPost('/api/recite-mastery', masteryMap);
      } catch(e) {}
    }
    function restoreMastery() {
      try {
        var masteryMap = window.__apiMastery;
        if (!masteryMap) {
          var raw = localStorage.getItem(MASTERY_KEY);
          if (!raw) return;
          masteryMap = JSON.parse(raw);
        }
        if (!masteryMap || typeof masteryMap !== 'object') return;
        Object.keys(allData).forEach(function(subject) {
          allData[subject].forEach(function(c) {
            var key = cardKey(c);
            if (key && masteryMap[key]) {
              c.mastery = masteryMap[key];
            }
          });
        });
      } catch(e) {}
    }
    function loadData() {
      try {
        var storedVersion = localStorage.getItem(VERSION_KEY);
        if (storedVersion !== String(DATA_VERSION)) {
          saveMastery();
          localStorage.removeItem(STORAGE_KEY);
          localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
          allData = {};
          return;
        }
        var raw = localStorage.getItem(STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : {};
        allData = (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
      } catch(e) { allData = {}; }
    }
    function saveData() {
      try {
        localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      } catch(e) {}
    }
    function loadPresetCards() {
      var changed = false;
      Object.keys(PRESET_CARDS).forEach(function(subject) {
        var cards = getCards(subject);
        var existingMap = {};
        cards.forEach(function(c) { existingMap[cardKey(c)] = c; });
        PRESET_CARDS[subject].forEach(function(p, i) {
          var pKey = cardKey(p);
          if (!existingMap[pKey]) {
            var card = {
              id: Date.now() + i + Math.random(),
              chapter: p.chapter,
              question: p.question,
              hint: p.hint || '',
              mastery: p.mastery || 'unknown'
            };
            if (p.term) card.term = p.term;
            if (p.cardType) card.cardType = p.cardType;
            if (p.def) card.def = p.def;
            if (p.ex) card.ex = p.ex;
            if (p.exImage) card.exImage = p.exImage;
            if (p.exam) card.exam = p.exam;
            if (p.answer) card.answer = p.answer;
            if (p.formula) card.formula = p.formula;
            if (p.steps) card.steps = p.steps;
            if (p.answerAliases) card.answerAliases = p.answerAliases;
            cards.push(card);
            changed = true;
          } else if (p.def && !existingMap[pKey].def) {
            var existing = existingMap[pKey];
            existing.def = p.def;
            existing.ex = p.ex;
            existing.exImage = p.exImage || existing.exImage;
            existing.exam = p.exam;
            existing.chapter = p.chapter;
            existing.hint = p.hint || existing.hint;
            if (p.term) existing.term = p.term;
            if (p.cardType) existing.cardType = p.cardType;
            if (p.formula) existing.formula = p.formula;
            if (p.steps) existing.steps = p.steps;
            if (p.answerAliases) existing.answerAliases = p.answerAliases;
            delete existing.answer;
            changed = true;
          }
        });
      });
      if (changed) saveData();
      restoreMastery();
      if (changed) saveData();
    }

          '<button class="recite-card-btn unknown' + (c.mastery === 'unknown' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unknown\')"><span>✗ 不会</span></button>' +
          '<a class="recite-card-btn" style="color:var(--accent);border-color:var(--accent);flex:0 0 auto;padding:0.35rem 0.7rem;text-decoration:none;cursor:pointer;font-size:0.8rem;" href="练习测验.html?subject=' + currentSubject + '&from=recite' + (c.chapter ? '&chapter=' + encodeURIComponent(c.chapter) : '') + '" onclick="event.stopPropagation()">📝 练习</a>' +
          '<button class="recite-card-btn" style="color:var(--coral);border-color:var(--coral);flex:0 0 auto;padding:0.35rem 0.7rem;margin-left:auto;" onclick="deleteCard(' + c.id + ')">删</button>' +
          '</div></div></div></div>';
      }).join('');
      adjustCardHeights();
    }

    function adjustCardHeights() {
      document.querySelectorAll('.recite-card-inner').forEach(function(inner) {
        var front = inner.querySelector('.recite-card-front');
        var back = inner.querySelector('.recite-card-back');
        var card = inner.closest('.recite-card');
        if (!front || !back) return;
        inner.style.minHeight = '';
        var target = card && card.classList.contains('flipped') ? back : front;
        inner.style.minHeight = target.scrollHeight + 'px';
      });
    }

    function flipCard(el) {
      var inner = el.querySelector('.recite-card-inner');
      var front = inner.querySelector('.recite-card-front');
      var back = inner.querySelector('.recite-card-back');
      el.classList.toggle('flipped');
      var target = el.classList.contains('flipped') ? back : front;
      if (target) inner.style.minHeight = target.scrollHeight + 'px';
    }

    function scrollToCard(id) {
      var el = document.getElementById('card-' + id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flipped');
        setTimeout(function() { el.classList.remove('flipped'); }, 2000);
      }
    }

    function setMastery(id, mastery) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === id; });
      if (c) { c.mastery = mastery; saveMastery(); saveData(); renderAll(); }
    }

    // 计算卡：评分
    function checkCalcCardAnswer(cardId) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === cardId; });
      if (!c) return;
      var input = document.getElementById('calc-input-' + cardId);
      var fb = document.getElementById('calc-fb-' + cardId);
      if (!input || !fb) return;
      var userAns = input.value.trim();
      if (!userAns) { fb.className = 'calc-card-feedback show wrong'; fb.textContent = '请先输入答案'; return; }

      var correct = c.answer || '';
      var aliases = c.answerAliases || [];
      var allAnswers = [correct].concat(aliases);
      var isCorrect = allAnswers.some(function(a) {
        if (!a) return false;
        // 归一化：去空格、转小写
        var normA = a.replace(/\s+/g, '').toLowerCase();
        var normU = userAns.replace(/\s+/g, '').toLowerCase();
        return normA === normU || normA.indexOf(normU) >= 0 || normU.indexOf(normA) >= 0;
      });

      if (isCorrect) {
        fb.className = 'calc-card-feedback show correct';
        fb.textContent = '✅ 答案正确！点击卡片查看解题步骤';
        // 答对自动升级掌握度
        if (c.mastery === 'unknown') setMastery(cardId, 'unsure');
        else if (c.mastery === 'unsure') setMastery(cardId, 'known');
      } else {
        fb.className = 'calc-card-feedback show wrong';
        fb.textContent = '❌ 答案不正确，点击卡片查看解析';
        // 答错自动标记为不会
        if (c.mastery !== 'unknown') setMastery(cardId, 'unknown');
      }
    }

    // 计算卡：符号面板切换
    function toggleCalcCardSymbols(cardId) {
      var pal = document.getElementById('calc-sym-' + cardId);
      if (!pal) return;
      pal.style.display = pal.style.display === 'none' ? '' : 'none';
    }

    // 计算卡：插入符号
    function insertCalcCardSymbol(cardId, sym) {
      var input = document.getElementById('calc-input-' + cardId);
      if (!input) return;
      var start = input.selectionStart || 0;
      var end = input.selectionEnd || 0;
      var val = input.value;
      input.value = val.substring(0, start) + sym + val.substring(end);
      input.selectionStart = input.selectionEnd = start + sym.length;
      input.focus();
    }

    function deleteCard(id) {
      var cards = getCards(currentSubject);
      var idx = cards.findIndex(function(x) { return x.id === id; });
      if (idx >= 0) { cards.splice(idx, 1); saveData(); renderAll(); }
    }

    function addCard() {
      var chapter = document.getElementById('cardChapter').value.trim();
      var question = document.getElementById('cardQuestion').value.trim();
      var answer = document.getElementById('cardAnswer').value.trim();
      var hint = document.getElementById('cardHint').value.trim();
      var mastery = document.getElementById('cardMastery').value;

      if (!question || !answer) {
        alert('请填写问题和答案');
        return;
      }

      var cards = getCards(currentSubject);
      cards.push({
        id: Date.now(),
        chapter: chapter,
        question: question,
        answer: answer,
        hint: hint,
        mastery: mastery
      });
      saveData();

      document.getElementById('cardChapter').value = '';
      document.getElementById('cardQuestion').value = '';
      document.getElementById('cardAnswer').value = '';
      document.getElementById('cardHint').value = '';
      document.getElementById('cardMastery').value = 'unknown';
      renderAll();
    }

    function renderAll() {
      renderStats();
      updateChapterFilter();
      renderCards();
      updateGuideFlow();
    }

    function updateGuideFlow() {
      var cards = getCards(currentSubject);
      var guide = document.getElementById('guideFlow');
      var btn = document.getElementById('guideBtn');
      if (!guide || !btn) return;
      if (cards.length === 0) { guide.style.display = 'none'; return; }
      guide.style.display = 'block';
      var basePath = (location.protocol === 'file:') ? '' : '';
      btn.href = basePath + '练习测验.html?subject=' + currentSubject + '&from=recite';
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.recite-view-btn').forEach(function(btn) {
        btn.classList.toggle('zk-active', btn.dataset.view === view);
      });
      renderAll();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      renderAll();
    }

    document.getElementById('btnViewToday').addEventListener('click', function() { switchView('today'); });
    document.getElementById('btnViewTotal').addEventListener('click', function() { switchView('total'); });
    function setCardTypeFilter(type, btn) {
      currentCardType = type;
      btn.parentElement.querySelectorAll('.card-type-btn').forEach(function(b) {
        b.classList.remove('zk-active');
      });
      btn.classList.add('zk-active');
      renderCards();
    }
    document.getElementById('filterChapter').addEventListener('change', renderCards);
    document.getElementById('filterMastery').addEventListener('change', renderCards);
    document.getElementById('addCardBtn').addEventListener('click', addCard);

    loadData();
    var dataBase = API_BASE ? API_BASE + '/data' : '../../data';
    // 三科均改用知识框架 JSON 作为数据源
    var cardSources = [
      ['02324', dataBase + '/knowledge-framework-02324.json?v=' + DATA_VERSION],
      ['13015', dataBase + '/knowledge-framework-13015.json?v=' + DATA_VERSION],
      ['13003', dataBase + '/knowledge-framework-13003.json?v=' + DATA_VERSION]
    ];
    var apiCalls = [
      fetch(apiUrl('/api/recite-mastery'), { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(d) { window.__apiMastery = d; _apiLoaded = true; })
        .catch(function(e) { _apiLoaded = true; }),
      // 加载学习计划，提取当前周次的章节列表
      fetch(dataBase + '/study-plan.json?v=' + DATA_VERSION, { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(plan) {
          if (!plan || !plan.weeks) return;
          // 找到当前周
          var currentWeek = plan.weeks.find(function(w) { return w.isCurrent; });
          if (!currentWeek) return;
          // 按科目代码提取章节
          Object.keys(SUBJECT_NAME_MAP).forEach(function(code) {
            var subjectName = SUBJECT_NAME_MAP[code];
            var chs = [];
            (currentWeek.goals || []).forEach(function(g) {
              if (g.subject === subjectName && g.chapter) {
                chs.push(g.chapter);
              }
            });
            if (chs.length > 0) todayChapters[code] = chs;
          });
        })
        .catch(function(e) {})
    ];
    Promise.all(cardSources.map(function(src) {
      return fetch(src[1], { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if ((src[0] === '02324' || src[0] === '13003' || src[0] === '13015') && data && data.chapters) {
            // 知识框架格式：转换为卡片
            var transformed = transformKfToCards(data);
            if (transformed.length > 0) PRESET_CARDS[src[0]] = transformed;
          } else if (data && Array.isArray(data) && data.length > 0) {
            PRESET_CARDS[src[0]] = data;
          }
        })
        .catch(function(e) {});
    }).concat(apiCalls)).finally(function() {
      loadPresetCards();
      switchSubject(currentSubject);
    });
  </script>
</body>
</html>
