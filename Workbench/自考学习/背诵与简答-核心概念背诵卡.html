      var daysDiff = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
      var weekNum = Math.floor(daysDiff / 7) + 1;

    function isTodayCard(card) {
      if (currentSubject === 'en') return true;
      // 优先使用从学习计划加载的章节列表
      var chapters = todayChapters[currentSubject];
      if (chapters && chapters.length > 0) {

      // 降级：按周次计算单章节

    // 生成今日卡片标题的章节标签（如"第1-3章"或"第1章"）
    function getTodayChapterLabel() {
      var chapters = todayChapters[currentSubject];

          var m = ch.match(/第(\d+)章/);

    var PRESET_CARDS = {
      'en': [
        { chapter: '阅读判断', question: 'True/False/Not Given 题型的核心判断标准是什么？', answer: '三种判断的核心标准：\n\nTRUE(正确)：\n- 题目信息与原文一致\n- 原文能直接支持题目的说法\n- 同义替换后意思完全吻合\n\nFALSE(错误)：\n- 题目信息与原文矛盾/对立\n- 原文明确否定题目的说法\n- 关键信息相反（如方向、数字、态度）\n\nNOT GIVEN(未提及)：\n- 原文没有提到题目中的信息\n- 原文提到了但无法判断对错\n- 题目添加了原文没有的内容\n\n关键原则：不能凭自己的知识判断，只能根据原文！', hint: 'TRUE=一致，FALSE=矛盾，NG=无法判断', mastery: 'unknown' },
        { chapter: '阅读判断', question: '如何区分FALSE和NOT GIVEN？', answer: '这是最容易混淆的两种判断：\n\nFALSE的核心：原文有相关信息，但与题目矛盾\n- 原文说"增加"，题目说"减少"→ FALSE\n- 原文说"多数"，题目说"全部"→ FALSE\n\nNOT GIVEN的核心：原文没有足够信息判断\n- 原文没提到这个话题 → NG\n- 原文提到A，题目说A导致B，但原文没说因果关系 → NG\n- 原文说"有些人认为"，题目说"所有人都认为"→ 可能NG\n\n判断技巧：\n① 先定位原文相关句子\n② 如果找到矛盾→FALSE\n③ 如果找不到或信息不足→NG\n④ 不要用常识推断！只看原文！', hint: 'FALSE=有信息但矛盾，NG=信息不足', mastery: 'unknown' },
        { chapter: '阅读判断', question: '阅读判断题的解题步骤是什么？', answer: '解题步骤：\n\n① 审题：先看题目关键词（人名、地名、数字、专有名词）\n\n② 定位：用关键词在原文中定位相关段落/句子\n  - 注意题目顺序通常与原文顺序一致\n  - 利用特殊词汇快速定位\n\n③ 对比：逐句对比题目和原文\n  - 找同义替换（synonyms）\n  - 注意否定词、程度副词的变化\n\n④ 判断：\n  - 信息一致→TRUE\n  - 信息矛盾→FALSE\n  - 找不到或无法判断→NOT GIVEN\n\n⑤ 检查：\n  - TRUE/FALSE/NG通常各有一定数量\n  - 不要全部选同一个答案', hint: '审题→定位→对比→判断→检查', mastery: 'unknown' },
        { chapter: '阅读判断', question: '阅读判断题中常见的同义替换有哪些？', answer: '常见同义替换类型：\n\n① 同义词替换：\n  important = significant = crucial\n  problem = issue = challenge\n  show = demonstrate = indicate\n\n② 词性转换：\n  succeed(v.) → success(n.) → successful(adj.)\n  develop(v.) → development(n.)\n\n③ 主动/被动转换：\n  "The government built the road"\n  = "The road was built by the government"\n\n④ 否定表达替换：\n  not ... = fail to ... = hardly ...\n  no longer = cease to\n\n⑤ 因果关系替换：\n  because of = due to = as a result of\n  cause = lead to = result in\n\n注意：同义替换是TRUE的主要信号，但要警惕"似是而非"的替换', hint: '5种替换：同义词、词性、主被动、否定、因果', mastery: 'unknown' },
        { chapter: '高频词汇', question: '英语（二）阅读中常见表示"重要/关键"的词汇有哪些？', answer: '表示"重要/关键"的高频词：\n\n① important = significant = crucial = vital = essential\n② key = central = core = fundamental\n③ main = primary = principal = major\n④ necessary = indispensable = required\n\n常考搭配：\n- play a key/vital role in...\n- be of great importance\n- it is essential to do...\n- make a significant contribution to...\n\n注意区分程度：\n- essential > crucial > important > significant\n- indispensable = absolutely necessary', hint: 'important系列+key系列+搭配', mastery: 'unknown' },
        { chapter: '高频词汇', question: '英语（二）阅读中常见表示"增加/减少/变化"的词汇有哪些？', answer: '增加类：\n  increase = rise = grow = climb = surge = soar\n  ↑ ascend = go up = boost = expand\n\n减少类：\n  decrease = decline = drop = fall = reduce\n  ↓ descend = shrink = slump = diminish\n\n波动/稳定：\n  fluctuate = vary = oscillate（波动）\n  remain = stay = keep stable（稳定）\n  level off = plateau（趋于平稳）\n\n程度修饰词：\n  significantly/dramatically（大幅）\n  slightly/gradually（小幅/缓慢）\n  steadily（稳定地）\n\n注意：图表描述题中这些词的准确使用至关重要', hint: '增加↑ 减少↓ 波动 稳定 程度修饰', mastery: 'unknown' }
      ]
    };

    // 卡片唯一标识：优先用 term，兼容旧 question
    function cardKey(c) { return c.term || c.question || ''; }
    // 知识框架 JSON 转换为卡片数组
    function transformKfToCards(data) {
      var cards = [];
      if (!data || !data.chapters) return cards;
      data.chapters.forEach(function(ch) {
        var chName = ch.name || ch.title || ('第' + (ch.id || '?') + '章');
        var sections = ch.sections || [];
        for (var si = 0; si < sections.length; si++) {
          var s = sections[si];
          if (s.type === '核心概念') {
            // 核心概念 → 记忆卡/计算卡
            var concepts = s.coreConcepts || s.items || [];
            concepts.forEach(function(c) {
              var term = c.term || '';
              if (!term) return;
              // 合并 summary + points 作为定义
              var defParts = [];
              if (c.summary) defParts.push(c.summary);
              if (c.points && c.points.length) {
                c.points.forEach(function(p) { defParts.push('• ' + p); });
              }
              var card = {
                id: Date.now() + Math.random(),
                term: term,
                chapter: chName,
                question: '什么是' + term + '？',
                def: defParts.join('\n'),
                ex: c.ex || '',
                exImage: c.exImage || '',
                exam: c.exam || '',
                hint: c.hint || '',
                cardType: c.cardType || 'memory',
                mastery: 'unknown'
              };
              // 计算卡字段
              if (c.formula) card.formula = c.formula;
              if (c.steps) card.steps = c.steps;
              if (c.answer) card.answer = c.answer;
              if (c.answerAliases) card.answerAliases = c.answerAliases;
              cards.push(card);
            });
          } else if (s.type === '必会公式') {
            // 必会公式 → 计算卡
            var formulas = s.items || s.points || [];
            formulas.forEach(function(f) {
              var formulaText = typeof f === 'string' ? f : (f.term || f.point || '');
              if (!formulaText) return;
              // 拆分标题和内容（以中文冒号分隔）
              var colonIdx = formulaText.indexOf('：');
              var title = colonIdx > 0 ? formulaText.substring(0, colonIdx) : formulaText.substring(0, 10);
              var content = colonIdx > 0 ? formulaText.substring(colonIdx + 1) : formulaText;
              cards.push({
                id: Date.now() + Math.random(),
                term: title,
                chapter: chName,
                question: title + '的公式是什么？',
                def: content,
                ex: '',
                exam: '',
                hint: '',
                cardType: 'calculation',
                mastery: 'unknown'
              });
            });
          }
        }
      });
      return cards;
    }
    function saveMastery() {
      // API 数据未加载完成时跳过保存，防止空状态覆盖服务器数据
      if (!_apiLoaded) return;
      try {
        var masteryMap = {};
        Object.keys(allData).forEach(function(subject) {
          allData[subject].forEach(function(c) {
            var key = cardKey(c);
            if (key && c.mastery) {
              masteryMap[key] = c.mastery;
            }
          });
        });
        localStorage.setItem(MASTERY_KEY, JSON.stringify(masteryMap));
        apiPost('/api/recite-mastery', masteryMap);
      } catch(e) {}
    }
    function restoreMastery() {
      try {
        var masteryMap = window.__apiMastery;
        if (!masteryMap) {
          var raw = localStorage.getItem(MASTERY_KEY);
          if (!raw) return;
          masteryMap = JSON.parse(raw);
        }
        if (!masteryMap || typeof masteryMap !== 'object') return;
        Object.keys(allData).forEach(function(subject) {
          allData[subject].forEach(function(c) {
            var key = cardKey(c);
            if (key && masteryMap[key]) {
              c.mastery = masteryMap[key];
            }
          });
        });
      } catch(e) {}
    }
    function loadData() {
      try {
        var storedVersion = localStorage.getItem(VERSION_KEY);
        if (storedVersion !== String(DATA_VERSION)) {
          saveMastery();
          localStorage.removeItem(STORAGE_KEY);
          localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
          allData = {};
          return;
        }
        var raw = localStorage.getItem(STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : {};
        allData = (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
      } catch(e) { allData = {}; }
    }
    function saveData() {
      try {
        localStorage.setItem(VERSION_KEY, String(DATA_VERSION));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      } catch(e) {}
    }
    function loadPresetCards() {
      var changed = false;
      Object.keys(PRESET_CARDS).forEach(function(subject) {
        var cards = getCards(subject);
        var existingMap = {};
        cards.forEach(function(c) { existingMap[cardKey(c)] = c; });
        PRESET_CARDS[subject].forEach(function(p, i) {
          var pKey = cardKey(p);
          if (!existingMap[pKey]) {
            var card = {
              id: Date.now() + i + Math.random(),
              chapter: p.chapter,
              question: p.question,
              hint: p.hint || '',
              mastery: p.mastery || 'unknown'
            };
            if (p.term) card.term = p.term;
            if (p.cardType) card.cardType = p.cardType;
            if (p.def) card.def = p.def;
            if (p.ex) card.ex = p.ex;
            if (p.exImage) card.exImage = p.exImage;
            if (p.exam) card.exam = p.exam;
            if (p.answer) card.answer = p.answer;
            if (p.formula) card.formula = p.formula;
            if (p.steps) card.steps = p.steps;
            if (p.answerAliases) card.answerAliases = p.answerAliases;
            cards.push(card);
            changed = true;
          } else if (p.def && !existingMap[pKey].def) {
            var existing = existingMap[pKey];
            existing.def = p.def;
            existing.ex = p.ex;
            existing.exImage = p.exImage || existing.exImage;
            existing.exam = p.exam;
            existing.chapter = p.chapter;
            existing.hint = p.hint || existing.hint;
            if (p.term) existing.term = p.term;
            if (p.cardType) existing.cardType = p.cardType;
            if (p.formula) existing.formula = p.formula;
            if (p.steps) existing.steps = p.steps;
            if (p.answerAliases) existing.answerAliases = p.answerAliases;
            delete existing.answer;
            changed = true;
          }
        });
      });
      if (changed) saveData();
      restoreMastery();
      if (changed) saveData();
    }
    function getCards(subject) {
      if (!allData[subject]) allData[subject] = [];
      return allData[subject];
    }

    var masteryLabel = { known: '已掌握', unsure: '不熟练', unknown: '不会' };

    function renderStats() {
      var cards = getCards(currentSubject);
      if (currentView === 'today') cards = cards.filter(isTodayCard);
      var known = 0, unsure = 0, unknown = 0;
      cards.forEach(function(c) {
        if (c.mastery === 'known') known++;
        else if (c.mastery === 'unsure') unsure++;
        else unknown++;
      });
      document.getElementById('statTotal').textContent = cards.length;
      document.getElementById('statKnown').textContent = known;
      document.getElementById('statUnsure').textContent = unsure;
      document.getElementById('statUnknown').textContent = unknown;
      document.getElementById('statsTitle').textContent = currentView === 'today' ? '📊 今日统计' : '📊 总计统计';
      document.getElementById('cardsTitle').textContent = currentView === 'today' ? '🎴 今日卡片（' + getTodayChapterLabel() + '）' : '🎴 全部卡片';
    }

    function updateChapterFilter() {
      var cards = getCards(currentSubject);
      var chapters = {};
      cards.forEach(function(c) { if (c.chapter) chapters[c.chapter] = true; });
      var sel = document.getElementById('filterChapter');
      var current = sel.value;
      sel.innerHTML = '<option value="">全部章节</option>' +
        Object.keys(chapters).sort().map(function(ch) {
          return '<option value="' + ch + '">' + ch + '</option>';
        }).join('');
      sel.value = current;
    }

    var QUIZ_SYMBOLS = [

      '\u2208','\u2209','\u222a','\u2229','\u2286','\u2287','\u2205',
      '\u2264','\u2265','\u2260','\u2248','\u2261',
      '\u2211','\u220f','\u00d7','\u00f7','\u00b1','\u221a','\u221e','\u03c0',
      '\u2082','\u2088','\u2081','\u2080','\u2083','\u2084','\u2085','\u2086','\u2087','\u2089',
      '\u2070','\u00b9','\u00b2','\u00b3','\u207f',
      '\u03b1','\u03b2','\u03b3','\u03b4','\u03b5','\u03b8','\u03bb','\u03bc','\u03c3','\u03c6','\u03c8','\u03c9','\u0394'
    ];

    function renderCards() {
      var cards = getCards(currentSubject);
      var fc = document.getElementById('filterChapter').value;
      // 今日视图：未手动选章节时按当前周次过滤，手动选了章节则显示该章节
      if (currentView === 'today' && !fc) cards = cards.filter(isTodayCard);
      var fm = document.getElementById('filterMastery').value;

      var filtered = cards.filter(function(c) {
        var typeMatch = true;
        if (currentCardType === 'memory') typeMatch = c.cardType !== 'calculation';
        if (currentCardType === 'calculation') typeMatch = c.cardType === 'calculation';
        return typeMatch && (!fc || c.chapter === fc) && (!fm || c.mastery === fm);
      });

      var masteryOrder = { 'unknown': 0, 'unsure': 1, 'known': 2 };
      filtered.sort(function(a, b) {
        var chCompare = (a.chapter || '').localeCompare(b.chapter || '');
        if (chCompare !== 0) return chCompare;
        return (masteryOrder[a.mastery] || 0) - (masteryOrder[b.mastery] || 0);
      });

      var grid = document.getElementById('cardGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="recite-empty">暂无卡片，点击上方「添加卡片」开始背诵</div>';
        return;
      }

      grid.innerHTML = filtered.map(function(c) {
        var esc = function(s) { return s.replace(/</g, '&lt;'); };
        var isCalc = c.cardType === 'calculation';
        var frontExtra = '';
        var backContent = '';

        if (isCalc) {
          // 计算卡正面：问题 + 输入框 + 提交按钮 + 符号面板
          frontExtra = '<input type="text" class="calc-card-input" id="calc-input-' + c.id + '" placeholder="输入答案..." onclick="event.stopPropagation()" onkeydown="if(event.key===\'Enter\'){checkCalcCardAnswer(' + c.id + ');event.stopPropagation();}">' +
            '<button class="calc-card-submit zk-btn-primary" onclick="event.stopPropagation();checkCalcCardAnswer(' + c.id + ')">提交答案</button>' +
            '<div class="calc-card-feedback" id="calc-fb-' + c.id + '"></div>' +
            '<span class="calc-card-symbol-toggle" onclick="event.stopPropagation();toggleCalcCardSymbols(' + c.id + ')">🔣 特殊符号</span>' +
            '<div class="calc-card-symbol-palette zk-hidden" id="calc-sym-' + c.id + '" onclick="event.stopPropagation()">' +
            QUIZ_SYMBOLS.map(function(s) {
              return '<button type="button" class="calc-card-symbol-btn zk-btn-outline" onclick="insertCalcCardSymbol(' + c.id + ',\'' + s + '\')">' + s + '</button>';
            }).join('') +
            '</div>';
          // 计算卡背面：定义/公式说明 + 举例 + 考点 + 解题步骤 + 最终答案
          backContent = '<div class="calc-card-type-badge">🧮 计算题</div>';
          if (c.def) {
            backContent += '<div class="recite-card-section"><span class="recite-section-label def-label">📋 定义</span><div class="recite-section-content">' + esc(c.def) + '</div></div>';
          }
          if (c.ex || c.exImage) {
            var exHtmlCalc = '';
            if (c.ex) exHtmlCalc += esc(c.ex);
            if (c.exImage) exHtmlCalc += '<div class="recite-ex-image"><img src="' + esc(c.exImage) + '" alt="示意图" /></div>';
            backContent += '<div class="recite-card-section"><span class="recite-section-label ex-label">💡 举例</span><div class="recite-section-content">' + exHtmlCalc + '</div></div>';
          }
          if (c.exam) {
            backContent += '<div class="recite-card-section"><span class="recite-section-label exam-label">🎯 考点</span><div class="recite-section-content">' + esc(c.exam) + '</div></div>';
          }
          if (c.formula) {
            backContent += '<div class="calc-formula"><b>公式：</b>' + esc(c.formula) + '</div>';
          }
          if (c.steps && c.steps.length) {
            backContent += '<div class="recite-card-section"><span class="recite-section-label ex-label">📝 解题步骤</span><ul class="calc-steps">';
            c.steps.forEach(function(s, i) {
              backContent += '<li><b>步骤' + (i+1) + '：</b>' + esc(s) + '</li>';
            });
            backContent += '</ul></div>';
          }
          if (c.answer) {
            backContent += '<div class="calc-answer-final">最终答案：' + esc(c.answer) + '</div>';
          }
        } else {
          // 记忆卡（保持原有逻辑）
          if (c.def || c.ex || c.exam) {
            if (c.def) backContent += '<div class="recite-card-section"><span class="recite-section-label def-label">📋 定义</span><div class="recite-section-content">' + esc(c.def) + '</div></div>';
            if (c.ex || c.exImage) {
              var exHtml = '';
              if (c.ex) exHtml += esc(c.ex);
              if (c.exImage) exHtml += '<div class="recite-ex-image"><img src="' + esc(c.exImage) + '" alt="示意图" /></div>';
              backContent += '<div class="recite-card-section"><span class="recite-section-label ex-label">💡 举例</span><div class="recite-section-content">' + exHtml + '</div></div>';
            }
            if (c.exam) backContent += '<div class="recite-card-section"><span class="recite-section-label exam-label">🎯 考点</span><div class="recite-section-content">' + esc(c.exam) + '</div></div>';
          } else if (c.answer) {
            backContent = '<div class="recite-card-answer">' + esc(c.answer) + '</div>';
          }
        }

        return '<div class="recite-card' + (isCalc ? ' calc' : '') + '" id="card-' + c.id + '" onclick="flipCard(this)">' +
          '<div class="recite-card-inner">' +
          '<div class="recite-card-front">' +
          '<div class="recite-card-chapter">' + (c.chapter || '未分类') + (isCalc ? ' · 计算' : '') + '</div>' +
          '<div class="recite-card-label">' + (isCalc ? '计算' : '问题') + '</div>' +
          '<div class="recite-card-question">' + esc(c.question) + '</div>' +
          (c.hint ? '<div class="calc-card-hint">💡 ' + esc(c.hint) + '</div>' : '') +
          frontExtra +
          '<span class="recite-mastery ' + c.mastery + '">' + masteryLabel[c.mastery] + '</span>' +
          '</div>' +
          '<div class="recite-card-back">' +
          '<div class="recite-card-label">' + (isCalc ? '解析' : '答案') + '</div>' +
          backContent +
          '<div class="recite-card-actions" onclick="event.stopPropagation()">' +
          '<button class="recite-card-btn known' + (c.mastery === 'known' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'known\')"><span>✓ 掌握</span></button>' +
          '<button class="recite-card-btn unsure' + (c.mastery === 'unsure' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unsure\')"><span>○ 不熟</span></button>' +
          '<button class="recite-card-btn unknown' + (c.mastery === 'unknown' ? ' active' : '') + '" onclick="setMastery(' + c.id + ',\'unknown\')"><span>✗ 不会</span></button>' +
          '<a class="recite-card-btn practice" href="练习测验.html?subject=' + currentSubject + '&from=recite' + (c.chapter ? '&chapter=' + encodeURIComponent(c.chapter) : '') + '" onclick="event.stopPropagation()">📝 练习</a>' +
          '<button class="recite-card-btn delete" onclick="deleteCard(' + c.id + ')">删</button>' +
          '</div></div></div></div>';
      }).join('');
      adjustCardHeights();
    }

    function adjustCardHeights() {
      document.querySelectorAll('.recite-card-inner').forEach(function(inner) {
        var front = inner.querySelector('.recite-card-front');
        var back = inner.querySelector('.recite-card-back');
        var card = inner.closest('.recite-card');
        if (!front || !back) return;
        inner.style.removeProperty('--card-min-h');
        var target = card && card.classList.contains('flipped') ? back : front;
        inner.style.setProperty('--card-min-h', target.scrollHeight + 'px');
      });
    }

    function flipCard(el) {
      var inner = el.querySelector('.recite-card-inner');
      var front = inner.querySelector('.recite-card-front');
      var back = inner.querySelector('.recite-card-back');
      el.classList.toggle('flipped');
      var target = el.classList.contains('flipped') ? back : front;
      if (target) inner.style.setProperty('--card-min-h', target.scrollHeight + 'px');
    }

    function scrollToCard(id) {
      var el = document.getElementById('card-' + id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flipped');
        setTimeout(function() { el.classList.remove('flipped'); }, 2000);
      }
    }

    function setMastery(id, mastery) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === id; });
      if (c) { c.mastery = mastery; saveMastery(); saveData(); renderAll(); }
    }

    // 计算卡：评分
    function checkCalcCardAnswer(cardId) {
      var cards = getCards(currentSubject);
      var c = cards.find(function(x) { return x.id === cardId; });
      if (!c) return;
      var input = document.getElementById('calc-input-' + cardId);
      var fb = document.getElementById('calc-fb-' + cardId);
      if (!input || !fb) return;
      var userAns = input.value.trim();
      if (!userAns) { fb.className = 'calc-card-feedback show wrong'; fb.textContent = '请先输入答案'; return; }

      var correct = c.answer || '';
      var aliases = c.answerAliases || [];
      var allAnswers = [correct].concat(aliases);
      var isCorrect = allAnswers.some(function(a) {
        if (!a) return false;
        // 归一化：去空格、转小写
        var normA = a.replace(/\s+/g, '').toLowerCase();
        var normU = userAns.replace(/\s+/g, '').toLowerCase();
        return normA === normU || normA.indexOf(normU) >= 0 || normU.indexOf(normA) >= 0;
      });

      if (isCorrect) {
        fb.className = 'calc-card-feedback show correct';
        fb.textContent = '✅ 答案正确！点击卡片查看解题步骤';
        // 答对自动升级掌握度
        if (c.mastery === 'unknown') setMastery(cardId, 'unsure');
        else if (c.mastery === 'unsure') setMastery(cardId, 'known');
      } else {
        fb.className = 'calc-card-feedback show wrong';
        fb.textContent = '❌ 答案不正确，点击卡片查看解析';
        // 答错自动标记为不会
        if (c.mastery !== 'unknown') setMastery(cardId, 'unknown');
      }
    }

    // 计算卡：符号面板切换
    function toggleCalcCardSymbols(cardId) {
      var pal = document.getElementById('calc-sym-' + cardId);
      if (!pal) return;
      pal.classList.toggle('zk-hidden');
    }

    // 计算卡：插入符号
    function insertCalcCardSymbol(cardId, sym) {
      var input = document.getElementById('calc-input-' + cardId);
      if (!input) return;
      var start = input.selectionStart || 0;
      var end = input.selectionEnd || 0;
      var val = input.value;
      input.value = val.substring(0, start) + sym + val.substring(end);
      input.selectionStart = input.selectionEnd = start + sym.length;
      input.focus();
    }

    function deleteCard(id) {
      var cards = getCards(currentSubject);
      var idx = cards.findIndex(function(x) { return x.id === id; });
      if (idx >= 0) { cards.splice(idx, 1); saveData(); renderAll(); }
    }

    function addCard() {
      var chapter = document.getElementById('cardChapter').value.trim();
      var question = document.getElementById('cardQuestion').value.trim();
      var answer = document.getElementById('cardAnswer').value.trim();
      var hint = document.getElementById('cardHint').value.trim();
      var mastery = document.getElementById('cardMastery').value;

      if (!question || !answer) {
        alert('请填写问题和答案');
        return;
      }

      var cards = getCards(currentSubject);
      cards.push({
        id: Date.now(),
        chapter: chapter,
        question: question,
        answer: answer,
        hint: hint,
        mastery: mastery
      });
      saveData();

      document.getElementById('cardChapter').value = '';
      document.getElementById('cardQuestion').value = '';
      document.getElementById('cardAnswer').value = '';
      document.getElementById('cardHint').value = '';
      document.getElementById('cardMastery').value = 'unknown';
      renderAll();
    }

    function renderAll() {
      renderStats();
      updateChapterFilter();
      renderCards();
      updateGuideFlow();
    }

    function updateGuideFlow() {
      var cards = getCards(currentSubject);
      var guide = document.getElementById('guideFlow');
      var btn = document.getElementById('guideBtn');
      if (!guide || !btn) return;
      if (cards.length === 0) { guide.classList.remove('zk-show'); return; }
      guide.classList.add('zk-show');
      var basePath = (location.protocol === 'file:') ? '' : '';
      btn.href = basePath + '练习测验.html?subject=' + currentSubject + '&from=recite';
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.recite-view-btn').forEach(function(btn) {
        btn.classList.toggle('zk-active', btn.dataset.view === view);
      });
      renderAll();
    }

    function switchSubject(subject) {
      currentSubject = subject;
      renderAll();
    }

    document.getElementById('btnViewToday').addEventListener('click', function() { switchView('today'); });
    document.getElementById('btnViewTotal').addEventListener('click', function() { switchView('total'); });
    function setCardTypeFilter(type, btn) {
      currentCardType = type;
      btn.parentElement.querySelectorAll('.card-type-btn').forEach(function(b) {
        b.classList.remove('zk-active');
      });
      btn.classList.add('zk-active');
      renderCards();
    }
    document.getElementById('filterChapter').addEventListener('change', renderCards);
    document.getElementById('filterMastery').addEventListener('change', renderCards);
    document.getElementById('addCardBtn').addEventListener('click', addCard);

    loadData();
    var dataBase = API_BASE ? API_BASE + '/data' : '../../data';
    // 三科均改用知识框架 JSON 作为数据源
    var cardSources = [
      ['02324', dataBase + '/knowledge-framework-02324.json?v=' + DATA_VERSION],
      ['13015', dataBase + '/knowledge-framework-13015.json?v=' + DATA_VERSION],
      ['13003', dataBase + '/knowledge-framework-13003.json?v=' + DATA_VERSION]
    ];
    var apiCalls = [
      fetch(apiUrl('/api/recite-mastery'), { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(d) { window.__apiMastery = d; _apiLoaded = true; })
        .catch(function(e) { _apiLoaded = true; }),
      // 加载学习计划，提取当前周次的章节列表
      fetch(dataBase + '/study-plan.json?v=' + DATA_VERSION, { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(plan) {
          if (!plan || !plan.weeks) return;
          // 找到当前周
          var currentWeek = plan.weeks.find(function(w) { return w.isCurrent; });
          if (!currentWeek) return;
          // 按科目代码提取章节
          Object.keys(SUBJECT_NAME_MAP).forEach(function(code) {
            var subjectName = SUBJECT_NAME_MAP[code];
            var chs = [];
            (currentWeek.goals || []).forEach(function(g) {
              if (g.subject === subjectName && g.chapter) {
                chs.push(g.chapter);
              }
            });
            if (chs.length > 0) todayChapters[code] = chs;
          });
        })
        .catch(function(e) {})
    ];
    Promise.all(cardSources.map(function(src) {
      return fetch(src[1], { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if ((src[0] === '02324' || src[0] === '13003' || src[0] === '13015') && data && data.chapters) {
            // 知识框架格式：转换为卡片
            var transformed = transformKfToCards(data);
            if (transformed.length > 0) PRESET_CARDS[src[0]] = transformed;
          } else if (data && Array.isArray(data) && data.length > 0) {
            PRESET_CARDS[src[0]] = data;
          }
        })
        .catch(function(e) {});
    }).concat(apiCalls)).finally(function() {
      loadPresetCards();
      switchSubject(currentSubject);
    });
  </script>
</body>
</html>
