<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核心概念背诵卡</title>
  <script src="../../js/shared/theme-sync.js?v=34edb9ba"></script>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/自考学习/背诵与简答.css">
<link rel="stylesheet" href="../../styles/自考学习/知识库.css">
</head>
<body>
  <article class="recite-page">
    <div class="recite-view-tabs">
      <button class="recite-view-btn zk-active zk-seg" data-view="today" id="btnViewToday">📌 今日任务</button>
      <button class="recite-view-btn zk-seg" data-view="total" id="btnViewTotal">📚 总任务</button>
      <button class="recite-view-btn zk-seg" data-view="knowledge" id="btnViewKnowledge">📚 知识点</button>
    </div>

    <div class="recite-section" id="sectionStats">
      <h2 id="statsTitle">📊 今日统计</h2>
      <div class="recite-stats">
        <div class="recite-stat"><div class="recite-stat-num" id="statTotal">0</div><div class="recite-stat-label">总卡片</div></div>
        <div class="recite-stat recite-stat-known"><div class="recite-stat-num" id="statKnown">0</div><div class="recite-stat-label">已掌握</div></div>
        <div class="recite-stat recite-stat-unsure"><div class="recite-stat-num" id="statUnsure">0</div><div class="recite-stat-label">不熟练</div></div>
        <div class="recite-stat recite-stat-unknown"><div class="recite-stat-num" id="statUnknown">0</div><div class="recite-stat-label">不会</div></div>
      </div>
    </div>

    <div class="recite-section" id="sectionAdd">
      <h2>➕ 新建卡片</h2>
      <div class="recite-add-form">
        <input type="text" id="cardChapter" placeholder="章节（如：第2章 数据表示）" />
        <select id="cardMastery">
          <option value="unknown">不会</option>
          <option value="unsure">不熟练</option>
          <option value="known">已掌握</option>
        </select>
        <input type="text" id="cardQuestion" placeholder="正面：问题/术语（如：什么是补码？）" />
        <input type="text" id="cardHint" placeholder="提示（选填，如：注意0的表示）" />
        <textarea id="cardAnswer" placeholder="背面：答案/定义/解释"></textarea>
        <button id="addCardBtn" class="zk-btn-primary">添加卡片</button>
      </div>
    </div>

    <div class="recite-section" id="sectionCards">
      <h2 id="cardsTitle">🎴 今日卡片</h2>
      <div class="recite-filter" id="cardFilter">
        <div class="card-type-filter">
          <button class="card-type-btn zk-active zk-seg" onclick="setCardTypeFilter('all', this)">全部卡片</button>
          <button class="card-type-btn memory zk-seg" onclick="setCardTypeFilter('memory', this)">🧠 记忆卡</button>
          <button class="card-type-btn calc zk-seg" onclick="setCardTypeFilter('calculation', this)">🧮 计算卡</button>
          <button class="card-type-btn freq zk-seg" id="btnSortFreq" onclick="toggleFreqSort(this)">🔥 频考优先</button>
        </div>
        <select id="filterChapter">
          <option value="">全部章节</option>
        </select>
        <select id="filterMastery">
          <option value="">全部掌握度</option>
          <option value="known">已掌握</option>
          <option value="unsure">不熟练</option>
          <option value="unknown">不会</option>
        </select>
      </div>
      <p class="recite-hint">💡 点击卡片翻转查看答案 · 章节内按不会→不熟→掌握排列</p>
      <div class="recite-card-grid" id="cardGrid"></div>
      <div class="recite-guide-flow" id="guideFlow">
        <a class="recite-guide-btn zk-btn-primary" id="guideBtn" href="#">
          ✅ 去练习测验 →
          <div class="recite-guide-subtext">点击检验今日学习成果</div>
        </a>
      </div>
    </div>

    <!-- 知识库视图 -->
    <div class="recite-section" id="sectionKnowledge" style="display:none;">
      <div class="kb-topbar">
        <span class="kb-title">📚 知识点</span>
        <span class="kb-stat"><b id="kbstatTotal">0</b> 个知识点</span>
        <span class="kb-stat">⭐ 平均 <b id="kbstatAvgWeight">0</b></span>
      </div>
      <div class="kb-filter-row">
        <select class="kb-filter kb-f-blue" id="kbfilterChapter">
          <option value="">全部章节</option>
        </select>
        <select class="kb-filter kb-f-purple" id="kbfilterWeight">
          <option value="">全部权重</option>
          <option value="5">⭐⭐⭐⭐⭐ 5星</option>
          <option value="4">⭐⭐⭐⭐ 4星及以上</option>
          <option value="3">⭐⭐⭐ 3星及以上</option>
          <option value="2">⭐⭐ 2星及以上</option>
          <option value="1">⭐ 1星</option>
        </select>
        <select class="kb-filter kb-f-green" id="kbfilterSource">
          <option value="">全部来源</option>
        </select>
        <div class="kb-search-box">
          <input type="text" id="kbsearchInput" placeholder="搜索知识点标题或内容...">
        </div>
        <span class="kb-filter-count" id="kbfilterCount">0 条</span>
      </div>
      <div class="kb-list" id="kbknowledgeList">
        <div class="kb-empty">加载中...</div>
      </div>
    </div>

    <!-- 知识库编辑弹窗 -->
    <div class="kb-modal" id="kbeditModal" style="display:none;">
      <div class="kb-modal-content">
        <div class="kb-modal-header">
          <span id="kbmodalTitle">编辑知识点</span>
          <span class="kb-modal-close" id="kbmodalClose">×</span>
        </div>
        <div class="kb-modal-body">
          <div class="kb-form-group">
            <label>标题</label>
            <input type="text" id="kbeditTitle" class="kb-form-input">
          </div>
          <div class="kb-form-group">
            <label>章节</label>
            <input type="text" id="kbeditChapter" class="kb-form-input" list="kbchapterList">
            <datalist id="kbchapterList"></datalist>
          </div>
          <div class="kb-form-group">
            <label>权重</label>
            <div class="kb-star-input" id="kbeditStars">
              <span data-star="1">⭐</span>
              <span data-star="2">⭐</span>
              <span data-star="3">⭐</span>
              <span data-star="4">⭐</span>
              <span data-star="5">⭐</span>
            </div>
          </div>
          <div class="kb-form-group">
            <label>标签（逗号分隔）</label>
            <input type="text" id="kbeditTags" class="kb-form-input">
          </div>
          <div class="kb-form-group">
            <label>内容</label>
            <textarea id="kbeditContent" class="kb-form-textarea" rows="10"></textarea>
          </div>
        </div>
        <div class="kb-modal-footer">
          <button class="kb-modal-btn" id="kbmodalCancel">取消</button>
          <button class="kb-modal-btn kb-btn-primary" id="kbmodalSave">保存</button>
        </div>
      </div>
    </div>

  </article>

  <script src="../../js/shared/utils.js?v=34edb9ba"></script>
  <script src="../../js/自考学习/exam-data-loader.js?v=34edb9ba"></script>
  <script src="../../js/自考学习/知识库.js?v=34edb9ba"></script>
  <script src="../../js/自考学习/背诵与简答.js?v=34edb9ba"></script>
</body>
</html>
