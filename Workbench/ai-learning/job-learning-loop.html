<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>岗位突击 - 学习闭环</title>
  <link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/AI学习/job-learning-loop.css">
<script src="../../js/shared/theme-sync.js"></script>
</head>
<body>
<article class="loop-page">

  <!-- Exam Countdown -->
  <div class="countdown-box">
    <div class="countdown-num" id="countdown">--</div>
    <div class="countdown-label">距离自考（10月24日）</div>
    <div class="countdown-sub" id="countdownSub">考完即投简历</div>
  </div>

  <!-- Overall Progress -->
  <div class="loop-section-title">总进度 <span class="loop-tag">入门级</span></div>
  <div class="overall-box">
    <div class="overall-num" id="overallNum">0%</div>
    <div class="overall-body">
      <div class="overall-label">入门级知识点掌握: <b id="overallText">0/17</b> · 项目完成: <b id="projectText">0/3</b></div>
      <div class="overall-bar"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Stage Roadmap -->
  <div class="loop-section-title">四阶段路线图 <span class="loop-tag">10周计划</span></div>
  <div class="stage-roadmap" id="stageRoadmap"></div>

  <!-- Five-Step Loop -->
  <div class="loop-card" style="margin-top:1.5rem">
    <div class="loop-section-title" style="margin-bottom:1rem">五步闭环 <span class="loop-tag">每个知识点</span></div>
    <div class="loop-flow">
      <div class="loop-step"><div class="step-icon">📖</div><div class="step-name">学</div><div class="step-desc">读概念+代码示例，理解原理</div><span class="step-arrow">→</span></div>
      <div class="loop-step"><div class="step-icon">✏️</div><div class="step-name">练</div><div class="step-desc">手写练习，不看答案先做</div><span class="step-arrow">→</span></div>
      <div class="loop-step"><div class="step-icon">🔍</div><div class="step-name">复</div><div class="step-desc">对比答案，找出知识盲区</div><span class="step-arrow">→</span></div>
      <div class="loop-step"><div class="step-icon">✅</div><div class="step-name">测</div><div class="step-desc">勾选掌握，进度自动更新</div><span class="step-arrow">→</span></div>
      <div class="loop-step"><div class="step-icon">🚀</div><div class="step-name">迭</div><div class="step-desc">应用到项目，巩固理解</div></div>
    </div>
  </div>

  <!-- Project Tracker -->
  <div class="loop-section-title" style="margin-top:1.5rem">简历项目追踪 <span class="loop-tag">3个项目</span></div>
  <div class="project-list" id="projectList"></div>

</article>


  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/AI学习/job-learning-loop.js"></script>
</body>
</html>
