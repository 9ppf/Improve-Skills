<body>
<article class="ainews-page">
  <div class="ainews-stats" id="statsBar">
    <div class="ainews-stat">
      <div class="ainews-stat-num" id="statTotal">—</div>
      <div class="ainews-stat-label">本期条目</div>
    </div>
    <div class="ainews-stat">
      <div class="ainews-stat-num" id="statPolicy">—</div>
      <div class="ainews-stat-label">政策补贴</div>
    </div>
    <div class="ainews-stat">
      <div class="ainews-stat-num" id="statProduct">—</div>
      <div class="ainews-stat-label">产品动态</div>
    </div>
    <div class="ainews-stat">
      <div class="ainews-stat-num" id="statWeek">—</div>
      <div class="ainews-stat-label">已积累期数</div>
    </div>
  </div>

  <div class="ainews-filter" id="filterBar">
    <button class="ainews-filter-btn active" data-cat="all">全部</button>
    <button class="ainews-filter-btn" data-cat="policy">📋 政策补贴</button>
    <button class="ainews-filter-btn" data-cat="product">🚀 产品动态</button>
    <button class="ainews-filter-btn" data-cat="research">🔬 研究进展</button>
    <button class="ainews-filter-btn" data-cat="tutorial">📚 教程资源</button>

  <div id="digestContainer">
    <div class="ainews-loading">正在加载资讯…</div>
  </div>

  <div class="ainews-archive" id="archiveSection" style="display:none;">
    <div class="ainews-archive-title">📜 历史周报</div>
    <div class="ainews-archive-list" id="archiveList"></div>
  </div>
</article>
