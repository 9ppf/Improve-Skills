<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 帮我复盘代码</title>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/AI学习/ai-code-review.css">
<script src="../../js/shared/theme-sync.js"></script>
</head>
<body>
<article class="ai-code-page">
  <section class="ai-code-input-section">
    <label class="ai-code-label" for="aiCodeInput">粘贴 Python 代码</label>
    <textarea class="ai-code-input" id="aiCodeInput" placeholder="# 在此粘贴你的 Python 代码...&#10;&#10;def hello():&#10;    print(&quot;Hello, World!&quot;)"></textarea>
    <div class="ai-code-actions">
      <button class="ai-code-btn ai-code-btn-primary" id="aiCodeGenerate">生成复盘报告</button>
      <button class="ai-code-btn ai-code-btn-secondary" id="aiCodeClear">清空</button>
      <button class="ai-code-btn ai-code-btn-secondary" id="aiCodeCopyPrompt">复制提示词</button>
    </div>
  </section>

  <section class="ai-code-report" id="aiCodeReport">
    <div class="ai-code-card">
      <h2 class="ai-code-card-title">代码统计</h2>
      <div class="ai-code-stats" id="aiCodeStats"></div>
    </div>

    <div class="ai-code-card">
      <h2 class="ai-code-card-title">检查清单</h2>
      <div class="ai-code-checklist" id="aiCodeChecklist"></div>
    </div>

    <div class="ai-code-card">
      <h2 class="ai-code-card-title">优化建议</h2>
      <textarea class="ai-code-textarea" id="aiCodeSuggestions" placeholder="在此写下你的优化建议，例如：&#10;- 可以用列表推导式简化循环&#10;- 建议提取公共逻辑为独立函数&#10;- 变量名 xx 建议改为更语义化的名称"></textarea>
    </div>

    <div class="ai-code-card">
      <h2 class="ai-code-card-title">复杂度分析</h2>
      <div class="ai-code-complexity">
        <div>
          <label class="ai-code-label">时间复杂度</label>
          <textarea class="ai-code-textarea" id="aiCodeTimeComplexity" placeholder="例如：O(n log n)&#10;外层循环 n 次，内层排序 log n"></textarea>
        </div>
        <div>
          <label class="ai-code-label">空间复杂度</label>
          <textarea class="ai-code-textarea" id="aiCodeSpaceComplexity" placeholder="例如：O(n)&#10;使用了一个长度为 n 的辅助数组"></textarea>
        </div>
      </div>
    </div>

    <div class="ai-code-card">
      <h2 class="ai-code-card-title">复盘总结</h2>
      <textarea class="ai-code-textarea ai-code-textarea-lg" id="aiCodeSummary" placeholder="在此写下本次复盘的总结，包括：&#10;- 整体代码质量评价&#10;- 主要发现的问题&#10;- 后续改进方向"></textarea>
    </div>
  </section>

  <section class="ai-code-preset-section">
    <h2 class="ai-code-section-title">预设提示词</h2>
    <pre class="ai-code-preset-prompt" id="aiCodePresetPrompt">请帮我复盘以下 Python 代码，从以下几个方面分析：
1. 代码风格：是否符合 PEP 8，变量命名是否规范
2. 潜在 Bug：是否有未处理的异常、边界情况、类型错误
3. 性能优化：时间复杂度和空间复杂度分析，是否有更优实现
4. 安全隐患：是否有 eval/exec/SQL 注入等风险
5. 可读性改进：是否需要添加注释、提取函数、简化逻辑

代码如下：</pre>
  </section>

  <div class="ai-code-toast" id="aiCodeToast"></div>
</article>



  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/AI学习/ai-code-review.js"></script>
</body>
</html>
