<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 学习规划师 · 统筹与单科指导</title>
<link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/AI学习/ai-roles-hub.css">
<script src="../../js/shared/theme-sync.js"></script>
</head>
<body>
<article class="ai-role-page">
  <div class="ai-role-mode-badge" id="modeBadge">加载中...</div>

  <section class="ai-role-reference">
    <h2>角色能力参考</h2>
    <nav class="ai-role-tabs" id="roleTabs"></nav>
    <div class="ai-role-desc" id="roleDesc"></div>
  </section>

  <section class="ai-context-card" id="contextCard">
    <h2>当前学习上下文</h2>
    <div class="ai-loading" id="contextLoading">正在读取进度数据...</div>
    <div class="ai-context-grid" id="contextGrid" style="display:none"></div>
    <div class="ai-context-chapters" id="contextChapters" style="display:none"></div>
  </section>

  <section class="ai-scenario-section">
    <div class="ai-mode-switcher" id="modeSwitcher">
      <button class="ai-mode-tab active" data-mode="prompt">📝 提示词模式</button>
      <button class="ai-mode-tab" data-mode="chat">💬 AI 对话模式</button>
    </div>
    <h2 class="ai-scenario-title" id="scenarioTitle">常用场景</h2>
    <div class="ai-scenario-grid" id="scenarioGrid"></div>
  </section>

  <section class="ai-custom-section">
    <h2>自定义需求</h2>
    <textarea class="ai-role-textarea" id="customRequest" placeholder="例如：我本周只有 10 小时，请帮我重新安排各科优先级..."></textarea>
    <div class="ai-role-actions">
      <button class="ai-role-btn ai-role-btn-primary" id="generateCustom">生成提示词</button>
      <button class="ai-role-btn ai-btn-generate" id="chatCustom">💬 直接对话</button>
      <button class="ai-role-btn ai-role-btn-secondary" id="clearCustom">清空</button>
    </div>
  </section>

  <section class="ai-output-section" id="outputSection" style="display:none">
    <h2>生成的提示词</h2>
    <pre class="ai-output-text" id="outputText"></pre>
    <div class="ai-role-actions">
      <button class="ai-role-btn ai-role-btn-primary" id="copyOutput">复制提示词</button>
      <button class="ai-role-btn ai-btn-generate" id="generateDirect">⚡ 直接生成</button>
      <button class="ai-role-btn ai-role-btn-secondary" id="clearOutput">清空</button>
    </div>
  </section>

  <section class="ai-chat-section" id="aiChatSection" style="display:none">
    <h2 style="font-size:1.05rem;margin-bottom:0.75rem;">AI 助手对话</h2>
    <div class="ai-chat-display" id="aiChatDisplay"></div>
    <div class="ai-chat-input-wrap">
      <textarea class="ai-chat-input" id="aiFollowUp" placeholder="输入追问或调整需求（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
      <button class="ai-role-btn ai-role-btn-primary" id="aiSendBtn">发送追问</button>
    </div>
  </section>

  <div class="ai-role-toast" id="aiRoleToast"></div>
</article>



  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/AI学习/ai-roles-hub.js"></script>
</body>
</html>
