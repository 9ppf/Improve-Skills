  var roleOrder = ["planner", "organizer", "explainer", "collector", "reviewer", "reminder"];

  var tabsEl       = document.getElementById("aiRoleTabs");

  var toastEl      = document.getElementById("aiRoleToast");

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("ai-role-show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove("ai-role-show");
    }, 2000);
  }

  /* ---------- Clipboard ---------- */
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast("已复制到剪贴板");
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("已复制到剪贴板");
    } catch (e) {
      showToast("复制失败，请手动复制");
    }
    document.body.removeChild(ta);
  }

  /* ---------- URL / Hash ---------- */
  function getRoleFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var role = params.get("role");
    if (role && roles[role]) return role;

    var hash = window.location.hash;
    if (hash) {
      var hashRole = hash.replace(/^#/, "").replace(/^role=/, "");
      if (hashRole && roles[hashRole]) return hashRole;
    }

    return "planner";
  }

  function updateHash(role) {
    if (window.location.hash !== "#" + role) {
      window.location.hash = role;
    }
  }

  /* ---------- Render Tabs ---------- */
  function renderTabs() {
    tabsEl.innerHTML = "";
    roleOrder.forEach(function(key) {
      var r = roles[key];
      var btn = document.createElement("button");
      btn.className = "ai-role-tab" + (key === currentRole ? " ai-role-active" : "");
      btn.setAttribute("data-role", key);
      btn.innerHTML =
        '<span class="ai-role-tab-icon">' + r.icon + "</span>" +
        "<span>" + r.name + "</span>";
      btn.addEventListener("click", function() {
        switchRole(key);
      });
      tabsEl.appendChild(btn);
    });
  }

  /* ---------- Render Role Card ---------- */

    var r = roles[currentRole];

    var capabilitiesHtml = r.capabilities.map(function(c) {
      return '<span class="ai-role-capability">' + c + "</span>";
    }).join("");

    cardEl.innerHTML =
      '<div class="ai-role-card-header">' +
        '<div class="ai-role-card-icon">' + r.icon + "</div>" +

        "</div>" +
      "</div>" +

        '<div class="ai-role-capabilities">' + capabilitiesHtml + "</div>" +
      "</div>" +
      '<div class="ai-role-card-section">' +
        '<div class="ai-role-card-section-title">使用示例</div>' +
        '<div class="ai-role-example">' + r.example + "</div>" +
      "</div>";
  }

  /* ---------- Render Prompts ---------- */
  function renderPrompts() {
    var r = roles[currentRole];
    promptListEl.innerHTML = "";

    r.prompts.forEach(function(prompt, index) {
      var card = document.createElement("div");
      card.className = "ai-role-prompt-card";

      var textareaId = "aiRoleCustom_" + index;

      card.innerHTML =
        '<h3 class="ai-role-prompt-title">' + prompt.title + "</h3>" +
        '<pre class="ai-role-prompt-text">' + escapeHtml(prompt.text) + "</pre>" +
        '<div class="ai-role-prompt-actions">' +
          '<button class="ai-role-btn ai-role-btn-primary ai-role-btn-sm" data-action="copy-original">复制原文</button>' +
        "</div>" +
        '<label class="ai-role-prompt-custom-label" for="' + textareaId + '">自定义（可编辑后复制）</label>' +
        '<textarea class="ai-role-prompt-custom" id="' + textareaId + '" placeholder="默认填入提示词原文，可在此修改...">' + escapeHtml(prompt.text) + "</textarea>" +
        '<div class="ai-role-prompt-actions">' +
          '<button class="ai-role-btn ai-role-btn-secondary ai-role-btn-sm" data-action="copy-custom">复制自定义内容</button>' +
        "</div>";

      var copyOriginalBtn = card.querySelector('[data-action="copy-original"]');
      var copyCustomBtn = card.querySelector('[data-action="copy-custom"]');
      var customTextarea = card.querySelector("#" + textareaId);

      copyOriginalBtn.addEventListener("click", function() {
        copyToClipboard(prompt.text);
      });

      copyCustomBtn.addEventListener("click", function() {
        var customText = customTextarea.value.trim();
        if (customText) {
          copyToClipboard(customText);
        } else {
          showToast("自定义内容为空");
          customTextarea.focus();
        }
      });

      promptListEl.appendChild(card);
    });
  }

    div.textContent = str;
    return div.innerHTML;

  /* ---------- Switch Role ---------- */
  function switchRole(role) {
    if (!roles[role]) role = "planner";
    currentRole = role;
    updateHash(role);

    var tabs = tabsEl.querySelectorAll(".ai-role-tab");
    tabs.forEach(function(tab) {
      tab.classList.toggle("ai-role-active", tab.getAttribute("data-role") === role);
    });

    renderCard();
    renderPrompts();
    retriggerAnimation();
  }

  /* ---------- Event Bindings ---------- */
  copyQBtn.addEventListener("click", function() {
    var text = questionEl.value.trim();
    if (text) {
      copyToClipboard(text);
    } else {
      showToast("请先输入问题");
      questionEl.focus();
    }
  });

  clearBtn.addEventListener("click", function() {
    questionEl.value = "";
    showToast("已清空");
    questionEl.focus();
  });

  window.addEventListener("hashchange", function() {
    var role = getRoleFromUrl();
    if (role !== currentRole) {
      switchRole(role);
    }
  });

  /* ---------- Init ---------- */
  currentRole = getRoleFromUrl();
  renderTabs();
  renderCard();
  renderPrompts();
})();
</script>
</body>
</html>
