<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>岗位技能图谱</title>
  <link rel="stylesheet" href="../../styles/shared/base-vars.css">
<link rel="stylesheet" href="../../styles/shared/base.css">
<link rel="stylesheet" href="../../styles/shared/components.css">
<link rel="stylesheet" href="../../styles/AI学习/job-skill-tree.css">
<script src="../../js/shared/theme-sync.js"></script>
</head>
<body>
<article class="ai-page">
  <div class="ai-toolbar">
    <div class="ai-search">
      <span class="ai-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索知识点...">
    </div>
    <div class="ai-progress">
      <span>入门进度</span>
      <div class="ai-progress-bar"><div class="ai-progress-fill" id="progressFill"></div></div>
      <b id="progressText">0/17</b>
    </div>
  </div>
  <div class="today-panel" id="todayPanel" style="display:none">
    <div class="today-tasks" id="todayTasks"><h3>📌 今日AI任务</h3></div>
    <div class="today-guide" id="todayGuide"><h3>📚 教学指引</h3><p class="ai-guide-hint">点击左侧任务查看教学指引</p></div>
  </div>
  <div class="stage-tabs" id="stageTabs"></div>
  <div class="kp-list" id="kpList"></div>
</article>


  <script src="../../js/shared/utils.js"></script>
  <script src="../../js/AI学习/job-skill-tree.js"></script>
</body>
</html>
